<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arizona Fall League Central - Rosters</title>
<style>
  :root {
    --bg: #FDFCFB;
    --bg-card: #FFFFFF;
    --border: #e8e6e2;
    --text: #111418;
    --text-muted: #5a6472;
    --accent: #b8860b;
    --final: #1a8a4a;
    --cancelled: #c0392b;
    --scheduled: #2f6fb0;
    --header-bg: #0d1b3a;
    --header-card-bg: #16305c;
    --header-border: #2c4a7c;
    --header-text: #ffffff;
    --tab-active: #f26522;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    line-height: 1.5;
  }
  header {
    padding: 1.5rem 1.5rem 0;
  }
  .header-inner {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 2.5rem;
    max-width: 900px;
    margin: 0 auto;
    background: var(--header-bg);
    border-radius: 16px;
    padding: 2.25rem 1.5rem;
  }
  h1 {
    font-size: 2.2rem;
    font-weight: 600;
    margin: 0;
    letter-spacing: -0.01em;
    text-align: center;
    color: var(--header-text);
  }
  .league-logo {
    height: 100px;
    width: auto;
    flex-shrink: 0;
  }
  .header-inner > a {
    display: inline-flex;
    flex-shrink: 0;
    line-height: 0;
  }
  .title-line {
    display: block;
    line-height: 1.3;
  }
  .title-central {
    display: inline-block;
    border-bottom: 2px solid var(--header-text);
    padding-bottom: 0.2rem;
    width: fit-content;
  }
  footer {
    max-width: 900px;
    margin: 0 auto;
    padding: 1.5rem 1.5rem 3rem;
    text-align: center;
  }
  .subtitle {
    color: var(--text-muted);
    font-size: 0.75rem;
    margin: 0;
  }
  .season-control {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100px;
    gap: 0.4rem;
    flex-shrink: 0;
  }
  .season-label {
    color: var(--header-text);
    font-size: 1.15rem;
    font-weight: 600;
  }
  .season-select {
    background: var(--header-card-bg);
    border: 1px solid var(--header-border);
    color: var(--header-text);
    padding: 0.5rem 1rem;
    border-radius: 6px;
    cursor: pointer;
    font-size: 0.9rem;
    font-weight: 600;
    font-family: inherit;
  }
  .nav-tabs {
    display: flex;
    justify-content: center;
    gap: 2rem;
    max-width: 900px;
    margin: 1.25rem auto 0;
    padding: 0 1.5rem;
    border-bottom: 1px solid var(--border);
  }
  .nav-tab {
    display: inline-block;
    padding-bottom: 0.7rem;
    margin-bottom: -1px;
    color: var(--text-muted);
    font-weight: 600;
    font-size: 0.95rem;
    text-decoration: none;
    border-bottom: 3px solid transparent;
  }
  .nav-tab:hover {
    color: var(--text);
  }
  .nav-tab.active {
    color: var(--text);
    font-weight: 700;
    border-bottom-color: var(--tab-active);
  }
  main {
    max-width: 900px;
    margin: 0 auto;
    padding: 2rem 1.5rem 3rem;
  }
  .team-filter-bar {
    display: flex;
    justify-content: center;
    margin-bottom: 1.75rem;
  }
  .filter-group {
    display: flex;
    flex-direction: column;
    gap: 0.3rem;
  }
  .filter-group label {
    font-size: 0.78rem;
    color: var(--text-muted);
    font-weight: 600;
    text-align: center;
  }
  .filter-group select {
    background: var(--bg-card);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 0.5rem 1.5rem;
    border-radius: 6px;
    font-size: 0.95rem;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
  }
  .roster-heading {
    display: flex;
    align-items: center;
    gap: 1rem;
    margin-bottom: 1.25rem;
  }
  .roster-heading-logo {
    width: 48px;
    height: 48px;
    object-fit: contain;
    flex-shrink: 0;
  }
  .roster-heading-name {
    font-size: 1.5rem;
    font-weight: 700;
    color: var(--text);
  }
  .position-group-label {
    color: var(--tab-active);
    font-size: 0.85rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    margin: 0 0 0.5rem;
  }
  .roster-table {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
    box-shadow: 0 1px 2px rgba(0,0,0,0.04);
    margin-bottom: 1.25rem;
  }
  .roster-row {
    display: grid;
    grid-template-columns: 0.6fr 2.5fr 0.8fr;
    padding: 0.6rem 1.1rem;
    align-items: center;
  }
  .roster-row.head {
    background: #f2f1ee;
    color: var(--text-muted);
    font-size: 0.72rem;
    font-weight: 700;
    text-transform: uppercase;
  }
  .roster-row.body {
    border-top: 1px solid var(--border);
  }
  .roster-row.body .jersey {
    color: var(--text-muted);
  }
  .roster-row.body .pos {
    color: var(--text-muted);
  }
  .player-link {
    color: var(--text);
    text-decoration: none;
    border-bottom: 1px dashed transparent;
  }
  .player-link:hover {
    color: var(--tab-active);
    border-bottom-color: var(--tab-active);
  }
  .transaction-log-title {
    font-size: 1.1rem;
    font-weight: 700;
    color: var(--text);
    margin: 2rem 0 0.6rem;
  }
  .transaction-table {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
    box-shadow: 0 1px 2px rgba(0,0,0,0.04);
  }
  .transaction-row {
    display: grid;
    grid-template-columns: 0.9fr 3fr;
    padding: 0.8rem 1.2rem;
    align-items: center;
    font-size: 0.88rem;
  }
  .transaction-row.head {
    background: #ececec;
    font-weight: 700;
    color: var(--text);
    font-size: 0.85rem;
  }
  .transaction-row.body {
    border-top: 1px solid var(--border);
    color: var(--text);
  }
  .transaction-row.body a {
    color: var(--tab-active);
    text-decoration: none;
    font-weight: 600;
  }
  .transaction-expand-wrap {
    text-align: center;
    margin-top: 0.75rem;
  }
  .transaction-expand-link {
    color: var(--text-muted);
    font-size: 0.85rem;
    font-weight: 600;
    text-decoration: none;
    border-bottom: 1px dashed var(--text-muted);
  }
  .error {
    color: var(--cancelled);
  }
  .loading {
    color: var(--text-muted);
  }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <a href="index.html"><img class="league-logo" src="logos/afl-logo.svg" alt="" onerror="this.style.display='none'"></a>
    <h1>
      <span class="title-line">Arizona Fall League</span>
      <span class="title-line"><span class="title-central">Central</span></span>
    </h1>
    <div class="season-control">
      <span class="season-label">Season:</span>
      <select id="season-select" class="season-select"></select>
    </div>
  </div>
</header>

<nav class="nav-tabs">
  <a class="nav-tab" href="index.html">Home</a>
  <a class="nav-tab" href="schedule.html">Schedule</a>
  <a class="nav-tab" href="standings.html">Standings</a>
  <a class="nav-tab active" href="roster.html">Rosters</a>
</nav>

<main id="content">
  <p class="loading">Loading roster...</p>
</main>

<footer>
  <p class="subtitle">Data updated automatically from the MLB Stats API</p>
</footer>

<script>
  const TEAM_LOGOS = {
    'Glendale Desert Dogs': 'logos/glendale.svg',
    'Mesa Solar Sox': 'logos/mesa.svg',
    'Peoria Javelinas': 'logos/peoria.svg',
    'Salt River Rafters': 'logos/salt-river.svg',
    'Scottsdale Scorpions': 'logos/scottsdale.svg',
    'Surprise Saguaros': 'logos/surprise.svg',
  };
  const AFL_TEAM_NAMES = Object.keys(TEAM_LOGOS);

  const POSITION_GROUPS = [
    { label: 'Pitchers', codes: ['1'] },
    { label: 'Catchers', codes: ['2'] },
    { label: 'Infielders', codes: ['3', '4', '5', '6'] },
    { label: 'Outfielders', codes: ['7', '8', '9', 'O'] },
    { label: 'Other', codes: ['10'] },
  ];

  let SEASONS = [];
  const params = new URLSearchParams(window.location.search);
  let currentSeason = parseInt(params.get('season'), 10) || new Date().getFullYear();
  let currentTeam = params.get('team') || null;
  let allRoster = [];
  let allTransactions = [];

  function parseCSV(text) {
    const lines = text.trim().split(/\r?\n/);
    if (lines.length < 2) return [];
    const headers = parseCSVLine(lines[0]);
    return lines.slice(1).map(line => {
      const values = parseCSVLine(line);
      const row = {};
      headers.forEach((h, i) => { row[h] = values[i] !== undefined ? values[i] : ''; });
      return row;
    });
  }

  function parseCSVLine(line) {
    const result = [];
    let current = '';
    let inQuotes = false;
    for (let i = 0; i < line.length; i++) {
      const char = line[i];
      if (char === '"') {
        if (inQuotes && line[i + 1] === '"') {
          current += '"';
          i++;
        } else {
          inQuotes = !inQuotes;
        }
      } else if (char === ',' && !inQuotes) {
        result.push(current);
        current = '';
      } else {
        current += char;
      }
    }
    result.push(current);
    return result;
  }

  async function loadSeasons() {
    try {
      const res = await fetch('data/seasons.json');
      if (res.ok) SEASONS = await res.json();
    } catch (e) {}
    if (!SEASONS || SEASONS.length === 0) SEASONS = [currentSeason];
    if (!SEASONS.includes(currentSeason)) currentSeason = SEASONS[SEASONS.length - 1];
  }

  function renderControls() {
    const el = document.getElementById('season-select');
    el.innerHTML = '';
    [...SEASONS].sort((a, b) => b - a).forEach(season => {
      const opt = document.createElement('option');
      opt.value = season;
      opt.textContent = season;
      if (season === currentSeason) opt.selected = true;
      el.appendChild(opt);
    });
    el.onchange = () => {
      currentSeason = parseInt(el.value, 10);
      updateUrl();
      loadRosterPage();
    };
  }

  function updateUrl() {
    const p = new URLSearchParams();
    p.set('season', currentSeason);
    if (currentTeam) p.set('team', currentTeam);
    history.replaceState(null, '', '?' + p.toString());
  }

  function teamLogoImg(name, cls) {
    const src = TEAM_LOGOS[name];
    if (!src) return '';
    return `<img class="${cls}" src="${src}" alt="" onerror="this.style.display='none'">`;
  }

  function highlightPlayerName(description, playerName, playerId, season) {
    if (!playerName || !description.includes(playerName)) return description;
    const link = `<a href="player.html?id=${playerId}&season=${season}">${playerName}</a>`;
    return description.split(playerName).join(link);
  }

  function formatShortDate(iso) {
    if (!iso) return '';
    const [y, m, d] = iso.split('-');
    return `${parseInt(m, 10)}/${parseInt(d, 10)}/${y}`;
  }

  function buildTransactionRowHtml(r) {
    const desc = highlightPlayerName(r.description, r.player_name, r.player_id, r.season);
    return `<div class="transaction-row body"><div>${formatShortDate(r.date)}</div><div>${desc}</div></div>`;
  }

  function renderTransactionTable(rows) {
    let html = `
      <div class="transaction-log-title">Transaction Log</div>
      <div class="transaction-table">
        <div class="transaction-row head"><div>Date</div><div>Transaction</div></div>
        <div id="transaction-rows-visible">
    `;

    if (rows.length === 0) {
      html += `<div class="transaction-row body"><div></div><div>No transactions found.</div></div>`;
    } else {
      rows.slice(0, 3).forEach(r => {
        html += buildTransactionRowHtml(r);
      });
    }

    html += `</div><div id="transaction-rows-hidden" style="display:none;">`;
    rows.slice(3).forEach(r => {
      html += buildTransactionRowHtml(r);
    });
    html += `</div></div>`;

    if (rows.length > 3) {
      html += `
        <div class="transaction-expand-wrap">
          <a href="#" id="transaction-expand-link" class="transaction-expand-link">Show all ${rows.length} transactions &#9662;</a>
        </div>
      `;
    }

    return html;
  }

  function wireTransactionExpand() {
    const link = document.getElementById('transaction-expand-link');
    if (!link) return;
    link.onclick = (e) => {
      e.preventDefault();
      document.getElementById('transaction-rows-hidden').style.display = 'block';
      link.style.display = 'none';
    };
  }

  function renderRoster() {
    const content = document.getElementById('content');

    if (!currentTeam) {
      currentTeam = AFL_TEAM_NAMES[0];
    }

    const teamPlayers = allRoster.filter(p => p.team === currentTeam);
    const teamTransactions = allTransactions
      .filter(t => t.team === currentTeam)
      .sort((a, b) => (a.date < b.date ? 1 : -1));

    let html = `
      <div class="team-filter-bar">
        <div class="filter-group">
          <label for="team-select">Team</label>
          <select id="team-select"></select>
        </div>
      </div>
      <div class="roster-heading">
        ${teamLogoImg(currentTeam, 'roster-heading-logo')}
        <div class="roster-heading-name">${currentTeam} Roster</div>
      </div>
    `;

    POSITION_GROUPS.forEach(group => {
      const playersInGroup = teamPlayers.filter(p => group.codes.includes(p.position_code));
      if (playersInGroup.length === 0) return;

      html += `<div class="position-group-label">${group.label}</div><div class="roster-table">`;
      html += `<div class="roster-row head"><div>#</div><div>Name</div><div>Pos</div></div>`;
      playersInGroup.forEach(p => {
        const link = `player.html?id=${p.player_id}&season=${currentSeason}`;
        html += `
          <div class="roster-row body">
            <div class="jersey">${p.jersey_number || ''}</div>
            <div><a class="player-link" href="${link}">${p.full_name}</a></div>
            <div class="pos">${p.position_abbreviation}</div>
          </div>
        `;
      });
      html += `</div>`;
    });

    html += renderTransactionTable(teamTransactions);

    content.innerHTML = html;
    wireTransactionExpand();

    const teamSelect = document.getElementById('team-select');
    AFL_TEAM_NAMES.forEach(name => {
      const opt = document.createElement('option');
      opt.value = name;
      opt.textContent = name;
      if (name === currentTeam) opt.selected = true;
      teamSelect.appendChild(opt);
    });
    teamSelect.onchange = () => {
      currentTeam = teamSelect.value;
      updateUrl();
      renderRoster();
    };
  }

  async function loadRosterPage() {
    const content = document.getElementById('content');
    content.innerHTML = '<p class="loading">Loading roster...</p>';

    try {
      const [rosterRes, txnRes] = await Promise.all([
        fetch(`data/${currentSeason}/roster.csv`),
        fetch(`data/${currentSeason}/transactions.csv`),
      ]);

      allRoster = rosterRes.ok ? parseCSV(await rosterRes.text()) : [];
      allTransactions = txnRes.ok ? parseCSV(await txnRes.text()) : [];

      if (allRoster.length === 0) {
        content.innerHTML = '<p class="error">No roster available for this season yet.</p>';
        return;
      }

      renderRoster();
    } catch (err) {
      content.innerHTML = `<p class="error">Couldn't load roster: ${err.message}</p>`;
    }
  }

  async function init() {
    await loadSeasons();
    renderControls();
    loadRosterPage();
  }

  init();
</script>

</body>
</html>
