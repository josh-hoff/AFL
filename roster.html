<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arizona Fall League Central - Rosters</title>
<style>
  :root {
    --bg: #FDFCFB;
    --bg-card: #FFFFFF;
    --border: #e8e6e2;
    --text: #111418;
    --text-muted: #5a6472;
    --accent: #b8860b;
    --final: #1a8a4a;
    --cancelled: #c0392b;
    --scheduled: #2f6fb0;
    --header-bg: #0d1b3a;
    --header-card-bg: #16305c;
    --header-border: #2c4a7c;
    --header-text: #ffffff;
    --tab-active: #f26522;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    line-height: 1.5;
  }
  header {
    padding: 1.5rem 1.5rem 0;
  }
  .header-inner {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 2.5rem;
    max-width: 900px;
    margin: 0 auto;
    background: var(--header-bg);
    border-radius: 16px;
    padding: 2.25rem 1.5rem;
  }
  h1 {
    font-size: 2.2rem;
    font-weight: 600;
    margin: 0;
    letter-spacing: -0.01em;
    text-align: center;
    color: var(--header-text);
  }
  .league-logo {
    height: 100px;
    width: auto;
    flex-shrink: 0;
  }
  .header-inner > a {
    display: inline-flex;
    flex-shrink: 0;
    line-height: 0;
  }
  .title-line {
    display: block;
    line-height: 1.3;
  }
  .title-central {
    display: inline-block;
    border-bottom: 2px solid var(--header-text);
    padding-bottom: 0.2rem;
    width: fit-content;
  }
  footer {
    max-width: 900px;
    margin: 0 auto;
    padding: 1.5rem 1.5rem 3rem;
    text-align: center;
  }
  .subtitle {
    color: var(--text-muted);
    font-size: 0.75rem;
    margin: 0;
  }
  .season-control {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100px;
    gap: 0.4rem;
    flex-shrink: 0;
  }
  .season-label {
    color: var(--header-text);
    font-size: 1.15rem;
    font-weight: 600;
  }
  .season-select {
    background: var(--header-card-bg);
    border: 1px solid var(--header-border);
    color: var(--header-text);
    padding: 0.5rem 1rem;
    border-radius: 6px;
    cursor: pointer;
    font-size: 0.9rem;
    font-weight: 600;
    font-family: inherit;
  }
  .nav-tabs {
    display: flex;
    justify-content: center;
    gap: 2rem;
    max-width: 900px;
    margin: 1.25rem auto 0;
    padding: 0 1.5rem;
    border-bottom: 1px solid var(--border);
  }
  .nav-tab {
    display: inline-block;
    padding-bottom: 0.7rem;
    margin-bottom: -1px;
    color: var(--text-muted);
    font-weight: 600;
    font-size: 0.95rem;
    text-decoration: none;
    border-bottom: 3px solid transparent;
  }
  .nav-tab:hover {
    color: var(--text);
  }
  .nav-tab.active {
    color: var(--text);
    font-weight: 700;
    border-bottom-color: var(--tab-active);
  }
  main {
    max-width: 900px;
    margin: 0 auto;
    padding: 2rem 1.5rem 3rem;
  }
  .team-filter-bar {
    display: flex;
    justify-content: center;
    margin-bottom: 1.75rem;
  }
  .filter-group {
    display: flex;
    flex-direction: column;
    gap: 0.3rem;
  }
  .filter-group label {
    font-size: 0.78rem;
    color: var(--text-muted);
    font-weight: 600;
    text-align: center;
  }
  .filter-group select {
    background: var(--bg-card);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 0.5rem 1.5rem;
    border-radius: 6px;
    font-size: 0.95rem;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
  }
  .roster-heading {
    display: flex;
    align-items: center;
    gap: 1rem;
    margin-bottom: 1.25rem;
  }
  .roster-heading-logo {
    width: 48px;
    height: 48px;
    object-fit: contain;
    flex-shrink: 0;
  }
  .roster-heading-name {
    font-size: 1.5rem;
    font-weight: 700;
    color: var(--text);
  }
  .position-group-label {
    color: var(--tab-active);
    font-size: 0.85rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    margin: 0 0 0.5rem;
    cursor: pointer;
    user-select: none;
    display: flex;
    align-items: center;
    gap: 0.4rem;
  }
  .position-group-arrow {
    display: inline-block;
    font-size: 0.7rem;
    transition: transform 0.15s ease;
  }
  .position-group-label.collapsed .position-group-arrow {
    transform: rotate(-90deg);
  }
  .position-group-count {
    color: var(--text-muted);
    font-weight: 600;
    text-transform: none;
    letter-spacing: normal;
  }
  .roster-table {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
    box-shadow: 0 1px 2px rgba(0,0,0,0.04);
    margin-bottom: 1.25rem;
  }
  .roster-row {
    display: grid;
    grid-template-columns: 76px 0.6fr 2.0fr 0.7fr;
    padding: 0.3rem 1.1rem;
    align-items: center;
    gap: 0.5rem;
  }
  .roster-row.head {
    background: #f2f1ee;
    color: var(--text-muted);
    font-size: 0.72rem;
    font-weight: 700;
    text-transform: uppercase;
  }
  .roster-row.body {
    border-top: 1px solid var(--border);
  }
  .roster-row.body .jersey {
    color: var(--text-muted);
  }
  .roster-row.body .pos {
    color: var(--text-muted);
  }
  .roster-avatar {
    width: 68px;
    height: 68px;
    border-radius: 50%;
    background: #2b2b2b;
    position: relative;
    flex-shrink: 0;
  }
  .roster-avatar img.roster-photo {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    object-fit: cover;
    object-position: center 30%;
    display: block;
  }
  .roster-org-badge {
    position: absolute;
    bottom: -2px;
    right: -2px;
    width: 24px;
    height: 24px;
    border-radius: 50%;
    background: #ffffff;
    border: 2px solid #ffffff;
    box-shadow: 0 1px 2px rgba(0,0,0,0.25);
    object-fit: contain;
    padding: 2px;
  }

  .roster-table.has-stats .roster-row.head, .roster-table.has-stats .roster-row.body {
    grid-template-columns: 76px 34px minmax(130px, 1.2fr) minmax(140px, 1.2fr) 40px 44px 84px minmax(170px, 1.6fr) 48px;
    gap: 6px;
    text-align: center;
  }
  .roster-table.has-stats .roster-row.head > div,
  .roster-table.has-stats .roster-row.body > div { text-align: center; }
  .roster-table.has-stats .roster-row.head > div:nth-child(3),
  .roster-table.has-stats .roster-row.body > div:nth-child(3) { text-align: left; }
  .roster-table.has-stats .roster-row.body { border-top: none; padding-top: 0.55rem; padding-bottom: 0.2rem; font-size: 0.86rem; }
  .roster-table.has-stats .roster-avatar { width: 60px; height: 60px; justify-self: center; }
  .roster-table.has-stats .roster-org-badge { width: 22px; height: 22px; }
  .roster-table.has-stats .nowrap { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .roster-key { display: flex; align-items: center; flex-wrap: wrap; gap: 0.4rem 1.25rem; margin: 0.25rem 0 0.75rem; font-size: 0.8rem; color: var(--text-muted); }
  .roster-key-item { display: flex; align-items: center; gap: 0.5rem; }
  .roster-key-swatch { width: 22px; height: 14px; border-radius: 3px; background: #eaf1fa; border: 1px solid #2f6fb0; flex-shrink: 0; }
  .roster-key-swatch.top100 { background: #ffe9d6; border-color: var(--tab-active); }
  .roster-player { border-top: 1px solid var(--border); }
  .roster-player.top100 { background: #fff0e2; border-top: 1px solid var(--tab-active); box-shadow: inset 5px 0 0 0 var(--tab-active); }
  .roster-player.top100 .roster-stat { background: #ffffff; }
  .roster-player.top100 .roster-stats-divider { border-top-color: #f3cfae; }
  .top100-tag { display: inline-block; margin-top: 2px; font-size: 0.64rem; font-weight: 800; letter-spacing: 0.02em; padding: 1px 8px; border-radius: 10px; background: var(--tab-active); color: #fff; white-space: nowrap; }
  .roster-player.mlb { box-shadow: none; background: #eaf1fa; border-top: 1px solid #2f6fb0; }
  .roster-player.mlb .roster-stat { background: #ffffff; }
  .roster-player.mlb .roster-stats-divider { border-top-color: #b9cde4; }
  .roster-stats-row {
    display: grid;
    gap: 10px;
    align-items: center;
    padding: 0.5rem 1.1rem 0.65rem;
    margin: 0 0.1rem;
  }
  .roster-stats-row .rs-wrap { display: contents; }
  .roster-stats-label {
    font-size: 0.62rem; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--tab-active); text-align: center; line-height: 1.2;
  }
  .roster-stat {
    background: #faf8f5; border: 1px solid var(--border); border-radius: 6px;
    text-align: center; padding: 4px 6px;
  }
  .roster-stat b { display: block; font-size: 0.88rem; font-variant-numeric: tabular-nums; }
  .roster-stat span { font-size: 0.6rem; color: var(--text-muted); font-weight: 700; text-transform: uppercase; }
  .roster-stats-divider { border-top: 1px dashed var(--border); margin: 0 1.1rem; }
  @media (max-width: 900px) {
    .roster-table.has-stats { overflow-x: auto; }
    .roster-table.has-stats .roster-row, .roster-table.has-stats .roster-stats-row, .roster-table.has-stats .roster-stats-divider { min-width: 940px; }
  }
  .player-link {
    color: var(--text);
    text-decoration: none;
    border-bottom: 1px dashed transparent;
  }
  .player-link:hover {
    color: var(--tab-active);
    border-bottom-color: var(--tab-active);
  }
  .transaction-log-title {
    font-size: 1.1rem;
    font-weight: 700;
    color: var(--text);
    margin: 2rem 0 0.6rem;
  }
  .transaction-table {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
    box-shadow: 0 1px 2px rgba(0,0,0,0.04);
  }
  .transaction-row {
    display: grid;
    grid-template-columns: 0.9fr 3fr;
    padding: 0.8rem 1.2rem;
    align-items: center;
    font-size: 0.88rem;
  }
  .transaction-row.head {
    background: #ececec;
    font-weight: 700;
    color: var(--text);
    font-size: 0.85rem;
  }
  .transaction-row.body {
    border-top: 1px solid var(--border);
    color: var(--text);
  }
  .transaction-row.body a {
    color: var(--tab-active);
    text-decoration: none;
    font-weight: 600;
  }
  .transaction-expand-wrap {
    text-align: center;
    margin-top: 0.75rem;
  }
  .transaction-expand-link {
    color: var(--text-muted);
    font-size: 0.85rem;
    font-weight: 600;
    text-decoration: none;
    border-bottom: 1px dashed var(--text-muted);
  }
  .error {
    color: var(--cancelled);
  }
  .loading {
    color: var(--text-muted);
  }

  /* ---- Team Stats view ---- */
  .view-buttons, .stat-subtabs { display: flex; justify-content: center; gap: 0.5rem; margin: 0 0 1.1rem; flex-wrap: wrap; }
  .stat-subtabs { justify-content: flex-start; margin: 0.2rem 0 0.7rem; }
  .view-btn { border: 1px solid var(--border); background: var(--bg-card); color: var(--text); border-radius: 999px; padding: 0.45rem 1.1rem; font-size: 0.9rem; font-weight: 600; cursor: pointer; font-family: inherit; }
  .view-btn.active { background: var(--tab-active); border-color: var(--tab-active); color: #fff; }
  .ts-hint { font-size: 0.78rem; color: var(--text-muted); align-self: center; margin-left: 0.4rem; }
  .ts-wrap { overflow: auto; max-height: 72vh; background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; }
  .ts-table { border-collapse: separate; border-spacing: 0; width: 100%; font-size: 0.84rem; font-variant-numeric: tabular-nums; }
  .ts-table th, .ts-table td { padding: 0.5rem 0.65rem; text-align: right; white-space: nowrap; border-bottom: 1px solid var(--border); }
  .ts-table thead th { position: sticky; top: 0; z-index: 2; background: #f1efeb; color: var(--text-muted); font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.04em; cursor: pointer; user-select: none; }
  .ts-table thead th:hover { color: var(--text); }
  .ts-table thead th.sorted { color: var(--tab-active); }
  .ts-table th:first-child, .ts-table td:first-child { text-align: left; position: sticky; left: 0; z-index: 1; background: var(--bg-card); }
  .ts-table thead th:first-child { z-index: 3; background: #f1efeb; }
  .ts-table td.l, .ts-table th.l { text-align: left; }
  .ts-table tbody tr:hover td { background: #faf7f3; }
  .ts-table td.sorted { background: #fffaf5; }
  .ts-table tr.top td { background: #fff0e2; }
  .ts-table tr.top td:first-child { box-shadow: inset 4px 0 0 var(--tab-active); }
  .ts-table tr.mlb td { background: #eaf1fa; }
  .ts-table tr.mlb td:first-child { box-shadow: inset 4px 0 0 #2f6fb0; }
  .ts-table tr.divider td { background: #f1efeb; font-size: 0.72rem; font-weight: 800; letter-spacing: 0.07em; text-transform: uppercase; color: var(--text-muted); text-align: left; border-top: 2px solid var(--border); }
  .ts-arrow { font-size: 0.6rem; margin-left: 3px; }
  .ts-player { display: flex; align-items: center; gap: 0.6rem; }
  .ts-av { width: 34px; height: 34px; border-radius: 50%; background: #2b2b2b; position: relative; flex-shrink: 0; }
  .ts-av img.ts-photo { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; object-position: center 30%; display: block; }
  .ts-av img.ts-org { position: absolute; right: -3px; bottom: -3px; width: 16px; height: 16px; border-radius: 50%; background: #fff; border: 1.5px solid #fff; box-shadow: 0 1px 2px rgba(0,0,0,0.25); object-fit: contain; padding: 1px; }
  .ts-pname { line-height: 1.2; }
  .ts-pname a { color: var(--text); font-weight: 500; text-decoration: none; }
  .ts-pname a:hover { text-decoration: underline; }
  .ts-pname small { display: block; font-size: 0.66rem; color: var(--text-muted); }
  .ts-tag { display: inline-block; font-size: 0.58rem; font-weight: 800; padding: 0 6px; border-radius: 9px; background: var(--tab-active); color: #fff; margin-left: 4px; vertical-align: 1px; }
  .ts-note { font-size: 0.76rem; color: var(--text-muted); margin-top: 0.7rem; }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <a href="schedule.html"><img class="league-logo" src="logos/afl-logo.svg" alt="" onerror="this.style.display='none'"></a>
    <h1>
      <span class="title-line">Arizona Fall League</span>
      <span class="title-line"><span class="title-central">Central</span></span>
    </h1>
    <div class="season-control">
      <span class="season-label">Season:</span>
      <select id="season-select" class="season-select"></select>
    </div>
  </div>
</header>

<nav class="nav-tabs">
  <a class="nav-tab" href="schedule.html">Schedule</a>
  <a class="nav-tab" href="standings.html">Standings</a>
  <a class="nav-tab active" href="roster.html">Rosters</a>
</nav>

<main id="content">
  <p class="loading">Loading roster...</p>
</main>

<footer>
  <p class="subtitle">Data updated automatically from the MLB Stats API</p>
</footer>

<script>
  const TEAM_LOGOS = {
    'Glendale Desert Dogs': 'logos/glendale.svg',
    'Mesa Solar Sox': 'logos/mesa.svg',
    'Peoria Javelinas': 'logos/peoria.svg',
    'Salt River Rafters': 'logos/salt-river.svg',
    'Scottsdale Scorpions': 'logos/scottsdale.svg',
    'Surprise Saguaros': 'logos/surprise.svg',
  };
  const AFL_TEAM_NAMES = Object.keys(TEAM_LOGOS);

  const POSITION_GROUPS = [
    { label: 'Pitchers', codes: ['1'] },
    { label: 'Catchers', codes: ['2'] },
    { label: 'Infielders', codes: ['3', '4', '5', '6'] },
    { label: 'Outfielders', codes: ['7', '8', '9', 'O'] },
    { label: 'Other', codes: ['10'] },
  ];

  let SEASONS = [];
  const params = new URLSearchParams(window.location.search);
  let currentSeason = parseInt(params.get('season'), 10) || new Date().getFullYear();
  let currentTeam = params.get('team') || null;
  let allRoster = [];
  let allTransactions = [];
  let pitcherStatsById = {};
  let hitterStatsById = {};
  let top100ById = {};
  let hitterRows = [], pitcherRows = [], fieldingRows = [];
  let currentView = 'roster';   // 'roster' | 'stats'
  let currentStatTab = 'hitting';   // 'hitting' | 'pitching' | 'fielding'
  const tsSort = { hitting: { k: 'plate_appearances', dir: -1 }, pitching: { k: 'outs', dir: -1 }, fielding: { k: 'games', dir: -1 } };

  function parseCSV(text) {
    const lines = text.trim().split(/\r?\n/);
    if (lines.length < 2) return [];
    const headers = parseCSVLine(lines[0]);
    return lines.slice(1).map(line => {
      const values = parseCSVLine(line);
      const row = {};
      headers.forEach((h, i) => { row[h] = values[i] !== undefined ? values[i] : ''; });
      return row;
    });
  }

  function parseCSVLine(line) {
    const result = [];
    let current = '';
    let inQuotes = false;
    for (let i = 0; i < line.length; i++) {
      const char = line[i];
      if (char === '"') {
        if (inQuotes && line[i + 1] === '"') {
          current += '"';
          i++;
        } else {
          inQuotes = !inQuotes;
        }
      } else if (char === ',' && !inQuotes) {
        result.push(current);
        current = '';
      } else {
        current += char;
      }
    }
    result.push(current);
    return result;
  }

  async function loadSeasons() {
    try {
      const res = await fetch('data/seasons.json');
      if (res.ok) SEASONS = await res.json();
    } catch (e) {}
    if (!SEASONS || SEASONS.length === 0) SEASONS = [currentSeason];
    if (!SEASONS.includes(currentSeason)) currentSeason = SEASONS[SEASONS.length - 1];
  }

  function renderControls() {
    const el = document.getElementById('season-select');
    el.innerHTML = '';
    [...SEASONS].sort((a, b) => b - a).forEach(season => {
      const opt = document.createElement('option');
      opt.value = season;
      opt.textContent = season;
      if (season === currentSeason) opt.selected = true;
      el.appendChild(opt);
    });
    el.onchange = () => {
      currentSeason = parseInt(el.value, 10);
      updateUrl();
      loadRosterPage();
    };
  }

  function updateUrl() {
    const p = new URLSearchParams();
    p.set('season', currentSeason);
    if (currentTeam) p.set('team', currentTeam);
    history.replaceState(null, '', '?' + p.toString());
  }

  function teamLogoImg(name, cls) {
    const src = TEAM_LOGOS[name];
    if (!src) return '';
    return `<img class="${cls}" src="${src}" alt="" onerror="this.style.display='none'">`;
  }

  function highlightPlayerName(description, playerName, playerId, season) {
    if (!playerName || !description.includes(playerName)) return description;
    const link = `<a href="player.html?id=${playerId}&season=${season}">${playerName}</a>`;
    return description.split(playerName).join(link);
  }

  function formatShortDate(iso) {
    if (!iso) return '';
    const [y, m, d] = iso.split('-');
    return `${parseInt(m, 10)}/${parseInt(d, 10)}/${y}`;
  }

  function buildTransactionRowHtml(r) {
    const desc = highlightPlayerName(r.description, r.player_name, r.player_id, r.season);
    return `<div class="transaction-row body"><div>${formatShortDate(r.date)}</div><div>${desc}</div></div>`;
  }

  function renderTransactionTable(rows) {
    let html = `
      <div class="transaction-log-title">Transaction Log</div>
      <div class="transaction-table">
        <div class="transaction-row head"><div>Date</div><div>Transaction</div></div>
        <div id="transaction-rows-visible">
    `;

    if (rows.length === 0) {
      html += `<div class="transaction-row body"><div></div><div>No transactions found.</div></div>`;
    } else {
      rows.slice(0, 3).forEach(r => {
        html += buildTransactionRowHtml(r);
      });
    }

    html += `</div><div id="transaction-rows-hidden" style="display:none;">`;
    rows.slice(3).forEach(r => {
      html += buildTransactionRowHtml(r);
    });
    html += `</div></div>`;

    if (rows.length > 3) {
      html += `
        <div class="transaction-expand-wrap">
          <a href="#" id="transaction-expand-link" class="transaction-expand-link">Show all ${rows.length} transactions &#9662;</a>
        </div>
      `;
    }

    return html;
  }

  function wireTransactionExpand() {
    const link = document.getElementById('transaction-expand-link');
    if (!link) return;
    link.onclick = (e) => {
      e.preventDefault();
      document.getElementById('transaction-rows-hidden').style.display = 'block';
      link.style.display = 'none';
    };
  }

  function wireCollapsibleGroups() {
    document.querySelectorAll('.position-group-label').forEach(label => {
      label.onclick = () => {
        const targetId = label.getAttribute('data-target');
        const table = document.getElementById(targetId);
        if (!table) return;

  function num(v) { const n = parseFloat(v); return isNaN(n) ? 0 : n; }
  function fmtRate(v) { const t = v.toFixed(3); return v < 1 ? t.replace(/^0/, '') : t; }
  function buildHitterStats(rows) {
    const by = {};
    rows.filter(r => !r.game_type || r.game_type === 'R').forEach(r => { (by[r.player_id] = by[r.player_id] || []).push(r); });
    const out = {};
    Object.keys(by).forEach(id => {
      const g = by[id], sum = k => g.reduce((a, r) => a + num(r[k]), 0);
      const ab = sum('at_bats'), h = sum('hits'), bb = sum('walks'), hbp = sum('hit_by_pitch'), sf = sum('sac_flies'), tb = sum('total_bases');
      const pa = ab + bb + hbp + sf;
      const obp = pa ? (h + bb + hbp) / pa : 0, slg = ab ? tb / ab : 0;
      out[id] = [g.length, fmtRate(ab ? h / ab : 0), fmtRate(obp), fmtRate(slg), fmtRate(obp + slg), sum('home_runs'), sum('rbi'), sum('stolen_bases')];

  }
  const PITCHER_STAT_LABELS = ['G', 'GS', 'IP', 'ERA', 'WHIP', 'K', 'BB'];
  const HITTER_STAT_LABELS = ['G', 'AVG', 'OBP', 'SLG', 'OPS', 'HR', 'RBI', 'SB'];
  // data/<year>/top100.csv: one row per player, one date column per saved list version.
  // Current rank = rightmost filled-in date; peak = best (lowest) rank across the dates.
  function top100Entry(row) {
    const dates = Object.keys(row).filter(k => /^\d{4}-\d{2}-\d{2}$/.test(k)).sort();
    let cur = null, peak = null;
    dates.forEach(d => {
      const v = parseInt(row[d], 10);
      if (!isNaN(v)) { cur = v; peak = peak === null ? v : Math.min(peak, v); }
    });
    if (cur === null && row.rank) { cur = peak = parseInt(row.rank, 10); }  // old single-list layout
    return cur === null ? null : { rank: cur, peak };
  }
  function top100Label(year, e) {
    return `${year} Top 100 #${e.rank}` + (e.peak < e.rank ? ` (peak: ${e.peak})` : '');
  }
  function top100Tags(id) {

  }
  function heightWeight(p) { return (p.height ? p.height.replace(/ /g, '') : '—') + (p.weight ? ' / ' + p.weight : ''); }
  function hometown(p) { return [p.birth_city, p.birth_state || p.birth_country].filter(Boolean).join(', ') || '—'; }

  function renderRoster() {

  function wireViewButtons() {

  function wireTeamSelect() {

  // ---------- Team Stats view ----------
  const toN = v => (v === null || v === undefined || v === '') ? NaN : parseFloat(v);
  const fI = v => { const n = toN(v); return isNaN(n) ? '—' : String(Math.round(n)); };
  const fR3 = v => { const n = toN(v); return isNaN(n) ? '—' : fmtRate(n); };
  const fD2 = v => { const n = toN(v); return (isNaN(n) || !isFinite(n)) ? '—' : n.toFixed(2); };
  const fD1 = v => { const n = toN(v); return (isNaN(n) || !isFinite(n)) ? '—' : n.toFixed(1); };
  const fPct = v => { const n = toN(v); return isNaN(n) ? '—' : (n * 100).toFixed(1) + '%'; };
  const fOuts = v => { const o = toN(v); return isNaN(o) ? '—' : Math.floor(o / 3) + '.' + (o % 3); };
  const fStr = v => (v === null || v === undefined || v === '') ? '—' : v;
  const fRate = v => (v === '' || v === null || v === undefined || v === '.---' || isNaN(parseFloat(v))) ? '—' : fmtRate(parseFloat(v));

  // Column definitions: [key, label, formatter, leftAligned, sortsAscendingFirst]
  const HITTING_COLS = [
    ['pos', 'Pos', fStr, true, true], ['age', 'Age', fI], ['games', 'G', fI], ['plate_appearances', 'PA', fI], ['at_bats', 'AB', fI], ['runs', 'R', fI], ['hits', 'H', fI],
    ['doubles', '2B', fI], ['triples', '3B', fI], ['home_runs', 'HR', fI], ['rbi', 'RBI', fI], ['walks', 'BB', fI], ['intentional_walks', 'IBB', fI], ['strikeouts', 'K', fI],
    ['stolen_bases', 'SB', fI], ['caught_stealing', 'CS', fI], ['sbp', 'SB%', fPct], ['avg', 'AVG', fR3], ['obp', 'OBP', fR3], ['slg', 'SLG', fR3], ['ops', 'OPS', fR3], ['babip', 'BABIP', fR3],
    ['total_bases', 'TB', fI], ['hit_by_pitch', 'HBP', fI], ['left_on_base', 'LOB', fI], ['ground_outs', 'GO', fI], ['air_outs', 'AO', fI], ['goao', 'GO/AO', fD2],
    ['ground_into_double_play', 'GIDP', fI], ['sac_bunts', 'SH', fI], ['sac_flies', 'SF', fI], ['abhr', 'AB/HR', fD1], ['number_of_pitches', 'Pit', fI], ['catchers_interference', 'CI', fI],
  ];
  const PITCHING_COLS = [
    ['age', 'Age', fI], ['wins', 'W', fI], ['losses', 'L', fI], ['winPercentage', 'W-L%', fRate], ['era', 'ERA', fD2, false, true], ['whip', 'WHIP', fD2, false, true],
    ['gamesPitched', 'G', fI], ['gamesStarted', 'GS', fI], ['completeGames', 'CG', fI], ['shutouts', 'SHO', fI], ['saves', 'SV', fI], ['blownSaves', 'BS', fI], ['holds', 'HLD', fI],
    ['outs', 'IP', fOuts], ['battersFaced', 'BF', fI], ['hits', 'H', fI], ['runs', 'R', fI], ['earnedRuns', 'ER', fI], ['homeRuns', 'HR', fI], ['doubles', '2B', fI], ['triples', '3B', fI],
    ['baseOnBalls', 'BB', fI], ['intentionalWalks', 'IBB', fI], ['strikeOuts', 'K', fI], ['hitByPitch', 'HBP', fI], ['wildPitches', 'WP', fI], ['balks', 'BK', fI], ['pickoffs', 'PK', fI],
    ['atBats', 'AB', fI], ['avg', 'BA', fRate], ['obp', 'OBP', fRate], ['slg', 'SLG', fRate], ['ops', 'OPS', fRate], ['totalBases', 'TB', fI], ['stolenBases', 'SB', fI],
    ['groundOuts', 'GO', fI], ['airOuts', 'AO', fI], ['groundOutsToAirouts', 'GO/AO', fD2], ['hitsPer9Inn', 'H/9', fD2, false, true], ['homeRunsPer9', 'HR/9', fD2, false, true],
    ['walksPer9Inn', 'BB/9', fD2, false, true], ['strikeoutsPer9Inn', 'K/9', fD2], ['runsScoredPer9', 'R/9', fD2, false, true], ['strikeoutWalkRatio', 'K/BB', fD2],
    ['strikes', 'Strk', fI], ['strikePercentage', 'Strike%', fRate], ['numberOfPitches', 'Pit', fI], ['pitchesPerInning', 'P/IP', fD2],
    ['inheritedRunners', 'IR', fI], ['inheritedRunnersScored', 'IRS', fI], ['groundIntoDoublePlay', 'GIDP', fI], ['sacBunts', 'SH', fI], ['sacFlies', 'SF', fI], ['catchersInterference', 'CI', fI],
  ];
  const FIELDING_COLS = [
    ['pos', 'Pos', fStr, true, true], ['games', 'G', fI], ['outs', 'Inn', fOuts], ['po', 'PO', fI], ['a', 'A', fI], ['e', 'E', fI], ['te', 'TE', fI], ['tc', 'TC', fI],
    ['fpct', 'FPct', fR3], ['dp', 'DP', fI], ['tp', 'TP', fI], ['rfg', 'RF/G', fD2], ['rf9', 'RF/9', fD2],
    ['sb', 'SB', fI], ['cs', 'CS', fI], ['cspct', 'CS%', fPct], ['pb', 'PB', fI], ['pk', 'PK', fI],
  ];
  const TS_SAMPLE = { hitting: 'plate_appearances', pitching: 'outs', fielding: 'outs' };

  function inningsToOuts(v) { const x = num(v), w = Math.floor(x + 1e-9); return w * 3 + Math.round((x - w) * 10); }

  // One hitting row per player, totals summed from the game log; rates recalculated from the totals.
  function buildHitterRows(logs) {
    const by = {};
    logs.filter(r => !r.game_type || r.game_type === 'R').forEach(r => { (by[r.player_id] = by[r.player_id] || []).push(r); });
    return Object.keys(by).map(id => {
      const g = by[id], s = k => g.reduce((a, r) => a + num(r[k]), 0);
      const o = { player_id: id, team: g[0].team, games: new Set(g.map(r => r.game_pk)).size };
      ['plate_appearances','at_bats','runs','hits','doubles','triples','home_runs','rbi','walks','intentional_walks','strikeouts','stolen_bases','caught_stealing','total_bases','hit_by_pitch','left_on_base','ground_outs','air_outs','ground_into_double_play','sac_bunts','sac_flies','number_of_pitches','catchers_interference'].forEach(k => { o[k] = s(k); });
      const ab = o.at_bats, h = o.hits, bb = o.walks, hbp = o.hit_by_pitch, sf = o.sac_flies, k = o.strikeouts, hr = o.home_runs;
      o.avg = ab ? h / ab : null;
      o.obp = (ab + bb + hbp + sf) ? (h + bb + hbp) / (ab + bb + hbp + sf) : null;
      o.slg = ab ? o.total_bases / ab : null;
      o.ops = (o.obp !== null && o.slg !== null) ? o.obp + o.slg : null;
      o.babip = (ab - k - hr + sf) > 0 ? (h - hr) / (ab - k - hr + sf) : null;
      o.goao = o.air_outs ? o.ground_outs / o.air_outs : null;
      o.sbp = (o.stolen_bases + o.caught_stealing) ? o.stolen_bases / (o.stolen_bases + o.caught_stealing) : null;
      o.abhr = hr ? ab / hr : null;
      return o;
    });
  }

  // Fielding: one row per player per position (DH excluded).
  function buildFieldingRows(logs) {
    const by = {};
    logs.filter(r => (!r.game_type || r.game_type === 'R') && r.position !== 'DH').forEach(r => { (by[r.player_id + '|' + r.position] = by[r.player_id + '|' + r.position] || []).push(r); });
    return Object.keys(by).map(key => {
      const g = by[key], s = k => g.reduce((a, r) => a + num(r[k]), 0);
      const outs = g.reduce((a, r) => a + inningsToOuts(r.innings), 0);
      const po = s('putouts'), a = s('assists'), tc = s('chances'), games = new Set(g.map(r => r.game_pk)).size;
      // Catcher-only stats (stolen bases allowed, caught stealing, passed balls); blank for other positions
      // and for older CSVs that predate those columns.
      const hasC = g[0].position === 'C' && g[0].stolen_bases !== undefined;
      const sb = hasC ? s('stolen_bases') : null, cs = hasC ? s('caught_stealing') : null;
      return { player_id: g[0].player_id, team: g[0].team, pos: g[0].position, games, outs, po, a, e: s('errors'), te: s('throwing_errors'), tc, dp: s('double_plays'), tp: s('triple_plays'),
        sb, cs, cspct: hasC && (sb + cs) ? cs / (sb + cs) : null, pb: hasC ? s('passed_balls') : null, pk: hasC ? s('pickoffs') : null,
        fpct: tc ? (po + a) / tc : null, rfg: games ? (po + a) / games : null, rf9: outs ? (po + a) * 27 / outs : null };
    });
  }

  function tsPlayerCell(p) {
    const link = `player.html?id=${p.player_id}&season=${currentSeason}`;
    const photo = `https://img.mlbstatic.com/mlb-photos/image/upload/c_fill,g_auto/w_120/v1/people/${p.player_id}/headshot/milb/current`;
    const org = p.org_id ? `<img class="ts-org" src="https://www.mlbstatic.com/team-logos/${p.org_id}.svg" alt="" onerror="this.style.display='none'">` : '';
    const t100 = top100ById[p.player_id] ? Object.keys(top100ById[p.player_id]).sort().map(y => `<span class="ts-tag" title="${top100Label(y, top100ById[p.player_id][y])}">${y} #${top100ById[p.player_id][y].rank}</span>`).join('') : '';
    return `<div class="ts-player"><a href="${link}"><div class="ts-av"><img class="ts-photo" src="${photo}" alt="" onerror="this.style.display='none'">${org}</div></a><div class="ts-pname"><a href="${link}">${p.full_name}</a>${t100}<small>${p.org_name || ''}</small></div></div>`;
  }

  function tsMissing(x) { return x === null || x === undefined || x === '' || x === '.---' || x === '-.--' || x === '*.**' || (typeof x === 'number' && isNaN(x)) || (typeof x === 'string' && isNaN(parseFloat(x)) && /^[-.*]+$/.test(x)); }
  function tsSortRows(rows, k, dir, sampleKey) {
    const val = r => (k === 'full_name' ? r.full_name : r[k]);
    return [...rows].sort((a, b) => {
      const x = val(a), y = val(b);
      let c = 0;
      if (tsMissing(x) && tsMissing(y)) c = 0;
      else if (tsMissing(x)) return 1;
      else if (tsMissing(y)) return -1;
      else c = (typeof x === 'string' && isNaN(parseFloat(x))) ? dir * x.localeCompare(y) : dir * (parseFloat(x) - parseFloat(y));
      if (c) return c;
      // Ties: bigger sample first, whichever way the column is sorted.
      const sa = num(a[sampleKey]), sb = num(b[sampleKey]);
      if (sa !== sb) return sb - sa;
      return a.full_name.localeCompare(b.full_name);
    });
  }

  function tsRowClass(p) { return top100ById[p.player_id] ? 'top' : (p.mlb_debut_date ? 'mlb' : ''); }

  function tsTable(rowsByKind, cols, kind) {
    const st = tsSort[kind];
    const arrow = k => st.k === k ? `<span class="ts-arrow">${st.dir > 0 ? '▲' : '▼'}</span>` : '';
    const head = `<th class="l${st.k === 'full_name' ? ' sorted' : ''}" data-k="full_name">Player${arrow('full_name')}</th>` +
      cols.map(c => `<th class="${c[3] ? 'l' : ''}${st.k === c[0] ? ' sorted' : ''}" data-k="${c[0]}">${c[1]}${arrow(c[0])}</th>`).join('');
    const rowHtml = r => `<tr class="${tsRowClass(r)}"><td>${tsPlayerCell(r)}</td>` + cols.map(c => `<td class="${c[3] ? 'l' : ''}${st.k === c[0] ? ' sorted' : ''}">${c[2](r[c[0]])}</td>`).join('') + `</tr>`;
    let body = '';
    rowsByKind.forEach(sec => {
      if (sec.label) body += `<tr class="divider"><td colspan="${cols.length + 1}">${sec.label}</td></tr>`;
      body += tsSortRows(sec.rows, st.k, st.dir, TS_SAMPLE[kind]).map(rowHtml).join('');
    });
    if (!body) body = `<tr><td colspan="${cols.length + 1}" class="l">No stats yet.</td></tr>`;
    return `<div class="ts-wrap"><table class="ts-table"><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>`;
  }

  function tsDataFor(teamPlayers, kind) {
    const byId = {};
    teamPlayers.forEach(p => { byId[p.player_id] = p; });
    const join = r => { const p = byId[r.player_id]; return p ? { ...r, ...p, ...Object.fromEntries(Object.entries(r).filter(([k]) => k !== 'team')), pos: r.pos || p.position_abbreviation, age: p.age } : null; };
    if (kind === 'hitting') {
      return [{ rows: hitterRows.map(r => { const p = byId[r.player_id]; return p && p.position_code !== '1' ? { ...p, ...r, pos: p.position_abbreviation, age: p.age } : null; }).filter(Boolean) }];
    }
    if (kind === 'pitching') {
      return [{ rows: pitcherRows.map(r => { const p = byId[r.pitcher_id]; return p ? { ...p, ...r, outs: num(r.outs), age: p.age || r.age } : null; }).filter(Boolean) }];
    }
    const rows = fieldingRows.map(join).filter(Boolean);
    return [{ label: 'Position Players', rows: rows.filter(r => r.pos !== 'P') }, { label: 'Pitchers', rows: rows.filter(r => r.pos === 'P') }];
  }

  function renderTeamStats(teamPlayers) {
    const kind = currentStatTab;
    const cols = kind === 'hitting' ? HITTING_COLS : kind === 'pitching' ? PITCHING_COLS : FIELDING_COLS;
    const tab = (id, label) => `<button class="view-btn${kind === id ? ' active' : ''}" data-stat="${id}">${label}</button>`;
    const note = kind === 'hitting' ? 'Hitting totals are summed from each player&#39;s AFL game logs; AVG, OBP, SLG, OPS, BABIP and the other rates are recalculated from those totals.'
      : kind === 'pitching' ? 'Pitching stats are each pitcher&#39;s AFL season totals. Sorting by IP uses total outs.'
      : 'Fielding is shown per player and position, so a player who played several positions appears on several rows. DH is excluded. SB, CS, CS% (caught stealing percentage) and PB are catcher stats: stolen bases allowed, runners thrown out, share of attempts thrown out, and passed balls. PK is pickoffs.';
    return `
      <div class="roster-key"><span class="roster-key-item"><span class="roster-key-swatch"></span>MLB debut</span><span class="roster-key-item"><span class="roster-key-swatch top100"></span>MLB Pipeline Top 100 (tag = rank)</span></div>
      <div class="stat-subtabs">${tab('hitting', 'Hitting')}${tab('pitching', 'Pitching')}${tab('fielding', 'Fielding')}<span class="ts-hint">Click any column header to sort. Ties go to the larger sample (PA, IP or innings) first.</span></div>
      <div id="ts-holder">${tsTable(tsDataFor(teamPlayers, kind), cols, kind)}</div>
      <div class="ts-note">${note}</div>

  function wireTeamStats(teamPlayers) {
    document.querySelectorAll('.stat-subtabs .view-btn').forEach(b => {
      b.onclick = () => { currentStatTab = b.dataset.stat; renderRoster(); };
    });
    const kind = currentStatTab;
    const cols = kind === 'hitting' ? HITTING_COLS : kind === 'pitching' ? PITCHING_COLS : FIELDING_COLS;
    const holder = document.getElementById('ts-holder');
    const bind = () => {
      holder.querySelectorAll('th[data-k]').forEach(h => {
        h.onclick = () => {
          const w = holder.querySelector('.ts-wrap'), sl = w.scrollLeft, stp = w.scrollTop;
          const k = h.dataset.k, st = tsSort[kind];
          if (st.k === k) st.dir *= -1;
          else { st.k = k; const col = cols.find(c => c[0] === k); st.dir = (k === 'full_name' || (col && col[4])) ? 1 : -1; }
          holder.innerHTML = tsTable(tsDataFor(teamPlayers, kind), cols, kind);
          const n = holder.querySelector('.ts-wrap'); n.scrollLeft = sl; n.scrollTop = stp;
          bind();
        };
      });
    };
    bind();
  }

  async function loadRosterPage() {
    const content = document.getElementById('content');
    content.innerHTML = '<p class="loading">Loading roster...</p>';

    try {
      // Top 100 lists exist per year; a player gets a label for every year's list he was on
      // (each file holds the most recent pull of that year's ranking).
      // Covers every year from 2023 (the earliest list we keep) through the newest season on the site;
      // a year with no file just contributes no labels.
      const top100Years = [];
      for (let y = 2023; y <= Math.max(...SEASONS); y++) top100Years.push(y);
      const top100Fetches = top100Years.map(y => fetch(`data/${y}/top100.csv`).then(r => (r.ok ? r.text() : null)).catch(() => null));
      const [rosterRes, txnRes, pStatRes, hLogRes, fLogRes] = await Promise.all([
        fetch(`data/${currentSeason}/roster.csv`),
        fetch(`data/${currentSeason}/transactions.csv`),
        fetch(`data/${currentSeason}/pitcher_stats.csv`),
        fetch(`data/${currentSeason}/hitting_gamelogs.csv`),
        fetch(`data/${currentSeason}/fielding_gamelogs.csv`),
      ]);

      allRoster = rosterRes.ok ? parseCSV(await rosterRes.text()) : [];
      allTransactions = txnRes.ok ? parseCSV(await txnRes.text()) : [];
      pitcherStatsById = {};
      pitcherRows = [];
      if (pStatRes.ok) parseCSV(await pStatRes.text()).forEach(r => {
        pitcherRows.push({ ...r, player_id: r.pitcher_id, pitcher_id: r.pitcher_id, outs: r.outs });
        pitcherStatsById[r.pitcher_id] = [r.gamesPitched, r.gamesStarted, r.inningsPitched, r.era, r.whip, r.strikeOuts, r.baseOnBalls];
      });
      top100ById = {};
      const top100Texts = await Promise.all(top100Fetches);
      top100Years.forEach((y, i) => {
        if (!top100Texts[i]) return;
        parseCSV(top100Texts[i]).forEach(r => { const e = top100Entry(r); if (e) (top100ById[r.player_id] = top100ById[r.player_id] || {})[y] = e; });
      });
      const hLogRows = hLogRes.ok ? parseCSV(await hLogRes.text()) : [];
      hitterStatsById = buildHitterStats(hLogRows);
      hitterRows = buildHitterRows(hLogRows);
      fieldingRows = fLogRes.ok ? buildFieldingRows(parseCSV(await fLogRes.text())) : [];

      if (allRoster.length === 0) {
        content.innerHTML = '<p class="error">No roster available for this season yet.</p>';
        return;
      }

      renderRoster();
    } catch (err) {
      content.innerHTML = `<p class="error">Couldn't load roster: ${err.message}</p>`;
    }
  }

  async function init() {
    await loadSeasons();
    renderControls();
    loadRosterPage();
  }

  init();
</script>

<script src="player-search.js"></script>
</body>
</html>
