<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arizona Fall League Central - Box Score, Scoring Summary &amp; Play-by-Play</title>
<style>
  :root {
    --bg: #FDFCFB; --bg-card: #FFFFFF; --border: #e8e6e2; --text: #111418; --text-muted: #5a6472;
    --accent: #b8860b; --header-bg: #0d1b3a; --header-card-bg: #16305c; --header-border: #2c4a7c;
    --header-text: #ffffff; --tab-active: #f26522; --final: #1a8a4a;
  }
  * { box-sizing: border-box; }
  body { margin:0; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; line-height: 1.5; }
  header { padding: 1.5rem 1.5rem 0; }
  .header-inner { display: flex; align-items: center; justify-content: center; gap: 2.5rem; max-width: 900px; margin: 0 auto; background: var(--header-bg); border-radius: 16px; padding: 2.25rem 1.5rem; }
  h1 { font-size: 2.2rem; font-weight: 600; margin: 0; letter-spacing: -0.01em; text-align: center; color: var(--header-text); }
  .league-logo { height: 100px; width: auto; flex-shrink: 0; }
  .header-inner > a { display: inline-flex; flex-shrink: 0; line-height: 0; }
  .title-line { display: block; line-height: 1.3; }
  .title-central { display: inline-block; border-bottom: 2px solid var(--header-text); padding-bottom: 0.2rem; width: fit-content; }
  .nav-tabs { display: flex; justify-content: center; gap: 2rem; max-width: 900px; margin: 1.25rem auto 0; padding: 0 1.5rem; border-bottom: 1px solid var(--border); }
  .nav-tab { display: inline-block; padding: 0.6rem 0.2rem; color: var(--text-muted); text-decoration: none; font-weight: 600; font-size: 0.9rem; border-bottom: 2px solid transparent; margin-bottom: -1px; }
  .nav-tab:hover { color: var(--text); }
  .nav-tab.active { color: var(--tab-active); border-bottom-color: var(--tab-active); }

  main { max-width: 900px; margin: 0 auto; padding: 1.5rem 1.5rem 3rem; }
  .back-link { display: inline-flex; align-items: center; gap: 0.35rem; color: var(--text-muted); text-decoration: none; font-size: 0.85rem; font-weight: 600; margin-bottom: 1rem; }
  .back-link:hover { color: var(--tab-active); }

  .game-header { background: var(--header-bg); border-radius: 12px; padding: 1.25rem 1.5rem; margin-bottom: 1.25rem; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 1rem; }
  .game-matchup { color: var(--header-text); font-size: 1.25rem; font-weight: 700; }
  .game-sub { color: #9fb3d1; font-size: 0.82rem; margin-top: 0.2rem; }
  .game-status { color: #9fb3d1; font-size: 0.72rem; text-transform: uppercase; font-weight: 700; letter-spacing: 0.04em; }

  .linescore { border: 1px solid var(--border); border-radius: 10px; background: var(--bg-card); overflow-x: auto; margin-bottom: 1.5rem; }
  .linescore table { border-collapse: collapse; width: 100%; font-size: 0.85rem; }
  .linescore th, .linescore td { padding: 0.45rem 0.6rem; text-align: center; white-space: nowrap; }
  .linescore th { background: #f2f1ee; color: var(--text-muted); font-size: 0.7rem; text-transform: uppercase; font-weight: 700; }
  .linescore td:first-child, .linescore th:first-child { text-align: left; font-weight: 700; padding-left: 0.9rem; }
  .linescore tr + tr td { border-top: 1px solid var(--border); }
  .linescore .tot { font-weight: 700; }
  .linescore th.sep, .linescore td.sep { border-left: 1px solid var(--border); }

  .view-tabs { display: flex; gap: 0.5rem; margin-bottom: 1rem; }
  .view-tab { background: var(--bg-card); border: 1px solid var(--border); border-radius: 999px; padding: 0.5rem 1.1rem; font: inherit; font-size: 0.85rem; font-weight: 700; color: var(--text); cursor: pointer; }
  .view-tab { white-space: nowrap; }
  @media (max-width: 560px) { .view-tabs { gap: 0.35rem; } .view-tab { padding: 0.45rem 0.7rem; font-size: 0.78rem; } }
  .view-tab.active { background: var(--tab-active); border-color: var(--tab-active); color: #fff; }

  .half { border: 1px solid var(--border); border-radius: 10px; background: var(--bg-card); margin-bottom: 0.75rem; overflow: hidden; }
  .half > summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 0.6rem; padding: 0.6rem 0.9rem; background: #f2f1ee; font-weight: 700; font-size: 0.85rem; }
  .half > summary::-webkit-details-marker { display: none; }
  .half > summary .caret { color: var(--tab-active); font-size: 0.7rem; transition: transform .12s; }
  .half[open] > summary .caret { transform: rotate(90deg); }
  .half-score { margin-left: auto; color: var(--text-muted); font-weight: 600; font-size: 0.8rem; }
  .play { display: flex; gap: 0.75rem; padding: 0.6rem 0.9rem; border-top: 1px solid var(--border); font-size: 0.88rem; align-items: flex-start; }
  .play.scoring { border-left: 3px solid var(--tab-active); background: #fff8f2; padding-left: calc(0.9rem - 3px); }
  .play-body { flex: 1; min-width: 0; }
  .play-event { display: inline-block; font-size: 0.68rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.03em; color: var(--text-muted); margin-bottom: 0.1rem; }
  .play.scoring .play-event { color: var(--tab-active); }
  .play-desc { word-wrap: break-word; }
  .play-top { display: flex; align-items: center; gap: 0.55rem; flex-wrap: wrap; margin-bottom: 0.1rem; }
  .play-top .play-event { margin-bottom: 0; }
  .pitch-chip { font-size: 0.7rem; font-weight: 600; background: #eef1f6; color: #2c4a7c; border-radius: 999px; padding: 0.05rem 0.5rem; white-space: nowrap; }
  .pitch-chip a, .play-runs a, .pitch-chg a { color: inherit; text-decoration: none; border-bottom: 1px dashed var(--tab-active); }
  .pitch-chip a:hover, .play-runs a:hover, .pitch-chg a:hover { color: var(--tab-active); }
  .play-runs { display: flex; flex-direction: column; gap: 0.25rem; margin-top: 0.45rem; }
  .play-run { display: flex; gap: 0.5rem; align-items: baseline; font-size: 0.8rem; color: var(--text-muted); }
  .run-tag { font-size: 0.65rem; font-weight: 800; letter-spacing: 0.04em; text-transform: uppercase; border-radius: 4px; padding: 0.08rem 0.4rem; white-space: nowrap; flex: none; }
  .run-tag.earned { background: #fde3d3; color: #a8400b; }
  .run-tag.unearned { background: #eef1f6; color: #2c4a7c; }
  .pitch-chg { padding: 0.45rem 0.9rem; border-top: 1px solid var(--border); background: #eef1f6; color: #2c4a7c; font-size: 0.8rem; font-weight: 600; }
  .player-link { color: inherit; font-weight: 600; text-decoration: none; border-bottom: 1px solid transparent; }
  .player-link:hover { color: var(--tab-active); border-bottom-color: var(--tab-active); }
  .dia-wrap { width: 40px; display: flex; justify-content: center; align-self: center; flex: none; }
  .dia-wrap svg { display: block; }
  .play-meta { margin-left: auto; text-align: right; flex: none; font-size: 0.75rem; color: var(--text-muted); white-space: nowrap; }
  .play-score { font-weight: 700; color: var(--text); font-size: 0.8rem; }

  /* ---- Box Score view (same look as the schedule page's box score) ---- */
  .bs-team-title {
    font-size: 0.7rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    color: var(--text-muted);
    margin: 0.75rem 0 0.35rem;
  }
  .bs-table {
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
    margin-bottom: 0.4rem;
  }
  .bs-header, .bs-row {
    display: grid;
    grid-template-columns: 26px 2fr repeat(13, 0.62fr);
    gap: 4px;
    padding: 0.35rem 0.55rem;
    font-size: 0.76rem;
    align-items: center;
  }
  .bs-team-tabs {
    display: flex;
    gap: 0.4rem;
    margin: 0.2rem 0 0.6rem;
  }
  .bs-team-tab {
    background: none;
    border: 1px solid var(--border);
    color: var(--text-muted);
    padding: 0.3rem 0.75rem;
    border-radius: 6px;
    cursor: pointer;
    font-size: 0.78rem;
    font-weight: 600;
    font-family: inherit;
  }
  .bs-team-tab.active {
    background: var(--tab-active);
    border-color: var(--tab-active);
    color: #ffffff;
  }
  .bs-header-p, .bs-row-p {
    display: grid;
    grid-template-columns: 26px 2fr repeat(10, 0.62fr) 86px;
    gap: 4px;
    padding: 0.35rem 0.55rem;
    font-size: 0.76rem;
    align-items: center;
  }
  .bs-header-p {
    white-space: nowrap;
  }
  .bs-header-p > div:nth-child(n+3),
  .bs-row-p > div:nth-child(n+3) {
    text-align: center;
  }
  .bs-header, .bs-header-p {
    background: #f2f1ee;
    font-weight: 700;
    color: var(--text-muted);
    text-transform: uppercase;
    font-size: 0.66rem;
  }
  .bs-row, .bs-row-p {
    border-top: 1px solid var(--border);
    color: var(--text);
  }
  .bs-note {
    font-size: 0.7rem;
    color: var(--text-muted);
    font-style: italic;
    margin: 0.1rem 0 0.5rem;
  }
  .statcast-pill {
    display: inline-block;
    font-size: 0.68rem;
    font-weight: 700;
    color: var(--tab-active);
    border: 1.5px solid var(--tab-active);
    border-radius: 999px;
    padding: 1px 9px;
    text-decoration: none;
    white-space: nowrap;
  }
  .statcast-pill:hover { background: var(--tab-active); color: #ffffff; }
  .statcast-pill .sp-chev { font-size: 0.82rem; line-height: 1; }
  .postseason-tag {
    background: #2c4a7c;
    color: #ffb38a;
    font-size: 0.62rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.02em;
    padding: 2px 8px;
    border-radius: 999px;
    display: inline-block;
    vertical-align: middle;
  }
  @media (max-width: 560px) {
    .bs-header, .bs-row { font-size: 0.66rem; grid-template-columns: 20px 1.4fr repeat(13, 1fr); }
    .bs-header-p, .bs-row-p { font-size: 0.66rem; grid-template-columns: 20px 1.4fr repeat(10, 1fr) 40px; }
    .statcast-pill { padding: 1px 8px; }
    .statcast-pill .sp-text { display: none; }
  }
  .bs-scroll { overflow-x: auto; }
  .bs-scroll .bs-table { min-width: 640px; }

  .empty, .loading, .error { color: var(--text-muted); text-align: center; padding: 2rem 0; }
  .error { color: #c0392b; }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <a href="schedule.html"><img class="league-logo" src="logos/afl-logo.svg" alt="" onerror="this.style.display='none'"></a>
    <h1>
      <span class="title-line">Arizona Fall League</span>
      <span class="title-line"><span class="title-central">Central</span></span>
    </h1>
  </div>
</header>

<nav class="nav-tabs">
  <a class="nav-tab active" href="schedule.html">Schedule</a>
  <a class="nav-tab" href="standings.html">Standings</a>
  <a class="nav-tab" href="roster.html">Rosters</a>
</nav>

<main id="content"><p class="loading">Loading game...</p></main>

<script>
  const params = new URLSearchParams(window.location.search);
  const gamePk = params.get('game_pk');
  let season = params.get('season') || '';
  let view = 'scoring';
  let model = null;

  function esc(s) {
    return String(s === null || s === undefined ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }
  function ordinal(n) {
    const v = n % 100;
    return n + (['th', 'st', 'nd', 'rd'][(v - 20) % 10] || ['th', 'st', 'nd', 'rd'][v] || 'th');
  }

  // Turns the raw MLB game feed into what the page draws. Everything is
  // optional-chained so a missing field degrades to a blank, not a crash.
  function buildModel(feed) {
    const gd = feed.gameData || {};
    const ld = feed.liveData || {};
    const awayT = (gd.teams && gd.teams.away) || {};
    const homeT = (gd.teams && gd.teams.home) || {};
    const teamName = side => (side === 'away' ? awayT : homeT).name || (side === 'away' ? 'Away' : 'Home');
    const teamAbbr = side => (side === 'away' ? awayT : homeT).abbreviation || teamName(side);
    const allPlays = (ld.plays && ld.plays.allPlays) || [];

    // name -> MLB player id, from everyone listed in this game's feed.
    const players = {};
    Object.values(gd.players || {}).forEach(p => { if (p && p.id && p.fullName) players[p.fullName] = p.id; });
    ['away', 'home'].forEach(side => {
      const bp = (((ld.boxscore || {}).teams || {})[side] || {}).players || {};
      Object.values(bp).forEach(p => { const per = p && p.person; if (per && per.id && per.fullName) players[per.fullName] = per.id; });
    });

    // Who is on base after each play. MLB's matchup.postOnFirst/Second/Third
    // gives that directly; if a feed doesn't carry those, rebuild it from the
    // runner movements, resetting at the start of every half-inning.
    const hasPostOn = allPlays.some(p => p.matchup && ('postOnFirst' in p.matchup || 'postOnSecond' in p.matchup || 'postOnThird' in p.matchup));
    let tracked = {}, trackedKey = null;
    const basesAfter = (p, key) => {
      if (hasPostOn) {
        const mu = p.matchup || {};
        return { b1: !!mu.postOnFirst, b2: !!mu.postOnSecond, b3: !!mu.postOnThird };
      }
      if (key !== trackedKey) { tracked = {}; trackedKey = key; }
      (p.runners || []).forEach(r => {
        const mv = r.movement || {};
        const id = r.details && r.details.runner && r.details.runner.id;
        if (id === undefined) return;
        Object.keys(tracked).forEach(b => { if (tracked[b] === id) delete tracked[b]; });
        if (!mv.isOut && (mv.end === '1B' || mv.end === '2B' || mv.end === '3B')) tracked[mv.end] = id;
      });
      return { b1: !!tracked['1B'], b2: !!tracked['2B'], b3: !!tracked['3B'] };
    };

    // id -> name, for charging runs to pitchers and labelling pitching changes.
    const idName = {};
    Object.values(gd.players || {}).forEach(p => { if (p && p.id && p.fullName) idName[p.id] = p.fullName; });
    const nameOf = (id, fb) => idName[id] || fb || '';
    const erTally = {};            // pitcher id -> earned runs charged so far this game
    const lastPit = {};            // fielding side -> pitcher on the mound at the last play
    // Earned / unearned breakdown for the runs scored on one play (or one mid-at-bat event).
    const runInfo = (moves, pitId, pitName) => {
      const by = {}; let unearned = false;
      moves.filter(r => !!(r.movement && r.movement.end === 'score' && !r.movement.isOut)).forEach(r => {
        const d = r.details || {};
        if (d.earned === true) {
          const id = (d.responsiblePitcher && d.responsiblePitcher.id) || pitId;
          if (id === undefined || id === null) return;
          erTally[id] = (erTally[id] || 0) + 1;
          by[id] = erTally[id];
        } else if (d.earned === false) unearned = true;
      });
      const earnedBy = Object.keys(by).map(id => ({ id, name: nameOf(id, String(id) === String(pitId) ? pitName : ''), er: by[id] }));
      return (earnedBy.length || unearned) ? { earnedBy, unearned } : null;
    };

    const halves = [];
    const byKey = {};
    let curBases = { b1: false, b2: false, b3: false }, curKey = null;
    let curAway = 0, curHome = 0;
    const baseKey = { '1B': 'b1', '2B': 'b2', '3B': 'b3' };
    const scoredRun = r => !!(r.movement && r.movement.end === 'score' && !r.movement.isOut);
    const gotOut = r => !!(r.movement && r.movement.isOut);
    // A runner-only play (steal, pickoff, wild pitch...) is already a play of its own in MLB's feed.
    const runnerOnlyResult = /^(stolen_base|caught_stealing|pickoff|wild_pitch|passed_ball|balk|other_advance|defensive_indiff|error)/;
    allPlays.forEach(p => {
      const about = p.about || {};
      const side = about.isTopInning === false || about.halfInning === 'bottom' ? 'home' : 'away';
      const half = side === 'away' ? 'Top' : 'Bottom';
      const key = `${about.inning}_${half}`;
      if (!byKey[key]) {
        byKey[key] = { key, inning: about.inning, half, side, plays: [] };
        halves.push(byKey[key]);
      }
      if (key !== curKey) { curKey = key; curBases = { b1: false, b2: false, b3: false }; }
      const res = p.result || {};
      const runners = p.runners || [];
      const batterId = p.matchup && p.matchup.batter && p.matchup.batter.id;
      const evs = p.playEvents || [];
      const resultIsRunnerOnly = runnerOnlyResult.test(res.eventType || '');

      // Who was pitching, and a "Pitching change" row whenever the pitcher on the mound differs from the last play.
      const mp = p.matchup && p.matchup.pitcher;
      const pitId = mp && mp.id;
      const pitName = mp ? nameOf(mp.id, mp.fullName) : '';
      const pit = pitId ? { id: pitId, name: pitName } : null;
      const fieldSide = side === 'away' ? 'home' : 'away';
      if (pit && lastPit[fieldSide] && String(lastPit[fieldSide].id) !== String(pitId)) {
        const on = [curBases.b1 && '1st', curBases.b2 && '2nd', curBases.b3 && '3rd'].filter(Boolean);
        byKey[key].plays.push({ change: true, newP: pit, oldP: lastPit[fieldSide], team: fieldSide === 'away' ? teamAbbr('away') : teamAbbr('home'), on });
      }
      if (pit) lastPit[fieldSide] = pit;

      // Runner moves that happen in the middle of an at-bat (stolen base, wild pitch,
      // passed ball, pickoff, balk...) are separate non-pitch events inside the play.
      const moveByIdx = {};
      runners.forEach(r => {
        const idx = r.details && r.details.playIndex;
        if (idx === undefined || idx === null) return;
        const rid = r.details.runner && r.details.runner.id;
        if (rid !== undefined && rid === batterId) return;
        (moveByIdx[idx] = moveByIdx[idx] || []).push(r);
      });
      const eventRows = [];
      if (!resultIsRunnerOnly) {
        evs.forEach((ev, i) => {
          if (ev.isPitch) return;
          const idx = ev.index !== undefined ? ev.index : i;
          const moves = moveByIdx[idx];
          const d = ev.details || {};
          if (!moves || !moves.length || !d.description) return;
          if (d.description === res.description) return;
          eventRows.push({ idx, ev, moves });
        });
      }
      const outsInPlay = runners.filter(gotOut).length;
      let outsNow = p.count && p.count.outs !== undefined && p.count.outs !== null ? p.count.outs - outsInPlay : null;
      let runsFromEvents = 0;
      eventRows.sort((x, y) => x.idx - y.idx).forEach(({ ev, moves }) => {
        const d = ev.details || {};
        moves.forEach(r => {
          const mv = r.movement || {};
          if (baseKey[mv.start]) curBases[baseKey[mv.start]] = false;
          if (!mv.isOut && baseKey[mv.end]) curBases[baseKey[mv.end]] = true;
        });
        const runs = moves.filter(scoredRun).length;
        runsFromEvents += runs;
        if (side === 'away') curAway += runs; else curHome += runs;
        if (outsNow !== null) outsNow += moves.filter(gotOut).length;
        const hasScore = d.awayScore !== undefined && d.homeScore !== undefined;
        byKey[key].plays.push({
          event: d.event || '',
          description: d.description || '',
          scoring: runs > 0,
          pitcher: pit,
          runInfo: runInfo(moves, pitId, pitName),
          outs: outsNow,
          awayScore: hasScore ? d.awayScore : curAway,
          homeScore: hasScore ? d.homeScore : curHome,
          bases: { ...curBases },
        });
        if (hasScore) { curAway = d.awayScore; curHome = d.homeScore; }
      });

      const attachedToEvents = new Set(eventRows.map(x => x.idx));
      const resultRunners = runners.filter(r => scoredRun(r) && !attachedToEvents.has(r.details && r.details.playIndex));
      const resultRuns = resultRunners.length;
      const bases = basesAfter(p, key);
      curBases = { ...bases };
      if (res.awayScore !== undefined) curAway = res.awayScore;
      if (res.homeScore !== undefined) curHome = res.homeScore;
      byKey[key].plays.push({
        event: res.event || '',
        description: res.description || '',
        scoring: !!about.isScoringPlay && (runsFromEvents === 0 || resultRuns > 0),
        pitcher: pit,
        runInfo: runInfo(resultRunners, pitId, pitName),
        outs: p.count ? p.count.outs : null,
        awayScore: res.awayScore,
        homeScore: res.homeScore,
        bases,
      });
    });

    const ls = ld.linescore || {};
    return {
      awayName: teamName('away'), homeName: teamName('home'),
      awayAbbr: teamAbbr('away'), homeAbbr: teamAbbr('home'),
      awayRuns: ls.teams && ls.teams.away ? ls.teams.away.runs : null,
      homeRuns: ls.teams && ls.teams.home ? ls.teams.home.runs : null,
      venue: (gd.venue && gd.venue.name) || '',
      date: (gd.datetime && (gd.datetime.officialDate || gd.datetime.originalDate)) || '',
      status: (gd.status && gd.status.detailedState) || '',
      innings: ls.innings || [],
      lineTeams: ls.teams || {},
      halves,
      players,
      season: season || (gd.game && gd.game.season) || '',
    };
  }

  // Turns each player's full name inside a play description into a link to
  // their player page. Longest names first so "Stu Flesland III" wins over
  // "Stu Flesland"; names only match as whole words.
  function linkify(text, m) {
    const names = Object.keys(m.players).sort((a, b) => b.length - a.length);
    if (!names.length) return esc(text);
    const re = new RegExp(names.map(n => n.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('|'), 'g');
    const isWord = ch => !!ch && /[A-Za-z0-9]/.test(ch);
    let out = '', last = 0, match;
    while ((match = re.exec(text)) !== null) {
      const start = match.index, end = start + match[0].length;
      if (isWord(text[start - 1]) || isWord(text[end])) continue;
      out += esc(text.slice(last, start));
      const q = m.season ? `&season=${encodeURIComponent(m.season)}` : '';
      out += `<a class="player-link" href="player.html?id=${encodeURIComponent(m.players[match[0]])}${q}">${esc(match[0])}</a>`;
      last = end;
    }
    return out + esc(text.slice(last));
  }

  function halfLabel(h) { return `${h.half} ${ordinal(h.inning)}`; }

  function headerHtml(m) {
    const score = (m.awayRuns !== null && m.homeRuns !== null && m.awayRuns !== undefined && m.homeRuns !== undefined)
      ? ` &nbsp;${esc(m.awayRuns)} &ndash; ${esc(m.homeRuns)}` : '';
    return `
      <a class="back-link" href="schedule.html" onclick="if (history.length > 1) { history.back(); return false; }">&larr; Back to schedule</a>
      <div class="game-header">
        <div>
          <div class="game-matchup">${esc(m.awayName)} @ ${esc(m.homeName)}${score}</div>
          <div class="game-sub">${esc(m.date)}${m.venue ? ' &middot; ' + esc(m.venue) : ''}</div>
        </div>
        <div class="game-status">${esc(m.status)}</div>
      </div>`;
  }

  function linescoreHtml(m) {
    if (!m.innings.length) return '';
    const nums = m.innings.map(i => i.num);
    const row = (side, abbr) => {
      const cells = m.innings.map(i => `<td>${i[side] && i[side].runs !== undefined ? esc(i[side].runs) : ''}</td>`).join('');
      const t = m.lineTeams[side] || {};
      return `<tr><td>${esc(abbr)}</td>${cells}<td class="tot sep">${esc(t.runs ?? '')}</td><td>${esc(t.hits ?? '')}</td><td>${esc(t.errors ?? '')}</td></tr>`;
    };
    return `<div class="linescore"><table>
      <tr><th></th>${nums.map(n => `<th>${esc(n)}</th>`).join('')}<th class="sep">R</th><th>H</th><th>E</th></tr>
      ${row('away', m.awayAbbr)}${row('home', m.homeAbbr)}
    </table></div>`;
  }

  function scoreText(m, p) {
    if (p.awayScore === undefined || p.homeScore === undefined) return '';
    return `${esc(m.awayAbbr)} ${esc(p.awayScore)}, ${esc(m.homeAbbr)} ${esc(p.homeScore)}`;
  }

  function diamondSvg(b) {
    const f = on => on ? '#f26522' : '#ffffff';
    const names = [b.b1 && '1st', b.b2 && '2nd', b.b3 && '3rd'].filter(Boolean);
    const label = names.length ? `Runners on ${names.join(' and ')}` : 'Bases empty';
    return `<svg width="34" height="34" viewBox="0 0 40 40" role="img" aria-label="${label}"><title>${label}</title><g stroke="#c9c5bb" stroke-width="1.5" stroke-linejoin="round">
      <rect x="14.5" y="1.5" width="11" height="11" transform="rotate(45 20 7)" fill="${f(b.b2)}"/>
      <rect x="1.5" y="14.5" width="11" height="11" transform="rotate(45 7 20)" fill="${f(b.b3)}"/>
      <rect x="27.5" y="14.5" width="11" height="11" transform="rotate(45 33 20)" fill="${f(b.b1)}"/>
      <path d="M20 38 L15 33 L15 30 L25 30 L25 33 Z" fill="#fff"/></g></svg>`;
  }

  function pitcherLink(m, id, name) {
    const q = m.season ? `&season=${encodeURIComponent(m.season)}` : '';
    return id !== undefined && id !== null && id !== ''
      ? `<a href="player.html?id=${encodeURIComponent(id)}${q}">${esc(name || 'Pitcher')}</a>` : esc(name);
  }

  function runsHtml(m, ri) {
    if (!ri) return '';
    const lines = ri.earnedBy.map(e => `<div class="play-run"><span class="run-tag earned">Earned</span><span>${pitcherLink(m, e.id, e.name)} (${esc(e.er)} ER this game)</span></div>`);
    if (ri.unearned) lines.push('<div class="play-run"><span class="run-tag unearned">Unearned</span></div>');
    return `<div class="play-runs">${lines.join('')}</div>`;
  }

  function changeHtml(m, p) {
    const on = p.on && p.on.length ? ` &mdash; runner${p.on.length > 1 ? 's' : ''} on ${esc(p.on.length > 2 ? p.on.slice(0, -1).join(', ') + ' and ' + p.on[p.on.length - 1] : p.on.join(' and '))}` : '';
    return `<div class="pitch-chg">Pitching change: ${pitcherLink(m, p.newP.id, p.newP.name)} replaces ${pitcherLink(m, p.oldP.id, p.oldP.name)} (${esc(p.team)})${on}</div>`;
  }

  function playHtml(m, p, showOuts) {
    if (p.change) return changeHtml(m, p);
    const meta = [];
    if (p.scoring) meta.push(`<div class="play-score">${scoreText(m, p)}</div>`);
    if (showOuts && p.outs !== null && p.outs !== undefined) meta.push(`<div>${esc(p.outs)} out${p.outs === 1 ? '' : 's'}</div>`);
    return `<div class="play${p.scoring ? ' scoring' : ''}">
      <div class="play-body">
        ${(p.event || p.pitcher) ? `<div class="play-top">${p.event ? `<span class="play-event">${esc(p.event)}</span>` : ''}${p.pitcher ? `<span class="pitch-chip">P: ${pitcherLink(m, p.pitcher.id, p.pitcher.name)}</span>` : ''}</div>` : ''}
        <div class="play-desc">${linkify(p.description, m)}</div>
        ${runsHtml(m, p.runInfo)}
      </div>
      ${meta.length ? `<div class="play-meta">${meta.join('')}</div>` : ''}
      ${showOuts && p.bases ? `<div class="dia-wrap">${diamondSvg(p.bases)}</div>` : ''}
    </div>`;
  }

  function halfHtml(m, h, plays, showOuts, open) {
    const battingTeam = h.side === 'away' ? m.awayName : m.homeName;
    const last = plays[plays.length - 1];
    const tail = last && last.awayScore !== undefined && last.homeScore !== undefined
      ? `<span class="half-score">${scoreText(m, last)}</span>` : '';
    return `<details class="half"${open ? ' open' : ''}>
      <summary><span class="caret">&#9654;</span>${esc(halfLabel(h))} &mdash; ${esc(battingTeam)}${tail}</summary>
      ${plays.map(p => playHtml(m, p, showOuts)).join('')}
    </details>`;
  }

  function bodyHtml(m) {
    if (view === 'box') return boxHtml(m);
    if (!m.halves.length) return '<p class="empty">No play data is available for this game yet.</p>';
    if (view === 'scoring') {
      const parts = m.halves
        .map(h => ({ h, plays: h.plays.filter(p => p.scoring) }))
        .filter(x => x.plays.length);
      if (!parts.length) return '<p class="empty">No runs were scored in this game.</p>';
      return parts.map(x => halfHtml(m, x.h, x.plays, false, true)).join('');
    }
    return m.halves.map(h => halfHtml(m, h, h.plays, true, true)).join('');
  }


  // ---- Box Score view: built from the season CSVs (same data the schedule page's box score uses) ----
  let lineupsByGame = {}, pitcherAppearancesByGame = {};
  let hittingGameLogsByKey = {}, hittingGameLogsByPlayer = {}, pitchingGameLogsByKey = {}, pitchingGameLogsByPlayer = {};
  let scheduleRow = null;

  function splitCSVLine(line) {
    const result = []; let cur = '', inQuotes = false;
    for (let i = 0; i < line.length; i++) {
      const ch = line[i];
      if (ch === '"') inQuotes = !inQuotes;
      else if (ch === ',' && !inQuotes) { result.push(cur); cur = ''; }
      else cur += ch;
    }
    result.push(cur);
    return result;
  }
  function parseCSV(text) {
    const lines = text.trim().split(/\r?\n/);
    const headers = splitCSVLine(lines[0]);
    return lines.slice(1).map(line => {
      const values = splitCSVLine(line), row = {};
      headers.forEach((h, i) => { row[h] = values[i] !== undefined ? values[i] : ''; });
      return row;
    });
  }
  async function loadCsv(path) {
    try { const r = await fetch(path); return r.ok ? parseCSV(await r.text()) : []; } catch (e) { return []; }
  }
  async function loadBoxData() {
    let yr = season;
    if (!yr) {
      try { const list = await (await fetch('data/seasons.json')).json(); yr = String(list[list.length - 1]); } catch (e) { yr = String(new Date().getFullYear()); }
    }
    season = yr;
    const base = `data/${yr}/`;
    const [lineups, apps, hitting, pitching, schedule] = await Promise.all([
      loadCsv(base + 'batting_lineups.csv'), loadCsv(base + 'pitcher_appearances.csv'),
      loadCsv(base + 'hitting_gamelogs.csv'), loadCsv(base + 'pitching_gamelogs.csv'), loadCsv(base + 'schedule.csv'),
    ]);
    lineups.forEach(r => { (lineupsByGame[r.game_pk] = lineupsByGame[r.game_pk] || []).push(r); });
    apps.forEach(r => { (pitcherAppearancesByGame[r.game_pk] = pitcherAppearancesByGame[r.game_pk] || []).push(r); });
    hitting.forEach(r => {
      hittingGameLogsByKey[`${r.game_pk}_${r.player_id}`] = r;
      (hittingGameLogsByPlayer[r.player_id] = hittingGameLogsByPlayer[r.player_id] || []).push(r);
    });
    pitching.forEach(r => {
      pitchingGameLogsByKey[`${r.game_pk}_${r.pitcher_id}`] = r;
      (pitchingGameLogsByPlayer[r.pitcher_id] = pitchingGameLogsByPlayer[r.pitcher_id] || []).push(r);
    });
    // A postponed game appears twice with the same game_pk; the makeup row holds the real result.
    const same = schedule.filter(r => String(r.game_pk) === String(gamePk));
    scheduleRow = same.find(r => r.rescheduled === 'Y') || same[0] || null;
  }
  const POSTSEASON_GAME_TYPES = new Set(['D', 'L', 'W']);
  function isPostseasonRow(r) { return POSTSEASON_GAME_TYPES.has(r.game_type); }
  const POSTSEASON_TYPE_LABELS = new Set(['First Round', 'Semifinal', 'Championship']);
  function isPlayoffGame(g) { return POSTSEASON_TYPE_LABELS.has(g.game_type); }

  function fmtRate(n) {
    if (n === null || n === undefined || isNaN(n)) return '';
    return n.toFixed(3).replace(/^0\./, '.');
  }
  function fmtRatio(n) {
    if (n === null || n === undefined || isNaN(n)) return '-.--';
    return n.toFixed(2);
  }

  // Same summation approach as player.html's sumHittingGames/sumPitchingGames
  // -- MLB's own cumulative rate fields (avg/obp/slg/ops, era/whip/W-L) reset
  // independently at the start of each postseason round, so a genuine
  // chained-across-rounds postseason cumulative has to be recomputed from
  // each game's raw counting stats rather than read off the row directly.
  function sumHittingGames(games) {
    const totals = { games: games.length, at_bats: 0, hits: 0, walks: 0, hit_by_pitch: 0, sac_flies: 0, total_bases: 0 };
    games.forEach(g => {
      totals.at_bats += Number(g.at_bats) || 0;
      totals.hits += Number(g.hits) || 0;
      totals.walks += Number(g.walks) || 0;
      totals.hit_by_pitch += Number(g.hit_by_pitch) || 0;
      totals.sac_flies += Number(g.sac_flies) || 0;
      totals.total_bases += Number(g.total_bases) || 0;
    });
    const ab = totals.at_bats;
    const pa_denominator = ab + totals.walks + totals.hit_by_pitch + totals.sac_flies;
    totals.avg = ab > 0 ? (totals.hits / ab) : null;
    totals.obp = pa_denominator > 0 ? ((totals.hits + totals.walks + totals.hit_by_pitch) / pa_denominator) : null;
    totals.slg = ab > 0 ? (totals.total_bases / ab) : null;
    totals.ops = (totals.obp !== null && totals.slg !== null) ? (totals.obp + totals.slg) : null;
    return totals;
  }

  function sumPitchingGames(games) {
    const totals = { games: games.length, wins: 0, losses: 0, saves: 0, hits: 0, earnedRuns: 0, baseOnBalls: 0, outs: 0 };
    games.forEach(g => {
      totals.wins += Number(g.wins) || 0;
      totals.losses += Number(g.losses) || 0;
      totals.saves += Number(g.saves) || 0;
      totals.hits += Number(g.hits) || 0;
      totals.earnedRuns += Number(g.earnedRuns) || 0;
      totals.baseOnBalls += Number(g.baseOnBalls) || 0;
      totals.outs += ipToOuts(g.inningsPitched);
    });
    totals.era = totals.outs > 0 ? (totals.earnedRuns * 27 / totals.outs) : null;
    totals.whip = totals.outs > 0 ? ((totals.hits + totals.baseOnBalls) * 3 / totals.outs) : null;
    return totals;
  }

  // Every postseason game (across all rounds, in date order) for a player up
  // through and including gamePk -- the prefix we chain the cumulative over.
  function postseasonGamesThrough(games, gamePk) {
    const sorted = games.filter(isPostseasonRow).slice()
      .sort((a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : 0));
    const idx = sorted.findIndex(r => String(r.game_pk) === String(gamePk));
    return idx === -1 ? sorted : sorted.slice(0, idx + 1);
  }

  function playoffHittingCumulative(playerId, gamePk) {
    return sumHittingGames(postseasonGamesThrough(hittingGameLogsByPlayer[playerId] || [], gamePk));
  }
  function playoffPitchingCumulative(pitcherId, gamePk) {
    return sumPitchingGames(postseasonGamesThrough(pitchingGameLogsByPlayer[pitcherId] || [], gamePk));
  }

  function fmtDash(v) {
    return (v === undefined || v === '' || v === null) ? '-' : v;
  }

  function ipToOuts(ip) {
    if (!ip) return 0;
    const [whole, frac] = String(ip).split('.');
    const wholeOuts = whole ? parseInt(whole, 10) * 3 : 0;
    const fracOuts = frac ? parseInt(frac, 10) : 0;
    return wholeOuts + fracOuts;
  }

  function gameEraDisplay(er, ip) {
    const outs = ipToOuts(ip);
    if (!outs) return '-.--';
    const earnedRuns = Number(er) || 0;
    return ((earnedRuns * 27) / outs).toFixed(2);
  }

  function battingSectionHtml(gamePk, side, teamName, isPlayoff) {
    const lineup = (lineupsByGame[gamePk] || []).filter(r => r.team_side === side);
    if (!lineup.length) return '';

    const bySlot = {};
    lineup.forEach(r => { (bySlot[r.order_slot] = bySlot[r.order_slot] || []).push(r); });
    const slots = Object.keys(bySlot).sort((a, b) => Number(a) - Number(b));

    let rows = '';
    slots.forEach(slot => {
      const entries = bySlot[slot].slice().sort((a, b) => a.sub_sequence.localeCompare(b.sub_sequence));
      entries.forEach((entry, idx) => { rows += battingRowHtml(gamePk, slot, entry, idx > 0, isPlayoff); });
    });

    const tag = isPlayoff ? ' <span class="postseason-tag">Postseason</span>' : '';
    return `
      <div class="bs-team-title">Batting &mdash; ${teamName || ''}${tag}</div>
      <div class="bs-table">
        <div class="bs-header">
          <div>#</div><div>Player</div><div>AVG</div><div>OPS</div><div>AB</div><div>R</div><div>H</div><div>RBI</div><div>2B</div><div>3B</div><div>HR</div><div>BB</div><div>IBB</div><div>K</div><div>SB</div>
        </div>
        ${rows}
      </div>
      ${isPlayoff ? '<div class="bs-note">AVG and OPS shown are playoff-only, chained across rounds through this game.</div>' : ''}
    `;
  }

  function battingRowHtml(gamePk, slot, entry, isSub, isPlayoff) {
    const stat = hittingGameLogsByKey[`${gamePk}_${entry.player_id}`] || {};
    const nameHtml = `<a class="player-link" href="player.html?id=${entry.player_id}&season=${season}">${entry.player_name}</a>`;
    const subPrefix = isSub ? '<span style="color: var(--text-muted);">&#8618; </span>' : '';
    const posLabel = entry.position_abbreviation
      ? ` <span style="color: var(--text-muted); font-size: 0.7rem;">${entry.position_abbreviation}</span>`
      : '';
    let avgDisplay = fmtDash(stat.avg);
    let opsDisplay = fmtDash(stat.ops);
    if (isPlayoff) {
      const cum = playoffHittingCumulative(entry.player_id, gamePk);
      avgDisplay = fmtDash(fmtRate(cum.avg));
      opsDisplay = fmtDash(fmtRate(cum.ops));
    }
    return `
      <div class="bs-row">
        <div>${isSub ? '' : slot}</div>
        <div>${subPrefix}${nameHtml}${posLabel}</div>
        <div>${avgDisplay}</div>
        <div>${opsDisplay}</div>
        <div>${fmtDash(stat.at_bats)}</div>
        <div>${fmtDash(stat.runs)}</div>
        <div>${fmtDash(stat.hits)}</div>
        <div>${fmtDash(stat.rbi)}</div>
        <div>${fmtDash(stat.doubles)}</div>
        <div>${fmtDash(stat.triples)}</div>
        <div>${fmtDash(stat.home_runs)}</div>
        <div>${fmtDash(stat.walks)}</div>
        <div>${fmtDash(stat.intentional_walks)}</div>
        <div>${fmtDash(stat.strikeouts)}</div>
        <div>${fmtDash(stat.stolen_bases)}</div>
      </div>
    `;
  }

  function pitchingSectionHtml(gamePk, side, teamName, isPlayoff) {
    const appearances = (pitcherAppearancesByGame[gamePk] || [])
      .filter(r => r.team_side === side)
      .slice()
      .sort((a, b) => Number(a.appearance_order) - Number(b.appearance_order));
    if (!appearances.length) return '';

    const rows = appearances.map(app => pitchingRowHtml(gamePk, app, isPlayoff)).join('');

    const tag = isPlayoff ? ' <span class="postseason-tag">Postseason</span>' : '';
    const note = isPlayoff
      ? 'ERA and WHIP shown are playoff-only, chained across rounds through this game; Gm ERA is this game only.'
      : 'ERA and WHIP shown are cumulative through this game; Gm ERA is this game only.';
    return `
      <div class="bs-team-title">Pitching &mdash; ${teamName || ''}${tag}</div>
      <div class="bs-table">
        <div class="bs-header-p">
          <div>#</div><div>Pitcher</div><div>ERA</div><div>Gm ERA</div><div>IP</div><div>H</div><div>R</div><div>ER</div><div>BB</div><div>K</div><div>Pit</div><div>WHIP</div><div></div>
        </div>
        ${rows}
      </div>
      <div class="bs-note">${note}</div>
    `;
  }

  function pitchingRowHtml(gamePk, app, isPlayoff) {
    const stat = pitchingGameLogsByKey[`${gamePk}_${app.pitcher_id}`] || {};
    const nameHtml = `<a class="player-link" href="player.html?id=${app.pitcher_id}&season=${season}">${app.pitcher_name}</a>`;
    const gmEra = gameEraDisplay(stat.earnedRuns, stat.inningsPitched);
    let eraDisplay = fmtDash(stat.era);
    let whipDisplay = fmtDash(stat.whip);
    if (isPlayoff) {
      const cum = playoffPitchingCumulative(app.pitcher_id, gamePk);
      eraDisplay = fmtRatio(cum.era);
      whipDisplay = fmtRatio(cum.whip);
    }
    return `
      <div class="bs-row-p">
        <div>${app.appearance_order}</div>
        <div>${nameHtml}</div>
        <div>${eraDisplay}</div>
        <div>${gmEra}</div>
        <div>${fmtDash(stat.inningsPitched)}</div>
        <div>${fmtDash(stat.hits)}</div>
        <div>${fmtDash(stat.runs)}</div>
        <div>${fmtDash(stat.earnedRuns)}</div>
        <div>${fmtDash(stat.baseOnBalls)}</div>
        <div>${fmtDash(stat.strikeOuts)}</div>
        <div>${fmtDash(stat.numberOfPitches)}</div>
        <div>${whipDisplay}</div>
        <div><a class="statcast-pill" href="game.html?game_pk=${gamePk}&pitcher_id=${app.pitcher_id}&season=${season}" title="View full Statcast for this game"><span class="sp-text">Statcast </span><span class="sp-chev">&rsaquo;</span></a></div>
      </div>
    `;
  }


  function hasBoxScoreData() {
    return !!((lineupsByGame[gamePk] && lineupsByGame[gamePk].length) || (pitcherAppearancesByGame[gamePk] && pitcherAppearancesByGame[gamePk].length));
  }
  let boxSide = 'away';
  function boxHtml(m) {
    if (!hasBoxScoreData()) return '<p class="empty">The box score isn\'t available for this game yet.</p>';
    const isPlayoff = !!scheduleRow && isPlayoffGame(scheduleRow);
    const panel = side => battingSectionHtml(gamePk, side, side === 'away' ? m.awayName : m.homeName, isPlayoff)
      + pitchingSectionHtml(gamePk, side, side === 'away' ? m.awayName : m.homeName, isPlayoff);
    return `
      <div class="bs-team-tabs">
        <button class="bs-team-tab${boxSide === 'away' ? ' active' : ''}" data-side="away">${esc(m.awayName)}</button>
        <button class="bs-team-tab${boxSide === 'home' ? ' active' : ''}" data-side="home">${esc(m.homeName)}</button>
      </div>
      <div class="bs-team-panel bs-scroll" data-side="away"${boxSide === 'away' ? '' : ' style="display:none;"'}>${panel('away')}</div>
      <div class="bs-team-panel bs-scroll" data-side="home"${boxSide === 'home' ? '' : ' style="display:none;"'}>${panel('home')}</div>`;
  }

  function render() {
    const m = model;
    document.getElementById('content').innerHTML = `
      ${headerHtml(m)}
      ${linescoreHtml(m)}
      <div class="view-tabs">
        <button class="view-tab${view === 'box' ? ' active' : ''}" data-view="box">Box Score</button>
        <button class="view-tab${view === 'scoring' ? ' active' : ''}" data-view="scoring">Scoring Summary</button>
        <button class="view-tab${view === 'pbp' ? ' active' : ''}" data-view="pbp">Play-by-Play</button>
      </div>
      <div id="viewBody">${bodyHtml(m)}</div>`;
    document.querySelectorAll('.view-tab').forEach(b => b.addEventListener('click', () => {
      view = b.dataset.view;
      const url = new URL(window.location.href);
      url.searchParams.set('view', view);
      history.replaceState(null, '', url);
      render();
    }));
    document.querySelectorAll('.bs-team-tab').forEach(b => b.addEventListener('click', () => {
      boxSide = b.dataset.side;
      document.querySelectorAll('.bs-team-tab').forEach(x => x.classList.toggle('active', x.dataset.side === boxSide));
      document.querySelectorAll('.bs-team-panel').forEach(p => { p.style.display = p.dataset.side === boxSide ? 'block' : 'none'; });
    }));
  }

  async function init() {
    const content = document.getElementById('content');
    if (!gamePk) { content.innerHTML = '<p class="error">Missing game_pk in the URL.</p>'; return; }
    if (params.get('view') === 'pbp') view = 'pbp';
    else if (params.get('view') === 'box') view = 'box';
    try {
      await loadBoxData();
      const res = await fetch(`https://statsapi.mlb.com/api/v1.1/game/${encodeURIComponent(gamePk)}/feed/live`);
      if (!res.ok) throw new Error(`MLB API returned ${res.status}`);
      model = buildModel(await res.json());
      render();
    } catch (e) {
      content.innerHTML = `<a class="back-link" href="schedule.html">&larr; Back to schedule</a><p class="error">Couldn't load play data for this game right now. Please try again in a moment.</p>`;
    }
  }
  init();
</script>
<script src="player-search.js"></script>
<script src="top-scrollbar.js"></script>
</body>
</html>
