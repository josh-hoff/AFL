<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arizona Fall League Central - Standings</title>
<style>
  :root {
    --bg: #FDFCFB;
    --bg-card: #FFFFFF;
    --border: #e8e6e2;
    --text: #111418;
    --text-muted: #5a6472;
    --accent: #b8860b;
    --final: #1a8a4a;
    --cancelled: #c0392b;
    --scheduled: #2f6fb0;
    --header-bg: #0d1b3a;
    --header-card-bg: #16305c;
    --header-border: #2c4a7c;
    --header-text: #ffffff;
    --tab-active: #f26522;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    line-height: 1.5;
  }
  header {
    padding: 1.5rem 1.5rem 0;
  }
  .header-inner {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 2.5rem;
    max-width: 900px;
    margin: 0 auto;
    background: var(--header-bg);
    border-radius: 16px;
    padding: 2.25rem 1.5rem;
  }
  h1 {
    font-size: 2.2rem;
    font-weight: 600;
    margin: 0;
    letter-spacing: -0.01em;
    text-align: center;
    color: var(--header-text);
  }
  .league-logo {
    height: 100px;
    width: auto;
    flex-shrink: 0;
  }
  .title-line {
    display: block;
    line-height: 1.3;
  }
  .title-central {
    display: inline-block;
    border-bottom: 2px solid var(--header-text);
    padding-bottom: 0.2rem;
    width: fit-content;
  }
  footer {
    max-width: 900px;
    margin: 0 auto;
    padding: 1.5rem 1.5rem 3rem;
    text-align: center;
  }
  .subtitle {
    color: var(--text-muted);
    font-size: 0.75rem;
    margin: 0;
  }
  .season-control {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100px;
    gap: 0.4rem;
    flex-shrink: 0;
  }
  .season-label {
    color: var(--header-text);
    font-size: 1.15rem;
    font-weight: 600;
  }
  .season-select {
    background: var(--header-card-bg);
    border: 1px solid var(--header-border);
    color: var(--header-text);
    padding: 0.5rem 1rem;
    border-radius: 6px;
    cursor: pointer;
    font-size: 0.9rem;
    font-weight: 600;
    font-family: inherit;
  }
  .nav-tabs {
    display: flex;
    justify-content: center;
    gap: 2rem;
    max-width: 900px;
    margin: 1.25rem auto 0;
    padding: 0 1.5rem;
    border-bottom: 1px solid var(--border);
  }
  .nav-tab {
    display: inline-block;
    padding-bottom: 0.7rem;
    margin-bottom: -1px;
    color: var(--text-muted);
    font-weight: 600;
    font-size: 0.95rem;
    text-decoration: none;
    border-bottom: 3px solid transparent;
  }
  .nav-tab:hover {
    color: var(--text);
  }
  .nav-tab.active {
    color: var(--text);
    font-weight: 700;
    border-bottom-color: var(--tab-active);
  }
  main {
    max-width: 900px;
    margin: 0 auto;
    padding: 2rem 1.5rem 3rem;
    text-align: center;
    color: var(--text-muted);
  }
  .placeholder {
    padding: 4rem 0;
    font-size: 0.95rem;
  }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <img class="league-logo" src="logos/afl-logo.svg" alt="" onerror="this.style.display='none'">
    <h1>
      <span class="title-line">Arizona Fall League</span>
      <span class="title-line"><span class="title-central">Central</span></span>
    </h1>
    <div class="season-control">
      <span class="season-label">Season:</span>
      <select id="season-select" class="season-select"></select>
    </div>
  </div>
</header>

<nav class="nav-tabs">
  <a class="nav-tab" href="index.html">Home</a>
  <a class="nav-tab" href="schedule.html">Schedule</a>
  <a class="nav-tab active" href="standings.html">Standings</a>
</nav>

<main id="content">
  <p class="placeholder">Standings page content coming soon</p>
</main>

<footer>
  <p class="subtitle">Data updated automatically from the MLB Stats API</p>
</footer>

<script>
  let SEASONS = [];
  const params = new URLSearchParams(window.location.search);
  let currentSeason = parseInt(params.get('season'), 10) || new Date().getFullYear();

  async function loadSeasons() {
    try {
      const res = await fetch('data/seasons.json');
      if (res.ok) {
        SEASONS = await res.json();
      }
    } catch (e) {
      // fall through to fallback below
    }
    if (!SEASONS || SEASONS.length === 0) {
      SEASONS = [currentSeason];
    }
    if (!SEASONS.includes(currentSeason)) {
      currentSeason = SEASONS[SEASONS.length - 1];
    }
  }

  function updateUrl() {
    const p = new URLSearchParams();
    p.set('season', currentSeason);
    history.replaceState(null, '', '?' + p.toString());
  }

  function renderControls() {
    const el = document.getElementById('season-select');
    el.innerHTML = '';
    [...SEASONS].sort((a, b) => b - a).forEach(season => {
      const opt = document.createElement('option');
      opt.value = season;
      opt.textContent = season;
      if (season === currentSeason) opt.selected = true;
      el.appendChild(opt);
    });
    el.onchange = () => {
      currentSeason = parseInt(el.value, 10);
      updateUrl();
    };
  }

  async function init() {
    await loadSeasons();
    renderControls();
    updateUrl();
  }

  init();
</script>

</body>
</html>
