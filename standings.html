<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arizona Fall League Central - Standings</title>
<style>
  :root {
    --bg: #FDFCFB;
    --bg-card: #FFFFFF;
    --border: #e8e6e2;
    --text: #111418;
    --text-muted: #5a6472;
    --accent: #b8860b;
    --final: #1a8a4a;
    --cancelled: #c0392b;
    --scheduled: #2f6fb0;
    --header-bg: #0d1b3a;
    --header-card-bg: #16305c;
    --header-border: #2c4a7c;
    --header-text: #ffffff;
    --tab-active: #f26522;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    line-height: 1.5;
  }
  header {
    padding: 1.5rem 1.5rem 0;
  }
  .header-inner {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 2.5rem;
    max-width: 900px;
    margin: 0 auto;
    background: var(--header-bg);
    border-radius: 16px;
    padding: 2.25rem 1.5rem;
  }
  h1 {
    font-size: 2.2rem;
    font-weight: 600;
    margin: 0;
    letter-spacing: -0.01em;
    text-align: center;
    color: var(--header-text);
  }
  .league-logo {
    height: 100px;
    width: auto;
    flex-shrink: 0;
  }
  .header-inner > a {
    display: inline-flex;
    flex-shrink: 0;
    line-height: 0;
  }
  .title-line {
    display: block;
    line-height: 1.3;
  }
  .title-central {
    display: inline-block;
    border-bottom: 2px solid var(--header-text);
    padding-bottom: 0.2rem;
    width: fit-content;
  }
  footer {
    max-width: 900px;
    margin: 0 auto;
    padding: 1.5rem 1.5rem 3rem;
    text-align: center;
  }
  .subtitle {
    color: var(--text-muted);
    font-size: 0.75rem;
    margin: 0;
  }
  .season-control {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100px;
    gap: 0.4rem;
    flex-shrink: 0;
  }
  .season-label {
    color: var(--header-text);
    font-size: 1.15rem;
    font-weight: 600;
  }
  .season-select {
    background: var(--header-card-bg);
    border: 1px solid var(--header-border);
    color: var(--header-text);
    padding: 0.5rem 1rem;
    border-radius: 6px;
    cursor: pointer;
    font-size: 0.9rem;
    font-weight: 600;
    font-family: inherit;
  }
  .nav-tabs {
    display: flex;
    justify-content: center;
    gap: 2rem;
    max-width: 900px;
    margin: 1.25rem auto 0;
    padding: 0 1.5rem;
    border-bottom: 1px solid var(--border);
  }
  .nav-tab {
    display: inline-block;
    padding-bottom: 0.7rem;
    margin-bottom: -1px;
    color: var(--text-muted);
    font-weight: 600;
    font-size: 0.95rem;
    text-decoration: none;
    border-bottom: 3px solid transparent;
  }
  .nav-tab:hover {
    color: var(--text);
  }
  .nav-tab.active {
    color: var(--text);
    font-weight: 700;
    border-bottom-color: var(--tab-active);
  }
  main {
    max-width: 900px;
    margin: 0 auto;
    padding: 2rem 1.5rem 3rem;
  }
  .standings-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 0.75rem;
    margin-bottom: 0.9rem;
  }
  .standings-title {
    font-size: 1.3rem;
    font-weight: 700;
    color: var(--text);
  }
  .standings-asof {
    display: flex;
    align-items: center;
    gap: 0.75rem;
  }
  .standings-asof-label {
    color: var(--text-muted);
    font-size: 0.78rem;
  }
  .standings-asof-label.final {
    color: var(--tab-active);
    font-weight: 600;
  }
  .standings-date-input {
    background: var(--bg-card);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 0.4rem 0.7rem;
    border-radius: 6px;
    font-size: 0.85rem;
    font-family: inherit;
  }
  .standings-table {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 10px;
    box-shadow: 0 1px 2px rgba(0,0,0,0.04);
    overflow-x: auto;
  }
  .standings-row {
    display: grid;
    grid-template-columns: 1.8fr 0.5fr 0.5fr 0.6fr 0.5fr 0.7fr 0.6fr 0.5fr 0.5fr 0.6fr 0.7fr 0.7fr;
    gap: 0.3rem;
    padding: 0.65rem 1.1rem;
    align-items: center;
    min-width: 820px;
  }
  .standings-row.head {
    background: #f2f1ee;
    color: var(--text-muted);
    font-size: 0.7rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }
  .standings-row.body {
    border-top: 1px solid var(--border);
    font-size: 0.88rem;
  }
  .standings-cell {
    text-align: center;
  }
  .standings-team-cell {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    text-align: left;
  }
  .standings-logo {
    width: 20px;
    height: 20px;
    object-fit: contain;
    flex-shrink: 0;
  }
  .standings-team-link {
    color: var(--text);
    text-decoration: none;
    border-bottom: 1px dashed transparent;
  }
  .standings-team-link:hover {
    color: var(--tab-active);
    border-bottom-color: var(--tab-active);
  }
  .streak-win { color: var(--final); font-weight: 700; }
  .streak-loss { color: var(--cancelled); font-weight: 700; }
  .diff-pos { color: var(--final); }
  .diff-neg { color: var(--cancelled); }
  .standings-note {
    color: var(--text-muted);
    font-size: 0.78rem;
    margin-top: 0.6rem;
  }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <a href="index.html"><img class="league-logo" src="logos/afl-logo.svg" alt="" onerror="this.style.display='none'"></a>
    <h1>
      <span class="title-line">Arizona Fall League</span>
      <span class="title-line"><span class="title-central">Central</span></span>
    </h1>
    <div class="season-control">
      <span class="season-label">Season:</span>
      <select id="season-select" class="season-select"></select>
    </div>
  </div>
</header>

<nav class="nav-tabs">
  <a class="nav-tab" href="index.html">Home</a>
  <a class="nav-tab" href="schedule.html">Schedule</a>
  <a class="nav-tab active" href="standings.html">Standings</a>
</nav>

<main id="content">
  <p class="loading">Loading standings...</p>
</main>

<footer>
  <p class="subtitle">Data updated automatically from the MLB Stats API</p>
</footer>

<script>
  const TEAM_LOGOS = {
    'Glendale Desert Dogs': 'logos/glendale.svg',
    'Mesa Solar Sox': 'logos/mesa.svg',
    'Peoria Javelinas': 'logos/peoria.svg',
    'Salt River Rafters': 'logos/salt-river.svg',
    'Scottsdale Scorpions': 'logos/scottsdale.svg',
    'Surprise Saguaros': 'logos/surprise.svg',
  };
  const AFL_TEAM_NAMES = Object.keys(TEAM_LOGOS);

  let SEASONS = [];
  const params = new URLSearchParams(window.location.search);
  let currentSeason = parseInt(params.get('season'), 10) || new Date().getFullYear();
  let availableDates = [];
  let currentDate = null;
  let seasonDateRange = null;

  function buildZeroTeams() {
    return AFL_TEAM_NAMES.map(name => ({
      team_name: name, wins: 0, losses: 0, pct: '.000', games_back: '-',
      streak: '', last_ten_wins: 0, last_ten_losses: 0, runs_scored: 0,
      runs_allowed: 0, run_diff: 0, home_wins: 0, home_losses: 0, away_wins: 0, away_losses: 0,
    }));
  }

  function extractSeasonDateRange(csvText) {
    const lines = csvText.trim().split(/\r?\n/);
    if (lines.length < 2) return null;
    let minDate = null, maxDate = null;
    for (let i = 1; i < lines.length; i++) {
      const m = lines[i].match(/^(\d{4}-\d{2}-\d{2})/);
      if (!m) continue;
      const d = m[1];
      if (!minDate || d < minDate) minDate = d;
      if (!maxDate || d > maxDate) maxDate = d;
    }
    return minDate && maxDate ? { first: minDate, last: maxDate } : null;
  }

  function findClosestAvailableDate(targetDate) {
    if (availableDates.includes(targetDate)) return targetDate;
    let closest = null;
    for (const d of availableDates) {
      if (d <= targetDate) closest = d;
      else break;
    }
    return closest || availableDates[0] || null;
  }

  async function loadSeasons() {
    try {
      const res = await fetch('data/seasons.json');
      if (res.ok) SEASONS = await res.json();
    } catch (e) {}
    if (!SEASONS || SEASONS.length === 0) SEASONS = [currentSeason];
    if (!SEASONS.includes(currentSeason)) currentSeason = SEASONS[SEASONS.length - 1];
  }

  function renderControls() {
    const el = document.getElementById('season-select');
    el.innerHTML = '';
    [...SEASONS].sort((a, b) => b - a).forEach(season => {
      const opt = document.createElement('option');
      opt.value = season;
      opt.textContent = season;
      if (season === currentSeason) opt.selected = true;
      el.appendChild(opt);
    });
    el.onchange = () => {
      currentSeason = parseInt(el.value, 10);
      currentDate = null;
      updateUrl();
      loadStandingsForSeason();
    };
  }

  function updateUrl() {
    const p = new URLSearchParams();
    p.set('season', currentSeason);
    if (currentDate) p.set('date', currentDate);
    history.replaceState(null, '', '?' + p.toString());
  }

  function teamLogoImg(name) {
    const src = TEAM_LOGOS[name];
    if (!src) return '';
    return `<img class="standings-logo" src="${src}" alt="" onerror="this.style.display='none'">`;
  }

  function streakClass(streak) {
    if (!streak) return '';
    if (streak.startsWith('W')) return 'streak-win';
    if (streak.startsWith('L')) return 'streak-loss';
    return '';
  }

  function diffClass(diff) {
    const n = Number(diff);
    if (n > 0) return 'diff-pos';
    if (n < 0) return 'diff-neg';
    return '';
  }

  function diffDisplay(diff) {
    const n = Number(diff);
    return n > 0 ? `+${n}` : `${n}`;
  }

  function renderStandings(data, options = {}) {
    const content = document.getElementById('content');
    const noDataYet = !!options.noDataYet;

    const today = new Date();
    const todayStr = new Intl.DateTimeFormat('en-CA', { timeZone: 'America/Phoenix' }).format(today);

    let asofLabel, minDate, maxDate, inputValue;

    if (noDataYet) {
      asofLabel = `<span class="standings-asof-label">Season hasn't started yet &mdash; all teams begin at 0-0</span>`;
      minDate = seasonDateRange ? seasonDateRange.first : '';
      maxDate = seasonDateRange ? seasonDateRange.last : '';
      inputValue = minDate;
    } else {
      const latestAvailable = availableDates[availableDates.length - 1];
      const isLatestAvailable = currentDate === latestAvailable;
      const isToday = currentDate === todayStr;
      const seasonTrulyOver = seasonDateRange && latestAvailable >= seasonDateRange.last;

      if (isToday) {
        asofLabel = `<span class="standings-asof-label">As of today (${currentDate})</span>`;
      } else if (isLatestAvailable && seasonTrulyOver) {
        asofLabel = `<span class="standings-asof-label final">Final standings (as of ${currentDate})</span>`;
      } else if (isLatestAvailable) {
        asofLabel = `<span class="standings-asof-label">Most recent standings (as of ${currentDate})</span>`;
      } else {
        asofLabel = `<span class="standings-asof-label">As of ${currentDate}</span>`;
      }

      minDate = availableDates[0];
      maxDate = (seasonDateRange && seasonDateRange.last > latestAvailable) ? seasonDateRange.last : latestAvailable;
      inputValue = currentDate;
    }

    let html = `
      <div class="standings-header">
        <div class="standings-title">${currentSeason} Standings</div>
        <div class="standings-asof">
          ${asofLabel}
          <input type="date" id="standings-date-input" class="standings-date-input"
                 value="${inputValue}" min="${minDate}" max="${maxDate}">
        </div>
      </div>
      <div class="standings-table">
        <div class="standings-row head">
          <div>Team</div>
          <div class="standings-cell">W</div>
          <div class="standings-cell">L</div>
          <div class="standings-cell">PCT</div>
          <div class="standings-cell">GB</div>
          <div class="standings-cell">L10</div>
          <div class="standings-cell">Strk</div>
          <div class="standings-cell">RS</div>
          <div class="standings-cell">RA</div>
          <div class="standings-cell">Diff</div>
          <div class="standings-cell">Home</div>
          <div class="standings-cell">Road</div>
        </div>
    `;

    (data.teams || []).forEach(t => {
      const teamLink = `schedule.html?season=${currentSeason}&team=${encodeURIComponent(t.team_name)}`;
      html += `
        <div class="standings-row body">
          <div class="standings-team-cell">
            ${teamLogoImg(t.team_name)}
            <a class="standings-team-link" href="${teamLink}">${t.team_name}</a>
          </div>
          <div class="standings-cell">${t.wins ?? ''}</div>
          <div class="standings-cell">${t.losses ?? ''}</div>
          <div class="standings-cell">${t.pct ?? ''}</div>
          <div class="standings-cell">${t.games_back ?? ''}</div>
          <div class="standings-cell">${t.last_ten_wins ?? ''}-${t.last_ten_losses ?? ''}</div>
          <div class="standings-cell ${streakClass(t.streak)}">${t.streak ?? ''}</div>
          <div class="standings-cell">${t.runs_scored ?? ''}</div>
          <div class="standings-cell">${t.runs_allowed ?? ''}</div>
          <div class="standings-cell ${diffClass(t.run_diff)}">${t.run_diff !== undefined && t.run_diff !== null ? diffDisplay(t.run_diff) : ''}</div>
          <div class="standings-cell">${t.home_wins ?? ''}-${t.home_losses ?? ''}</div>
          <div class="standings-cell">${t.away_wins ?? ''}-${t.away_losses ?? ''}</div>
        </div>
      `;
    });

    html += `</div><div class="standings-note">Scroll horizontally to see all columns on narrow screens</div>`;
    content.innerHTML = html;

    document.getElementById('standings-date-input').onchange = (e) => {
      if (noDataYet) {
        renderStandings({ date: null, teams: buildZeroTeams() }, { noDataYet: true });
        return;
      }
      const resolved = findClosestAvailableDate(e.target.value) || availableDates[availableDates.length - 1];
      currentDate = resolved;
      updateUrl();
      loadOneDay();
    };
  }

  async function loadOneDay() {
    const content = document.getElementById('content');
    try {
      const res = await fetch(`data/${currentSeason}/standings/${currentDate}.json`);
      if (!res.ok) throw new Error('No standings found for this date.');
      const data = await res.json();
      renderStandings(data);
    } catch (err) {
      content.innerHTML = `<p class="error">Couldn't load standings for ${currentDate}: ${err.message}</p>`;
    }
  }

  async function loadStandingsForSeason() {
    const content = document.getElementById('content');
    content.innerHTML = '<p class="loading">Loading standings...</p>';

    seasonDateRange = null;
    try {
      const schedRes = await fetch(`data/${currentSeason}/schedule.csv`);
      if (schedRes.ok) {
        const text = await schedRes.text();
        seasonDateRange = extractSeasonDateRange(text);
      }
    } catch (e) {}

    availableDates = [];
    try {
      const res = await fetch(`data/${currentSeason}/standings/dates.json`);
      if (res.ok) {
        const parsed = await res.json();
        if (parsed && parsed.length > 0) availableDates = parsed;
      }
    } catch (e) {}

    if (availableDates.length === 0) {
      renderStandings({ date: null, teams: buildZeroTeams() }, { noDataYet: true });
      return;
    }

    const today = new Date();
    const todayStr = new Intl.DateTimeFormat('en-CA', { timeZone: 'America/Phoenix' }).format(today);

    if (!currentDate) currentDate = todayStr;
    currentDate = findClosestAvailableDate(currentDate) || availableDates[availableDates.length - 1];

    await loadOneDay();
  }

  async function init() {
    await loadSeasons();
    renderControls();
    currentDate = params.get('date') || null;
    loadStandingsForSeason();
  }

  init();
</script>

</body>
</html>
