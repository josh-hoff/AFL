<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arizona Fall League Schedule</title>
<style>
  :root {
    --bg: #14181f;
    --bg-card: #1c222c;
    --border: #2c3440;
    --text: #e8e6df;
    --text-muted: #8b93a1;
    --accent: #d9a441;
    --final: #4f8a63;
    --cancelled: #a34a3f;
    --scheduled: #4a6fa5;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    line-height: 1.5;
  }
  header {
    padding: 2.5rem 1.5rem 1.5rem;
    max-width: 900px;
    margin: 0 auto;
  }
  h1 {
    font-size: 1.8rem;
    font-weight: 600;
    margin: 0 0 0.3rem;
    letter-spacing: -0.01em;
  }
  .subtitle {
    color: var(--text-muted);
    font-size: 0.95rem;
    margin: 0;
  }
  .controls {
    max-width: 900px;
    margin: 0 auto;
    padding: 0 1.5rem 1rem;
    display: flex;
    gap: 0.5rem;
  }
  .season-btn {
    background: var(--bg-card);
    border: 1px solid var(--border);
    color: var(--text-muted);
    padding: 0.4rem 1rem;
    border-radius: 6px;
    cursor: pointer;
    font-size: 0.9rem;
  }
  .season-btn.active {
    border-color: var(--accent);
    color: var(--accent);
  }
  main {
    max-width: 900px;
    margin: 0 auto;
    padding: 0 1.5rem 3rem;
  }
  .day-group {
    margin-bottom: 1.75rem;
  }
  .day-label {
    font-size: 0.8rem;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--text-muted);
    margin: 0 0 0.6rem;
    padding-bottom: 0.4rem;
    border-bottom: 1px solid var(--border);
  }
  .game-row {
    display: grid;
    grid-template-columns: 70px 1fr auto;
    align-items: center;
    gap: 1rem;
    padding: 0.7rem 0.9rem;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 8px;
    margin-bottom: 0.5rem;
  }
  .game-time {
    color: var(--text-muted);
    font-size: 0.85rem;
  }
  .matchup {
    font-size: 0.98rem;
  }
  .venue {
    color: var(--text-muted);
    font-size: 0.82rem;
    margin-top: 0.15rem;
  }
  .status {
    font-size: 0.78rem;
    padding: 0.25rem 0.6rem;
    border-radius: 5px;
    white-space: nowrap;
    text-align: center;
  }
  .status.final { background: rgba(79,138,99,0.18); color: var(--final); }
  .status.scheduled { background: rgba(74,111,165,0.18); color: var(--scheduled); }
  .status.cancelled, .status.postponed { background: rgba(163,74,63,0.18); color: var(--cancelled); }
  .score {
    color: var(--text-muted);
    font-weight: 400;
  }
  .score.win {
    color: var(--final);
    font-weight: 600;
  }
  .score.loss {
    color: var(--cancelled);
    font-weight: 400;
  }
  .loading, .error {
    color: var(--text-muted);
    padding: 2rem 0;
  }
  .team-link {
    color: var(--text);
    cursor: pointer;
    text-decoration: none;
    border-bottom: 1px dashed transparent;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    vertical-align: middle;
  }
  .team-logo {
    width: 18px;
    height: 18px;
    object-fit: contain;
    flex-shrink: 0;
  }
  .team-link:hover {
    color: var(--accent);
    border-bottom-color: var(--accent);
  }
  .team-link.winner {
    font-weight: 700;
  }
  .filter-banner {
    display: flex;
    align-items: center;
    gap: 0.7rem;
    max-width: 900px;
    margin: 0 auto;
    padding: 0 1.5rem 1rem;
    font-size: 0.9rem;
    color: var(--text-muted);
  }
  .filter-banner strong {
    color: var(--text);
    font-weight: 600;
  }
  .record-win { color: var(--final); font-weight: 600; }
  .record-loss { color: var(--cancelled); font-weight: 600; }
  .record-tie { color: var(--text); font-weight: 600; }
  .clear-filter {
    color: var(--accent);
    cursor: pointer;
    text-decoration: underline;
    background: none;
    border: none;
    font-size: 0.9rem;
    padding: 0;
  }
  @media (max-width: 560px) {
    .game-row { grid-template-columns: 55px 1fr; }
    .status { grid-column: 1 / -1; justify-self: start; margin-top: 0.3rem; }
  }
</style>
</head>
<body>

<header>
  <h1>Arizona Fall League</h1>
  <p class="subtitle">Schedule, updated automatically from the MLB Stats API</p>
</header>

<div class="controls" id="season-controls"></div>
<div class="filter-banner" id="filter-banner" style="display:none;"></div>

<main id="content">
  <p class="loading">Loading schedule...</p>
</main>

<script>
  const SEASONS = [2025, 2026];
  const params = new URLSearchParams(window.location.search);
  let currentSeason = parseInt(params.get('season'), 10) || 2026;
  let currentTeam = params.get('team') || null;
  let allGames = [];

  function renderControls() {
    const el = document.getElementById('season-controls');
    el.innerHTML = '';
    SEASONS.forEach(season => {
      const btn = document.createElement('button');
      btn.className = 'season-btn' + (season === currentSeason ? ' active' : '');
      btn.textContent = season + ' season';
      btn.onclick = () => {
        currentSeason = season;
        currentTeam = null;
        updateUrl();
        renderControls();
        loadSchedule();
      };
      el.appendChild(btn);
    });
  }

  function updateUrl() {
    const p = new URLSearchParams();
    p.set('season', currentSeason);
    if (currentTeam) p.set('team', currentTeam);
    history.replaceState(null, '', '?' + p.toString());
  }

  function setTeamFilter(teamName) {
    currentTeam = teamName;
    updateUrl();
    renderBanner();
    renderGames();
  }

  function clearTeamFilter() {
    currentTeam = null;
    updateUrl();
    renderBanner();
    renderGames();
  }

  function getTeamRecord(teamName) {
    const played = allGames.filter(g => {
      const isThisTeam = g.away_team === teamName || g.home_team === teamName;
      const isRegularSeason = g.game_type === 'Regular Season';
      const s = (g.status || '').toLowerCase();
      const wasPlayed = s.includes('final') || s.includes('completed');
      return isThisTeam && isRegularSeason && wasPlayed;
    });
    if (played.length === 0) return null;

    played.sort((a, b) => (a.date > b.date ? 1 : -1));
    const last = played[played.length - 1];
    const isAway = last.away_team === teamName;
    const wins = isAway ? last.away_wins : last.home_wins;
    const losses = isAway ? last.away_losses : last.home_losses;
    const ties = isAway ? last.away_ties : last.home_ties;
    if (wins === undefined || losses === undefined || wins === '' || losses === '') return null;

    return { wins, losses, ties };
  }

  function renderBanner() {
    const banner = document.getElementById('filter-banner');
    if (currentTeam) {
      banner.style.display = 'flex';
      const record = getTeamRecord(currentTeam);
      let recordHtml = '';
      if (record) {
        recordHtml = ` (<span class="record-win">${record.wins}</span> - <span class="record-loss">${record.losses}</span>`;
        if (record.ties && record.ties !== '0') {
          recordHtml += ` - <span class="record-tie">${record.ties}</span>`;
        }
        recordHtml += ')';
      }
      banner.innerHTML = `<strong>${currentTeam}</strong>${recordHtml}`;
      const clearBtn = document.createElement('button');
      clearBtn.className = 'clear-filter';
      clearBtn.textContent = 'Show all teams';
      clearBtn.onclick = clearTeamFilter;
      banner.appendChild(clearBtn);
    } else {
      banner.style.display = 'none';
      banner.innerHTML = '';
    }
  }

  function parseCSV(text) {
    const lines = text.trim().split(/\r?\n/);
    const headers = splitCSVLine(lines[0]);
    return lines.slice(1).map(line => {
      const values = splitCSVLine(line);
      const row = {};
      headers.forEach((h, i) => { row[h] = values[i] !== undefined ? values[i] : ''; });
      return row;
    });
  }

  function splitCSVLine(line) {
    const result = [];
    let cur = '';
    let inQuotes = false;
    for (let i = 0; i < line.length; i++) {
      const ch = line[i];
      if (ch === '"') {
        inQuotes = !inQuotes;
      } else if (ch === ',' && !inQuotes) {
        result.push(cur);
        cur = '';
      } else {
        cur += ch;
      }
    }
    result.push(cur);
    return result;
  }

  function statusClass(status) {
    const s = (status || '').toLowerCase();
    if (s.includes('final') || s.includes('completed')) return 'final';
    if (s.includes('cancel')) return 'cancelled';
    if (s.includes('postpon')) return 'postponed';
    return 'scheduled';
  }

  const TEAM_LOGOS = {
    'Glendale Desert Dogs': 'logos/glendale.png',
    'Mesa Solar Sox': 'logos/mesa.png',
    'Peoria Javelinas': 'logos/peoria.png',
    'Salt River Rafters': 'logos/salt-river.png',
    'Scottsdale Scorpions': 'logos/scottsdale.png',
    'Surprise Saguaros': 'logos/surprise.png',
  };

  function teamLogoImg(name) {
    const src = TEAM_LOGOS[name];
    if (!src) return '';
    return `<img class="team-logo" src="${src}" alt="" onerror="this.style.display='none'">`;
  }

  function teamLink(name, isWinner) {
    const safe = (name || 'TBD').replace(/'/g, "\\'");
    const winnerClass = isWinner ? ' winner' : '';
    return `<a class="team-link${winnerClass}" href="#" onclick="setTeamFilter('${safe}'); return false;">${teamLogoImg(name)}${name || 'TBD'}</a>`;
  }

  function scoreSpan(teamScore, opponentScore) {
    if (teamScore === '' || teamScore === undefined) return '';
    const isWin = Number(teamScore) > Number(opponentScore);
    const isLoss = Number(teamScore) < Number(opponentScore);
    const cls = isWin ? ' win' : isLoss ? ' loss' : '';
    return ` <span class="score${cls}">${teamScore}</span>`;
  }

  function renderGames() {
    const content = document.getElementById('content');
    let games = allGames;

    if (currentTeam) {
      games = games.filter(g => g.away_team === currentTeam || g.home_team === currentTeam);
    }

    const groups = {};
    games.forEach(g => {
      const key = g.date || 'Unknown date';
      if (!groups[key]) groups[key] = [];
      groups[key].push(g);
    });

    content.innerHTML = '';
    Object.keys(groups).forEach(dateLabel => {
      const section = document.createElement('div');
      section.className = 'day-group';

      const label = document.createElement('div');
      label.className = 'day-label';
      label.textContent = dateLabel;
      section.appendChild(label);

      groups[dateLabel].forEach(g => {
        const row = document.createElement('div');
        row.className = 'game-row';
        const hasScore = g.away_score !== '' && g.away_score !== undefined && g.home_score !== '' && g.home_score !== undefined;
        const awayWon = hasScore && Number(g.away_score) > Number(g.home_score);
        const homeWon = hasScore && Number(g.home_score) > Number(g.away_score);
        row.innerHTML = `
          <div class="game-time">${g.time_az || ''}</div>
          <div>
            <div class="matchup">${teamLink(g.away_team, awayWon)}${scoreSpan(g.away_score, g.home_score)} @ ${teamLink(g.home_team, homeWon)}${scoreSpan(g.home_score, g.away_score)}</div>
            <div class="venue">${g.venue || ''}</div>
          </div>
          <div class="status ${statusClass(g.status)}">${g.status || ''}</div>
        `;
        section.appendChild(row);
      });

      content.appendChild(section);
    });

    if (Object.keys(groups).length === 0) {
      content.innerHTML = currentTeam
        ? `<p class="error">No games found for ${currentTeam} this season.</p>`
        : '<p class="error">No games found for this season.</p>';
    }
  }

  async function loadSchedule() {
    const content = document.getElementById('content');
    content.innerHTML = '<p class="loading">Loading schedule...</p>';

    try {
      const res = await fetch(`data/${currentSeason}/schedule.csv`);
      if (!res.ok) throw new Error('Schedule not found for this season yet.');
      const text = await res.text();
      allGames = parseCSV(text);
      renderBanner();
      renderGames();
    } catch (err) {
      content.innerHTML = `<p class="error">Couldn't load the schedule: ${err.message}</p>`;
    }
  }

  renderControls();
  loadSchedule();
</script>

</body>
</html>
