    stolenBasePercentage: "Opponents' stolen base success rate", caughtStealingPercentage: "Opponents' caught-stealing rate",
    groundOuts: 'Ground outs induced', airOuts: 'Air outs induced', groundOutsToAirouts: 'Ground-out to air-out ratio',
    strikes: 'Strikes thrown', strikePercentage: 'Percentage of pitches thrown for strikes',
    numberOfPitches: 'Pitches thrown', pitchesPerInning: 'Pitches thrown per inning',
    inheritedRunners: 'Inherited runners', inheritedRunnersScored: 'Inherited runners who scored',
    totalBases: 'Total bases allowed', groundIntoDoublePlay: 'Double plays induced',
    sacBunts: 'Sacrifice bunts allowed', sacFlies: 'Sacrifice flies allowed',
    catchersInterference: "Times reached on catcher's interference",
  };

  // Default fielding column order/labels -- not yet curated by user request
  // (column trimming/reordering is explicitly deferred until the base
  // feature works), so this just covers the common counting + rate stats;
  // anything else MLB returns still gets captured and appended after.
  const FIELDING_STAT_ORDER = ['age', 'games', 'innings', 'putOuts', 'assists', 'errors', 'fielding', 'doublePlays', 'rangeFactorPer9Inn'];
  // Full key order for the glossary -- FIELDING_STAT_ORDER plus the stats
  // that currently just get appended after it (same alphabetical order
  // orderKeys() produces), so the glossary covers everything the table can
  // show, not just the first 9 curated columns.
  const FIELDING_GLOSSARY_ORDER = [...FIELDING_STAT_ORDER, 'chances', 'rangeFactorPerGame', 'throwingErrors', 'triplePlays'];
  const FIELDING_HIDDEN_KEYS = new Set();
  const FIELDING_LABELS = {
    age: 'Age', games: 'G', innings: 'Inn', putOuts: 'PO', assists: 'A', errors: 'E',
    fielding: 'FPCT', doublePlays: 'DP', triplePlays: 'TP', chances: 'TC',
    throwingErrors: 'TE', rangeFactorPerGame: 'RF/G', rangeFactorPer9Inn: 'RF/9',
  };

  // Sums a set of per-position MLB-API season stat blocks (camelCase keys,
  // as returned by fetchLevelFielding) into one combined total -- used for
  // the main Career Path row covering every position played that stint.
  function sumFieldingStints(statBlocks) {
    const totals = { games: 0, putOuts: 0, assists: 0, errors: 0, throwingErrors: 0, doublePlays: 0, triplePlays: 0 };
    let outs = 0;
    statBlocks.forEach(b => {
      totals.games += Number(b.games) || 0;
      totals.putOuts += Number(b.putOuts) || 0;
      totals.assists += Number(b.assists) || 0;
      totals.errors += Number(b.errors) || 0;
      totals.throwingErrors += Number(b.throwingErrors) || 0;
      totals.doublePlays += Number(b.doublePlays) || 0;
      totals.triplePlays += Number(b.triplePlays) || 0;
      outs += ipToOuts(b.innings);
    });
    totals.innings = outsToIp(outs);
    const po = totals.putOuts, a = totals.assists, e = totals.errors;
    totals.chances = po + a + e;
    totals.fielding = totals.chances > 0 ? ((po + a) / totals.chances) : null;
    totals.rangeFactorPer9Inn = outs > 0 ? ((po + a) * 27 / outs) : null;
    totals.rangeFactorPerGame = totals.games > 0 ? ((po + a) / totals.games) : null;
    return totals;
  }

  // Sums a set of raw fielding_gamelogs.csv rows (snake_case keys, one row
  // per game at ONE position) into a total -- used for both a single
  // position's AFL season total and, when passed every row regardless of
  // position, the combined AFL season row across all positions.
  function sumFieldingGames(games) {
    const totals = { games: games.length, putOuts: 0, assists: 0, errors: 0, throwingErrors: 0, doublePlays: 0, triplePlays: 0 };
    let outs = 0;
    games.forEach(g => {
      totals.putOuts += Number(g.putouts) || 0;
      totals.assists += Number(g.assists) || 0;
      totals.errors += Number(g.errors) || 0;
      totals.throwingErrors += Number(g.throwing_errors) || 0;
      totals.doublePlays += Number(g.double_plays) || 0;
      totals.triplePlays += Number(g.triple_plays) || 0;
      outs += ipToOuts(g.innings);
    });
    totals.innings = outsToIp(outs);
    const po = totals.putOuts, a = totals.assists, e = totals.errors;
    totals.chances = po + a + e;
    totals.fielding = totals.chances > 0 ? ((po + a) / totals.chances) : null;
    totals.rangeFactorPer9Inn = outs > 0 ? ((po + a) * 27 / outs) : null;
    totals.rangeFactorPerGame = totals.games > 0 ? ((po + a) / totals.games) : null;
    return totals;
  }

  function groupFieldingByPosition(games) {
    const map = new Map();
    games.forEach(g => {
      const pos = g.position || '';
      if (!map.has(pos)) map.set(pos, []);
      map.get(pos).push(g);
    });
    return map;
  }

  function colLabelFielding(k) {
    return k === 'season' ? 'Season' : k === 'level' ? 'Lvl' : k === 'team' ? 'Team'
      : (FIELDING_LABELS[k] || prettifyKey(k));
  }

  function fmtFieldingCell(k, val) {
    if (k === 'innings') return formatIP(val);
    if (k === 'fielding') return fmtRatePct(val);
    if (k === 'rangeFactorPer9Inn' || k === 'rangeFactorPerGame') return fmtRatio(val);
    return (val !== undefined && val !== null && val !== '') ? val : '-';
  }

  function toggleStatcastGameLog(id, linkEl) {
    const el = document.getElementById(id);
    if (!el) return;
    const open = el.style.display === 'none';
    el.style.display = open ? 'block' : 'none';
    if (linkEl) {
      linkEl.setAttribute('aria-expanded', String(open));
      const arrow = linkEl.querySelector('.stc-arrow');
      if (arrow) arrow.innerHTML = open ? '&#9652;' : '&#9662;';
    }
  }
  function toggleFieldingRow(id) {
    const el = document.getElementById(id);
    if (!el) return;
    el.style.display = (el.style.display !== 'none') ? 'none' : 'block';
  }

  // Builds the Fielding tab's Career Path table: one flat row per season/
  // level/team (combined across every position played that stint), exactly
  // like the Pitching/Hitting tab's rows -- no per-position or per-game
  // expansion here. That detail (and the AFL row's own position/game
  // breakdown, which used to nest 3 levels deep inside this table) now
  // lives in the separate AFL Game Log section's Fielding tab, so every
  // Career Path row behaves the same way regardless of level.
  function buildFieldingTableHtml(rows, allCols, gridTemplate, minWidth) {
    const headerCells = allCols.map(k => `<div>${colLabelFielding(k)}</div>`).join('');
    let html = `<div class="career-table">
      <div class="career-row head" style="grid-template-columns:${gridTemplate}; min-width:${minWidth};">${headerCells}</div>`;

    const styleAttr = `style="grid-template-columns:${gridTemplate}; min-width:${minWidth};"`;

    rows.forEach((r) => {
      const isAfl = r.level === 'AFL';
      const rowClasses = ['career-row', 'body'];
      if (isAfl) rowClasses.push('afl');
      else if (r.level === 'MLB') rowClasses.push('mlb');
      if (r.isPostseason) rowClasses.push('post-season');

      const cells = allCols.map(k => {
        if (k === 'season') return `<div>${r.seasonLabel || r.season || ''}</div>`;
        if (k === 'team' || k === 'level') return `<div>${r[k] || ''}</div>`;
        return `<div>${fmtFieldingCell(k, r[k])}</div>`;
      }).join('');

      html += `<div class="${rowClasses.join(' ')}" ${styleAttr}>${cells}</div>`;
    });

    html += `</div>`;
    return html;
  }

  async function loadFieldingCareerPath(ctx) {
    const container = document.getElementById('career-path-container');
    container.innerHTML = '<p class="loading">Loading fielding...</p>';

    const allSportIds = [...MILB_SPORT_IDS, MLB_SPORT_ID];
    const results = await Promise.all(allSportIds.map(fetchLevelFielding));
    let rows = results.flat();
    rows = rows.filter(r => r.team && r.team.trim() !== '');

    if (ctx.regFieldingByPos.size) {
      const allGames = Array.from(ctx.regFieldingByPos.values()).flat();
      rows.push({ season: String(currentSeason), level: 'AFL', team: ctx.team, age: ctx.playerAge, ...sumFieldingGames(allGames) });
    }
    if (ctx.postFieldingByPos.size) {
      const allGames = Array.from(ctx.postFieldingByPos.values()).flat();
      rows.push({
        season: String(currentSeason), seasonLabel: `${currentSeason} Postseason`, level: 'AFL', team: ctx.team,
        age: ctx.playerAge, isPostseason: true, ...sumFieldingGames(allGames),
      });
    }

    rows.sort((a, b) => {
      if (a.season !== b.season) return a.season < b.season ? -1 : 1;
      const rankA = LEVEL_RANK[a.level] !== undefined ? LEVEL_RANK[a.level] : 99;
      const rankB = LEVEL_RANK[b.level] !== undefined ? LEVEL_RANK[b.level] : 99;
      return rankA - rankB;
    });

    if (rows.length === 0) {
      container.innerHTML = '<p class="section-note">No fielding stats found.</p>';
      return;
    }

    const statKeySet = new Set();
    rows.forEach(r => {
      Object.keys(r).forEach(k => {
        if (!['season', 'level', 'team', 'age', 'positions', 'seasonLabel', 'isPostseason'].includes(k)) statKeySet.add(k);
      });
    });
    FIELDING_HIDDEN_KEYS.forEach(k => statKeySet.delete(k));
    const statKeys = orderKeys(Array.from(statKeySet), FIELDING_STAT_ORDER);
    const allCols = ['season', 'level', 'team', 'age', ...statKeys];

    // Season column needs to be wide enough for "2025 Postseason", not just
    // a bare 4-digit year, or that label truncates to "2025 ..." the way
    // the regular-season row never does.
    const gridTemplate = `minmax(110px, 0.9fr) 0.5fr 1.6fr 0.5fr ${statKeys.map(() => 'minmax(65px, 1fr)').join(' ')}`;
    const minWidth = `${4 * 90 + statKeys.length * 75}px`;

    container.innerHTML = buildFieldingTableHtml(rows, allCols, gridTemplate, minWidth);
  }

  const FIELDING_GLOSSARY = {
    age: 'Age', games: 'Games played at this position', innings: 'Innings played',
    putOuts: 'Putouts', assists: 'Assists', errors: 'Errors',
    fielding: 'Fielding percentage ((putouts + assists) ÷ total chances)',
    doublePlays: 'Double plays taken part in', triplePlays: 'Triple plays taken part in',
    chances: 'Total chances (putouts + assists + errors)', throwingErrors: 'Throwing errors',
    rangeFactorPerGame: 'Range factor per game ((putouts + assists) ÷ games)',
    rangeFactorPer9Inn: 'Range factor per 9 innings ((putouts + assists) × 9 ÷ innings)',
  };

  const SPIN_GLOSSARY_ROW = `<div class="glossary-row"><div class="glossary-abbr">Avg Spin *</div><div class="glossary-desc">Average spin rate (rpm), using only pitches that have spin data. MLB doesn't/can't track every spin at every park, so some games have little or no spin data, and some will be completely tracked. The count under the number shows how many pitches the average is based on; for example, "2 of 35 pitches" means 2 of the 35 pitches had spin data. An asterisk (*) means some pitches in the sample have no spin data. Sample labels: Small Sample Size (under 50% of pitches have spin), Decent Sample Size (50% to 70%), Sufficient Sample Size (over 70%).</div></div>`;
  function glossaryEntriesHtml(order, labels, glossary, hidden) {
    return order
      .filter(k => !hidden.has(k))
      .map(k => `<div class="glossary-row"><div class="glossary-abbr">${labels[k] || k}</div><div class="glossary-desc">${glossary[k] || ''}</div></div>`)
      .join('');
  }

  const STATCAST_PITCHING_GLOSSARY = [
    ['Game Statcast tiles', [
      ['Avg / Max Velo', 'Average and fastest release speed.'],
      ['Avg Spin', 'Average spin rate in rpm.'],
      ['Whiffs', 'Swings that missed.'],
      ['Hard-Hit', 'Balls in play hit 95+ mph.']]],
    ['Strikes & discipline', [
      ['Strike %', 'Share of pitches that were strikes.'],
      ['Zone %', 'Share of pitches thrown in the strike zone.'],
      ['Chase %', 'Share of out-of-zone pitches the batter swung at.'],
      ['CSW %', 'Called strikes plus whiffs, as a share of all pitches.'],
      ['Whiff %', 'Share of swings that missed.'],
      ['1st-Pitch Strike', 'Share of first pitches that were strikes.']]],
    ['Contact allowed', [
      ['Avg / Max Exit Velo', 'How hard balls were hit off the bat.'],
      ['Barrel %', "Share of balls in play with an ideal exit velocity and launch angle, per MLB's barrel definition."],
      ['Ground Ball / Line Drive / Fly Ball / Popup', 'Share of balls in play by trajectory.']]],
    ['Velocity', [
      ['Velo Loss', 'Average speed lost from release to the plate.']]],
    ['Innings', [
      ['Inning Pitched', "On this page innings are counted by how far into the outing the pitcher is (1st, 2nd, ...), not by the game's inning number. The 1st inning pitched is the first inning he threw in."]]],
    ['Counts', [
      ['Ahead', 'More strikes than balls.'],
      ['Even', 'Balls equal strikes (1-1, 2-2).'],
      ['Behind', 'More balls than strikes, except 3-2.'],
      ['Full Count', '3 balls and 2 strikes.'],
      ['Two Strikes', 'Any count with two strikes, including 3-2.']]],
    ['Pitch characteristics', [
      ['Induced Vertical Break', 'Vertical movement beyond what gravity alone would cause.'],
      ['Horizontal Break', 'Sideways movement of the pitch.'],
      ['Release Point', "Where the ball leaves the pitcher's hand."],
      ['Extension', 'How far toward the plate the pitcher releases the ball.'],
      ['Spin Direction', 'The axis the ball spins on, shown like a clock face.'],
      ['Exit Velocity / Launch Angle', 'Speed and vertical angle of a batted ball off the bat.']]],
  ];
  function statcastGlossaryHtml() {
    return STATCAST_PITCHING_GLOSSARY.map(([group, items]) =>
      `<div class="glossary-subtitle">${group}</div>` + items.map(([n, d]) => `<div class="glossary-row wide"><div class="glossary-abbr">${n}</div><div class="glossary-desc">${d}</div></div>`).join('')
    ).join('');
  }
  function renderStatGlossary() {
    const hittingHtml = glossaryEntriesHtml(HITTING_STAT_ORDER, HITTING_LABELS, HITTING_GLOSSARY, HITTING_HIDDEN_KEYS);
    const pitchingHtml = glossaryEntriesHtml(PITCHING_STAT_ORDER, PITCHING_LABELS, PITCHING_GLOSSARY, PITCHING_HIDDEN_KEYS);
    const fieldingHtml = glossaryEntriesHtml(FIELDING_GLOSSARY_ORDER, FIELDING_LABELS, FIELDING_GLOSSARY, FIELDING_HIDDEN_KEYS);
    return `
      <details class="stat-glossary">
        <summary>Stat Glossary</summary>
        <div class="glossary-columns">
          <div class="glossary-col">
            <div class="glossary-col-title">Hitting</div>
            ${hittingHtml}
          </div>
          <div class="glossary-col">
            <div class="glossary-col-title">Pitching</div>
            ${pitchingHtml}
            ${SPIN_GLOSSARY_ROW}
            <div class="glossary-col-title" style="margin-top:1rem;">Pitching Statcast</div>
            ${statcastGlossaryHtml()}
          </div>
          <div class="glossary-col">
            <div class="glossary-col-title">Fielding</div>
            ${fieldingHtml}
          </div>
        </div>
      </details>
    `;
  }

  function orderKeys(keysPresent, preferredOrder) {
    const present = new Set(keysPresent);
    const ordered = preferredOrder.filter(k => present.has(k));
    const rest = keysPresent.filter(k => !preferredOrder.includes(k)).sort();
    return [...ordered, ...rest];
  }

  // Opponent names come through as full team names (e.g. "Scottsdale
  // Scorpions"), sometimes with a trailing game/doubleheader number MLB
  // appends to the opponent field (e.g. "Scottsdale Scorpions 2") -- the
  // per-game log just needs the city for a compact column.
  const TEAM_CITY = {
    'Peoria Javelinas': 'Peoria',
    'Mesa Solar Sox': 'Mesa',
    'Scottsdale Scorpions': 'Scottsdale',
    'Salt River Rafters': 'Salt River',
    'Surprise Saguaros': 'Surprise',
    'Glendale Desert Dogs': 'Glendale',
  };
  function cityFromOpponent(raw) {
    const cleaned = (raw || '').replace(/\s+\d+\s*$/, '').trim();
    return TEAM_CITY[cleaned] || cleaned;
  }

  // The per-game log's hitting columns use hitting_gamelogs.csv's snake_case
  // field names, but the season-total AFL row (built from the same "capture
  // everything" totals used for the Career Path table) uses MLB's own
  // camelCase field names -- this maps one to the other for the totals row.
  const HITTING_COL_TO_TOTALS_KEY = {
    at_bats: 'atBats', runs: 'runs', hits: 'hits', rbi: 'rbi', doubles: 'doubles', triples: 'triples',
    home_runs: 'homeRuns', walks: 'baseOnBalls', intentional_walks: 'intentionalWalks',
    strikeouts: 'strikeOuts', stolen_bases: 'stolenBases', avg: 'avg', obp: 'obp', slg: 'slg', ops: 'ops',
    plate_appearances: 'plateAppearances', caught_stealing: 'caughtStealing', babip: 'babip',
    total_bases: 'totalBases', hit_by_pitch: 'hitByPitch', left_on_base: 'leftOnBase',
    ground_outs: 'groundOuts', ground_into_double_play: 'groundIntoDoublePlay', air_outs: 'airOuts',
    sac_bunts: 'sacBunts', sac_flies: 'sacFlies', number_of_pitches: 'numberOfPitches',
    catchers_interference: 'catchersInterference',
  };
  // Reverse of HITTING_COL_TO_TOTALS_KEY (camelCase stat name -> raw
  // hitting_gamelogs.csv column) -- lets the per-game log's hitting columns
  // be read straight off HITTING_STAT_ORDER, the same order used for the
  // Career Path table, instead of keeping a second, separately-ordered list.
  const HITTING_CAMEL_TO_COL = Object.fromEntries(
    Object.entries(HITTING_COL_TO_TOTALS_KEY).map(([raw, camel]) => [camel, raw])
  );
  // 3-decimal, leading-zero-stripped rate fields (".385" style, like AVG) vs.
  // 2-decimal ratio fields ("3.00" style, like ERA) -- matches the exact
  // formatting pitching_gamelogs.csv's own pre-formatted strings already use,
  // so our self-computed postseason cumulative totals (sumPitchingGames)
  // render identically to the regular-season rows read straight off the CSV.
  const PITCHING_RATE3_FIELDS = new Set(['avg', 'obp', 'slg', 'ops', 'winPercentage', 'stolenBasePercentage', 'strikePercentage']);
  const PITCHING_RATIO2_FIELDS = new Set([
    'strikeoutWalkRatio', 'hitsPer9Inn', 'homeRunsPer9', 'walksPer9Inn', 'strikeoutsPer9Inn',
    'runsScoredPer9', 'pitchesPerInning', 'groundOutsToAirouts',
  ]);

  // Raw MLB gameType codes. "R" = regular season; the AFL's postseason round
  // is one of these three (First Round / Semifinal / Championship). "A" (the
  // Fall Stars exhibition game) is excluded from both buckets entirely.
  const POSTSEASON_GAME_TYPES = new Set(['D', 'L', 'W']);
  function isPostseasonRow(r) { return POSTSEASON_GAME_TYPES.has(r.game_type); }

  function ipToOuts(ip) {
    if (!ip) return 0;
    const [whole, frac] = String(ip).split('.');
    return (whole ? parseInt(whole, 10) * 3 : 0) + (frac ? parseInt(frac, 10) : 0);
  }
  function outsToIp(outs) {
    return `${Math.floor(outs / 3)}.${outs % 3}`;
  }

  // MLB's innings-pitched notation ("5.1", "5.2") uses the digit after the
  // decimal to mean thirds of an inning, not tenths -- display that as a
  // proper fraction glyph (U+2153/U+2154) instead, which every modern font
  // already renders compact: "5.1" -> "5⅓", "5.2" -> "5⅔", "6.0" -> "6".
  function formatIP(ip) {
    if (ip === undefined || ip === null || ip === '') return '-';
    const str = String(ip);
    const dot = str.indexOf('.');
    if (dot === -1) return str;
    const whole = str.slice(0, dot) || '0';
    const fracDigit = str.slice(dot + 1);
    const fracGlyph = fracDigit === '1' ? '⅓' : fracDigit === '2' ? '⅔' : '';
    return fracGlyph ? `${whole}${fracGlyph}` : whole;
  }

  // Season totals for a set of pitching_gamelogs.csv rows -- mirrors
  // sumHittingGames's approach. IP/H/R/ER/BB/K/pitches are always single-game
  // counting stats (safe to sum regardless of season vs. postseason); wins/
  // losses/saves on each row are MLB's own cumulative-within-that-gameType
  // count, which for the AFL's single-elimination postseason (at most one
  // game per round) equals whether THAT game itself was the decision, so
  // summing them across postseason rows gives the right postseason total.
  // Counting fields summed directly across games (everything pitching_
  // gamelogs.csv carries except the handful of rate/ratio stats, which are
  // instead recomputed below from these sums -- same "capture everything"
  // approach sumHittingGames already takes, so the per-game log's newer,
  // fuller column set has real postseason totals instead of blanks).
  const PITCHING_COUNTING_FIELDS = [
    'wins', 'losses', 'saves', 'blownSaves', 'holds', 'completeGames', 'shutouts', 'gamesStarted',
    'hits', 'runs', 'earnedRuns', 'homeRuns', 'doubles', 'triples', 'atBats',
    'baseOnBalls', 'intentionalWalks', 'strikeOuts', 'hitByPitch',
    'wildPitches', 'balks', 'pickoffs',
    'groundOuts', 'airOuts', 'strikes', 'numberOfPitches', 'battersFaced',
    'totalBases', 'groundIntoDoublePlay', 'sacBunts', 'sacFlies', 'catchersInterference',
    'stolenBases', 'caughtStealing', 'inheritedRunners', 'inheritedRunnersScored',
  ];
  function sumPitchingGames(games) {
    const totals = { games: games.length, outs: 0 };
    PITCHING_COUNTING_FIELDS.forEach(f => { totals[f] = 0; });
    games.forEach(g => {
      PITCHING_COUNTING_FIELDS.forEach(f => { totals[f] += Number(g[f]) || 0; });
      totals.outs += ipToOuts(g.inningsPitched);
    });
    totals.inningsPitched = outsToIp(totals.outs);
    totals.era = totals.outs > 0 ? (totals.earnedRuns * 27 / totals.outs) : null;
    totals.whip = totals.outs > 0 ? ((totals.hits + totals.baseOnBalls) * 3 / totals.outs) : null;
    totals.avg = totals.atBats > 0 ? (totals.hits / totals.atBats) : null;
    const obpDenom = totals.atBats + totals.baseOnBalls + totals.hitByPitch + totals.sacFlies;
    totals.obp = obpDenom > 0 ? ((totals.hits + totals.baseOnBalls + totals.hitByPitch) / obpDenom) : null;
    totals.slg = totals.atBats > 0 ? (totals.totalBases / totals.atBats) : null;
    totals.ops = (totals.obp !== null && totals.slg !== null) ? (totals.obp + totals.slg) : null;
    totals.winPercentage = (totals.wins + totals.losses) > 0 ? (totals.wins / (totals.wins + totals.losses)) : null;
    const sbAttempts = totals.stolenBases + totals.caughtStealing;
    totals.stolenBasePercentage = sbAttempts > 0 ? (totals.stolenBases / sbAttempts) : null;
    totals.groundOutsToAirouts = totals.airOuts > 0 ? (totals.groundOuts / totals.airOuts) : null;
    totals.strikePercentage = totals.numberOfPitches > 0 ? (totals.strikes / totals.numberOfPitches) : null;
    totals.strikeoutWalkRatio = totals.baseOnBalls > 0 ? (totals.strikeOuts / totals.baseOnBalls) : null;
    totals.hitsPer9Inn = totals.outs > 0 ? (totals.hits * 27 / totals.outs) : null;
    totals.homeRunsPer9 = totals.outs > 0 ? (totals.homeRuns * 27 / totals.outs) : null;
    totals.walksPer9Inn = totals.outs > 0 ? (totals.baseOnBalls * 27 / totals.outs) : null;
    totals.strikeoutsPer9Inn = totals.outs > 0 ? (totals.strikeOuts * 27 / totals.outs) : null;
    totals.runsScoredPer9 = totals.outs > 0 ? (totals.runs * 27 / totals.outs) : null;
    totals.pitchesPerInning = totals.outs > 0 ? (totals.numberOfPitches / (totals.outs / 3)) : null;
    return totals;
  }

  // For the postseason segment of the per-game log, MLB's own avg/obp/slg/ops
  // (hitting) and era/whip/wins/losses (pitching) fields reset independently
  // at the start of each round (First Round vs. Semifinal vs. Championship),
  // so they can't be read off the row directly the way regular-season rows
  // can. Recompute our own running cumulative through each successive
  // postseason game instead, chaining across rounds.
  function withRunningHittingCumulative(sortedRows) {
    return sortedRows.map((row, i) => {
      const t = sumHittingGames(sortedRows.slice(0, i + 1));
      return { ...row, avg: fmtRatePct(t.avg), obp: fmtRatePct(t.obp), slg: fmtRatePct(t.slg), ops: fmtRatePct(t.ops) };
    });
  }
  function withRunningPitchingCumulative(sortedRows) {
    return sortedRows.map((row, i) => {
      const t = sumPitchingGames(sortedRows.slice(0, i + 1));
      return { ...row, wins: t.wins, losses: t.losses, saves: t.saves, era: fmtRatio(t.era), whip: fmtRatio(t.whip) };
    });
  }

  // Pitching/Hitting table for the AFL Game Log section's primary tab --
  // same .career-table/.career-row markup as Career Path itself (same card
  // width, same scroll-inside-the-card behavior, same row styling).
  // Regular-season rows and their "<season> Season Total" row use MLB's
  // own cumulative season totals (regTotalsRow, same object the Career
  // Path AFL row uses); any postseason rows are chained with our own
  // running cumulative (postseason totals reset per round in MLB's API)
  // and get their own "<season> Postseason Total" row. Returns just the
  // table markup (no title/tabs -- renderAflGameLogSection wraps it).
  function buildAflGameLogTable(aflGameLogRows, statType, regTotalsRow) {
    if (!Array.isArray(aflGameLogRows) || aflGameLogRows.length === 0) return '';

    const sortedReg = aflGameLogRows.filter(g => !isPostseasonRow(g))
      .slice().sort((a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : 0));
    const sortedPost = aflGameLogRows.filter(g => isPostseasonRow(g))
      .slice().sort((a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : 0));
    if (sortedReg.length === 0 && sortedPost.length === 0) return '';

    const displayPost = statType === 'pitching'
      ? withRunningPitchingCumulative(sortedPost)
      : withRunningHittingCumulative(sortedPost);
    const postTotals = sortedPost.length
      ? (statType === 'pitching' ? sumPitchingGames(sortedPost) : sumHittingGames(sortedPost))
      : null;

    // Columns follow PITCHING_STAT_ORDER/HITTING_STAT_ORDER exactly -- the
    // same order the Career Path table above uses. 'age' isn't a per-game
    // stat (skipped); hitting stats with no per-game raw column
    // (gamesPlayed, stolenBasePercentage, groundOutsToAirouts,
    // atBatsPerHomeRun) are skipped too via the HITTING_CAMEL_TO_COL lookup.
    const pitchingStatKeys = PITCHING_STAT_ORDER.filter(k => k !== 'age');
    const hittingStatKeys = HITTING_STAT_ORDER.filter(k => HITTING_CAMEL_TO_COL[k]);
    const statKeys = statType === 'pitching' ? pitchingStatKeys : hittingStatKeys;
    const cols = statType === 'pitching' ? statKeys : statKeys.map(k => HITTING_CAMEL_TO_COL[k]);
    const labelMap = statType === 'pitching' ? PITCHING_LABELS : HITTING_LABELS;
    const labels = statKeys.map(k => labelMap[k] || k);

    // Same column-sizing convention the Career Path table above uses
    // (minmax(75px, 1fr) per stat column) -- same card chrome, same
    // horizontal scroll-inside-the-card behavior as that table. Date gets
    // an explicit floor wide enough for the full "2025-10-18" (a plain fr
    // share could get squeezed below that by the many stat columns and
    // truncate to "2025-1…" with no way to read the rest).
    const gridTemplate = `minmax(98px, 0.9fr) minmax(110px, 1.4fr) ${cols.map(() => 'minmax(75px, 1fr)').join(' ')}`;
    const minWidth = `${(98 + 110) + cols.length * 85}px`;
    const rowStyle = `style="grid-template-columns:${gridTemplate}; min-width:${minWidth};"`;

    const headerCells = `<div>Date</div><div>Opp</div>${labels.map(l => `<div>${l}</div>`).join('')}`;

    const dataRow = (r, rowClass) => {
      const cells = cols.map(c => {
        if (c === 'inningsPitched') return `<div>${formatIP(r[c])}</div>`;
        const v = r[c];
        return `<div>${v !== undefined && v !== null && v !== '' ? v : '-'}</div>`;
      }).join('');
      return `<div class="${rowClass}" ${rowStyle}><div>${r.date || ''}</div><div>${cityFromOpponent(r.opponent)}</div>${cells}</div>`;
    };

    let html = `
      <div class="career-table">
        <div class="career-row head" ${rowStyle}>${headerCells}</div>
    `;

    html += sortedReg.map(r => dataRow(r, 'career-row body')).join('');

    const season = (regTotalsRow && regTotalsRow.season)
      || (sortedReg[0] && sortedReg[0].season) || (sortedPost[0] && sortedPost[0].season) || '';

    if (regTotalsRow && sortedReg.length) {
      const statCells = cols.map(c => {
        const key = statType === 'pitching' ? c : (HITTING_COL_TO_TOTALS_KEY[c] || c);
        if (c === 'inningsPitched') return `<div>${formatIP(regTotalsRow[key])}</div>`;
        const v = regTotalsRow[key];
        return `<div>${v !== undefined && v !== null && v !== '' ? v : '-'}</div>`;
      }).join('');
      html += `<div class="career-row body afl" ${rowStyle}><div class="col-span-2">${season} Season Total</div>${statCells}</div>`;
    }

    html += displayPost.map(r => dataRow(r, 'career-row body post-season')).join('');

    if (postTotals) {
      // postTotals (from sumHittingGames/sumPitchingGames) already uses the
      // same field names as the per-game columns themselves (snake_case for
      // hitting, camelCase for pitching) -- unlike regTotalsRow, which comes
      // from the season-totals object shaped like MLB's own camelCase API
      // response and needs HITTING_COL_TO_TOTALS_KEY to translate. era/whip
      // need their own fmtRatio pass too, same as regTotalsRow already gets
      // from pitcher_stats.csv's pre-formatted strings -- otherwise a 0 ERA
      // prints as the bare number "0" instead of "0.00".
      const statCells = cols.map(c => {
        if (c === 'inningsPitched') return `<div>${formatIP(postTotals[c])}</div>`;
        if (statType === 'pitching') {
          if (c === 'era' || c === 'whip' || PITCHING_RATIO2_FIELDS.has(c)) return `<div>${fmtRatio(postTotals[c])}</div>`;
          // fmtRatePct (not fmtRate) so a zero-denominator rate shows the
          // same ".---" the regular-season rows already use (pre-formatted
          // that way straight from pitching_gamelogs.csv), instead of a
          // bare "-" that reads as a different, inconsistent placeholder.
          if (PITCHING_RATE3_FIELDS.has(c)) return `<div>${fmtRatePct(postTotals[c])}</div>`;
          const v = postTotals[c];
          return `<div>${v !== undefined && v !== null && v !== '' ? v : '-'}</div>`;
        }
        const isRate = c === 'avg' || c === 'obp' || c === 'slg' || c === 'ops' || c === 'babip';
        if (isRate) return `<div>${fmtRatePct(postTotals[c])}</div>`;
        const v = postTotals[c];
        return `<div>${v !== undefined && v !== null && v !== '' ? v : '-'}</div>`;
      }).join('');
      html += `<div class="career-row body mlb" ${rowStyle}><div class="col-span-2">${season} Postseason Total</div>${statCells}</div>`;
    }

    html += `</div>`;

    return html;
  }

  // Per-position AFL fielding game log for the AFL Game Log section's
  // Fielding tab -- moved here from the Career Path Fielding tab's old
  // AFL row/position toggle so the Fielding view is consistent with the
  // Pitching/Hitting view (a plain career-table of per-game rows ending in
  // a highlighted total row), not a separately-styled nested panel.
  // Fielding totals are tracked per position, so each position played gets
  // its own table -- regular-season games, a "<season> Season Total" row,
  // then any postseason games for that position and a "<season> Postseason
  // Total" row, same reg/post layout the Pitching/Hitting table uses.
  function buildAflFieldingGameLogHtml(regFieldingByPos, postFieldingByPos) {
    const hasReg = regFieldingByPos && regFieldingByPos.size > 0;
    const hasPost = postFieldingByPos && postFieldingByPos.size > 0;
    if (!hasReg && !hasPost) return '';

    const statKeys = FIELDING_GLOSSARY_ORDER.filter(k => k !== 'age');
    const labels = statKeys.map(k => FIELDING_LABELS[k] || k);
    // Date gets an explicit floor (see buildAflGameLogTable) so it never
    // truncates to "2025-1…".
    const gridTemplate = `minmax(98px, 0.9fr) minmax(110px, 1.4fr) ${statKeys.map(() => 'minmax(65px, 1fr)').join(' ')}`;
    const minWidth = `${(98 + 110) + statKeys.length * 75}px`;
    const rowStyle = `style="grid-template-columns:${gridTemplate}; min-width:${minWidth};"`;
    const headerCells = `<div>Date</div><div>Opp</div>${labels.map(l => `<div>${l}</div>`).join('')}`;

    const dataRow = (g, rowClass) => {
      const totals = sumFieldingGames([g]);
      const cells = statKeys.map(k => `<div>${fmtFieldingCell(k, totals[k])}</div>`).join('');
      return `<div class="${rowClass}" ${rowStyle}><div>${g.date || ''}</div><div>${cityFromOpponent(g.opponent)}</div>${cells}</div>`;
    };

    // Union of every position played, regular season or postseason, in the
    // order first encountered -- a position fielded only in the postseason
    // still gets its own table.
    const positions = [];
    (hasReg ? Array.from(regFieldingByPos.keys()) : []).forEach(p => { if (!positions.includes(p)) positions.push(p); });
    (hasPost ? Array.from(postFieldingByPos.keys()) : []).forEach(p => { if (!positions.includes(p)) positions.push(p); });

    const firstGame = positions.length
      ? ((hasReg && regFieldingByPos.get(positions[0]) && regFieldingByPos.get(positions[0])[0])
        || (hasPost && postFieldingByPos.get(positions[0]) && postFieldingByPos.get(positions[0])[0]))
      : null;
    const season = (firstGame && firstGame.season) || String(currentSeason);

    let html = '';
    positions.forEach(pos => {
      const sortedReg = ((hasReg && regFieldingByPos.get(pos)) || []).slice().sort((a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : 0));
      const sortedPost = ((hasPost && postFieldingByPos.get(pos)) || []).slice().sort((a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : 0));

      if (positions.length > 1) {
        html += `<div class="section-note" style="font-weight:700; color:var(--text); margin:0.8rem 0 0.4rem; font-size:0.85rem;">${pos}</div>`;
      }

      html += `<div class="career-table"><div class="career-row head" ${rowStyle}>${headerCells}</div>`;
      html += sortedReg.map(g => dataRow(g, 'career-row body')).join('');
      if (sortedReg.length) {
        const totals = sumFieldingGames(sortedReg);
        const statCells = statKeys.map(k => `<div>${fmtFieldingCell(k, totals[k])}</div>`).join('');
        html += `<div class="career-row body afl" ${rowStyle}><div class="col-span-2">${season} Season Total</div>${statCells}</div>`;
      }
      html += sortedPost.map(g => dataRow(g, 'career-row body post-season')).join('');
      if (sortedPost.length) {
        const totals = sumFieldingGames(sortedPost);
        const statCells = statKeys.map(k => `<div>${fmtFieldingCell(k, totals[k])}</div>`).join('');
        html += `<div class="career-row body mlb" ${rowStyle}><div class="col-span-2">${season} Postseason Total</div>${statCells}</div>`;
      }
      html += `</div>`;
    });

    return html;
  }

  // Assembles the full "AFL Game Log" section: title, the Pitching/Hitting
  // + Fielding tab row (same tab-row markup Career Path uses), and both
  // views pre-rendered up front (switching is a pure show/hide -- unlike
  // Career Path's tabs, nothing here needs a fresh fetch).
  function renderAflGameLogSection(aflGameLogRows, statType, regTotalsRow, regFieldingByPos, postFieldingByPos, isPitcher) {
    const primaryTableHtml = buildAflGameLogTable(aflGameLogRows, statType, regTotalsRow);
    const fieldingTableHtml = buildAflFieldingGameLogHtml(regFieldingByPos, postFieldingByPos);
    if (!primaryTableHtml && !fieldingTableHtml) return '';

    const season = (regTotalsRow && regTotalsRow.season) || String(currentSeason);

    return `
      <div class="section-title">${season} AFL Game Log</div>
      <div class="tab-row">
        <button class="stat-tab active" id="tab-btn-afl-primary" onclick="switchAflGameLogTab('primary')">${isPitcher ? 'Pitching' : 'Hitting'}</button>
        <button class="stat-tab" id="tab-btn-afl-fielding" onclick="switchAflGameLogTab('fielding')">Fielding</button>
      </div>
      <div id="afl-gamelog-primary-view">${primaryTableHtml || '<p class="section-note">No game log available.</p>'}</div>
      <div id="afl-gamelog-fielding-view" style="display:none;">${fieldingTableHtml || '<p class="section-note">No fielding game log available.</p>'}</div>
    `;
  }

  function switchAflGameLogTab(view) {
    const primaryBtn = document.getElementById('tab-btn-afl-primary');
    const fieldingBtn = document.getElementById('tab-btn-afl-fielding');
    const primaryView = document.getElementById('afl-gamelog-primary-view');
    const fieldingView = document.getElementById('afl-gamelog-fielding-view');
    if (primaryBtn) primaryBtn.classList.toggle('active', view === 'primary');
    if (fieldingBtn) fieldingBtn.classList.toggle('active', view === 'fielding');
    if (primaryView) primaryView.style.display = view === 'primary' ? '' : 'none';
    if (fieldingView) fieldingView.style.display = view === 'fielding' ? '' : 'none';
  }

  async function loadCareerPath(aflRow, statType, aflGameLogRows) {
    const container = document.getElementById('career-path-container');
    container.innerHTML = '<p class="loading">Loading career path...</p>';

    const allSportIds = [...MILB_SPORT_IDS, MLB_SPORT_ID];
    const fetchFn = statType === 'pitching' ? fetchLevelPitching : fetchLevelHitting;
    const results = await Promise.all(allSportIds.map(fetchFn));
    let rows = results.flat();

    // MLB's own API bundles in a same-level "combined" row (blank team name)
    // whenever a player changed affiliates at the same level in one year --
    // we only want the real, individual affiliate rows.
    rows = rows.filter(r => r.team && r.team.trim() !== '');

    if (aflRow) rows.push(aflRow);

    rows.sort((a, b) => {
      if (a.season !== b.season) return a.season < b.season ? -1 : 1;
      const rankA = LEVEL_RANK[a.level] !== undefined ? LEVEL_RANK[a.level] : 99;
      const rankB = LEVEL_RANK[b.level] !== undefined ? LEVEL_RANK[b.level] : 99;
      return rankA - rankB;
    });

    if (rows.length === 0) {
      container.innerHTML = '<p class="error">No career stats found.</p>';
      return;
    }

    // Capture every field that shows up on ANY row -- same "don't hand-pick
    // fields, capture everything" approach used for pitcher_stats.csv --
    // so a stat that only exists at one level (or only in our AFL data)
    // still gets its own column.
    const statKeySet = new Set();
    rows.forEach(r => {
      Object.keys(r).forEach(k => { if (!PINNED_COLS.includes(k)) statKeySet.add(k); });
    });
    // MLB's pitching stat block includes both gamesPlayed and gamesPitched
    // (same value) -- for a pitcher, B-R's single "G" column means games
    // pitched, so drop the redundant duplicate rather than show it twice.
    if (statType === 'pitching') statKeySet.delete('gamesPlayed');
    const hiddenKeys = statType === 'pitching' ? PITCHING_HIDDEN_KEYS : HITTING_HIDDEN_KEYS;
    hiddenKeys.forEach(k => statKeySet.delete(k));
    const preferredOrder = statType === 'pitching' ? PITCHING_STAT_ORDER : HITTING_STAT_ORDER;
    const statKeys = orderKeys(Array.from(statKeySet), preferredOrder);
    const allCols = [...PINNED_COLS, ...statKeys];

    const gridTemplate = `0.6fr 0.55fr 1.6fr ${statKeys.map(() => 'minmax(75px, 1fr)').join(' ')}`;
    const minWidth = `${3 * 90 + statKeys.length * 85}px`;

    const labelMap = statType === 'pitching' ? PITCHING_LABELS : HITTING_LABELS;
    const colLabel = (k) => k === 'season' ? 'Season' : k === 'level' ? 'Lvl' : k === 'team' ? 'Team'
      : (labelMap[k] || prettifyKey(k));
    const headerCells = allCols.map(k => `<div>${colLabel(k)}</div>`).join('');

    let html = `
      <div class="career-table">
        <div class="career-row head" style="grid-template-columns:${gridTemplate}; min-width:${minWidth};">${headerCells}</div>
    `;
    rows.forEach(r => {
      const isAfl = r.level === 'AFL';
      const rowClass = isAfl ? 'career-row body afl' : r.level === 'MLB' ? 'career-row body mlb' : 'career-row body';
      const cells = allCols.map((k) => {
        const val = r[k] !== undefined && r[k] !== null ? r[k] : '';
        if (k === 'inningsPitched') return `<div>${formatIP(val)}</div>`;
        return `<div>${val}</div>`;
      }).join('');
      const rowStyleAttr = `style="grid-template-columns:${gridTemplate}; min-width:${minWidth};"`;
      html += `<div class="${rowClass}" ${rowStyleAttr}>${cells}</div>`;
    });
    html += `</div>`;
    container.innerHTML = html;
  }

  async function loadPlayerPage() {
    const content = document.getElementById('content');
    content.innerHTML = '<p class="loading">Loading player...</p>';

    if (!playerId) {
      content.innerHTML = '<p class="error">No player specified.</p>';
      return;
    }

    try {
      const [rosterRes, hittingRes, pitcherStatsRes, pitchingGameLogsRes, fieldingGameLogsRes, pitchesRes, scheduleRes, txnRes] = await Promise.all([
        fetch(`data/${currentSeason}/roster.csv`),
        fetch(`data/${currentSeason}/hitting_gamelogs.csv`),
        fetch(`data/${currentSeason}/pitcher_stats.csv`),
        fetch(`data/${currentSeason}/pitching_gamelogs.csv`),
        fetch(`data/${currentSeason}/fielding_gamelogs.csv`),
        fetch(`data/${currentSeason}/pitches.csv`),
        fetch(`data/${currentSeason}/schedule.csv`),
        fetch(`data/${currentSeason}/transactions.csv`),
      ]);

      const roster = rosterRes.ok ? parseCSV(await rosterRes.text()) : [];
      const hitting = hittingRes.ok ? parseCSV(await hittingRes.text()) : [];
      const pitcherStats = pitcherStatsRes.ok ? parseCSV(await pitcherStatsRes.text()) : [];
      const pitchingGameLogs = pitchingGameLogsRes.ok ? parseCSV(await pitchingGameLogsRes.text()) : [];
      const fieldingGameLogs = fieldingGameLogsRes.ok ? parseCSV(await fieldingGameLogsRes.text()) : [];
      const pitches = pitchesRes.ok ? parseCSV(await pitchesRes.text()) : [];
      const schedule = scheduleRes.ok ? parseCSV(await scheduleRes.text()) : [];
      const transactions = txnRes.ok ? parseCSV(await txnRes.text()) : [];

      top100ById = {};
      const t100Years = [];
      for (let y = 2023; y <= Math.max(...SEASONS); y++) t100Years.push(y);
      const t100Texts = await Promise.all(t100Years.map(y => fetch(`data/${y}/top100.csv`).then(r => (r.ok ? r.text() : null)).catch(() => null)));
      t100Years.forEach((y, i) => {
        if (!t100Texts[i]) return;
        parseCSV(t100Texts[i]).forEach(r => { const e = top100Entry(r); if (e) (top100ById[r.player_id] = top100ById[r.player_id] || {})[y] = e; });
      });

      const player = roster.find(p => p.player_id === playerId);
      if (!player) {
        if (lastKnownTeam) {
          window.location.href = `roster.html?season=${currentSeason}&team=${encodeURIComponent(lastKnownTeam)}`;
          return;
        }
        content.innerHTML = '<p class="error">Player not found for this season.</p>';
        return;
      }
      lastKnownTeam = player.team;

      const isPitcher = player.position_code === PITCHER_POSITION_CODE;

      const playerTransactions = transactions
        .filter(t => t.player_id === playerId)
        .map(t => ({ date: t.date, description: t.description, type_desc: t.type_desc, tag: 'AFL' }))
        .sort((a, b) => (a.date < b.date ? 1 : -1));

      let html = renderBio(player);
      let aflRow = null;
      let statType = 'hitting';
      let aflGameLogRows = [];

      if (isPitcher) {
        statType = 'pitching';
        const pStats = pitcherStats.find(p => p.pitcher_id === playerId);
        aflGameLogRows = pitchingGameLogs.filter(g => g.pitcher_id === playerId);
        if (pStats) {
          html += renderAflSeasonCardPitching(player.team, pStats);
          // pitcher_stats.csv already captures every field MLB gives us
          // (dynamically) -- carry all of it through onto the AFL row.
          aflRow = { season: String(currentSeason), level: 'AFL', team: player.team };
          Object.keys(pStats).forEach(k => {
            if (k === 'pitcher_id' || k === 'pitcher_name') return;
            aflRow[k] = pStats[k];
          });
        }
      } else {
        const playerHitting = hitting.filter(g => g.player_id === playerId);
        aflGameLogRows = playerHitting;
        // Season card + Career Path AFL row stay regular-season-only, now that
        // hitting_gamelogs.csv also includes postseason rows (see gameType fix).
        const regSeasonHitting = playerHitting.filter(g => !isPostseasonRow(g));
        const hasHitting = regSeasonHitting.length > 0;
        if (hasHitting) {
          const totals = sumHittingGames(regSeasonHitting);
          html += renderAflSeasonCard(player.team, totals);
          // Every field we sum from hitting_gamelogs.csv, carried through
          // with the same field names MLB's own API uses, so it lines up
          // in the same columns as the MiLB/MLB rows above.
          aflRow = {
            season: String(currentSeason), level: 'AFL', team: player.team,
            age: player.age || '',
            gamesPlayed: totals.games, plateAppearances: totals.plate_appearances,
            atBats: totals.at_bats, hits: totals.hits, doubles: totals.doubles, triples: totals.triples,
            homeRuns: totals.home_runs, runs: totals.runs, rbi: totals.rbi,
            baseOnBalls: totals.walks, intentionalWalks: totals.intentional_walks,
            strikeOuts: totals.strikeouts, hitByPitch: totals.hit_by_pitch,
            stolenBases: totals.stolen_bases, caughtStealing: totals.caught_stealing,
            stolenBasePercentage: fmtRatePct(totals.stolen_base_pct),
            caughtStealingPercentage: fmtRatePct(totals.caught_stealing_pct),
            totalBases: totals.total_bases, sacFlies: totals.sac_flies, sacBunts: totals.sac_bunts,
            groundOuts: totals.ground_outs, airOuts: totals.air_outs,
            groundOutsToAirouts: fmtRatio(totals.ground_outs_to_airouts),
            atBatsPerHomeRun: fmtRatio(totals.at_bats_per_home_run),
            groundIntoDoublePlay: totals.ground_into_double_play,
            leftOnBase: totals.left_on_base, catchersInterference: totals.catchers_interference,
            numberOfPitches: totals.number_of_pitches,
            avg: fmtRatePct(totals.avg), obp: fmtRatePct(totals.obp), slg: fmtRatePct(totals.slg), ops: fmtRatePct(totals.ops),
            babip: fmtRatePct(totals.babip),
          };
        }
      }

      // Statcast section -- pulled straight from pitches.csv, which already
      // captures velocity/spin/exit-velo/launch-angle data for every pitch
      // thrown or put in play. Filter to this player's pitches (as pitcher
      // or as batter), build the per-game opponent lookup from schedule.csv,
      // and only render the section when there's qualifying data (AFL
      // Statcast/Hawkeye coverage isn't 100%, so plenty of players will have
      // none this season). Computed here (before Career Path builds its
      // context) but actually appended to html further down, between the
      // Career Path section and the Transaction Log.
      const playerPitches = isPitcher
        ? pitches.filter(p => p.pitcher_id === playerId)
        : pitches.filter(p => p.batter_id === playerId);
      const opponentMap = buildGamePkOpponentMap(schedule, player.team);
      const statcastTotals = isPitcher ? pitcherStatcastTotals(playerPitches) : hitterStatcastTotals(playerPitches);

      // DH is batting-only -- there shouldn't be fielding rows for it, but
      // filter defensively in case one ever slips through.
      const playerFielding = fieldingGameLogs.filter(g => g.player_id === playerId && g.position !== 'DH');
      const regFielding = playerFielding.filter(g => !isPostseasonRow(g));
      const postFielding = playerFielding.filter(g => isPostseasonRow(g));

      careerCtx = {
        statType, aflRow, aflGameLogRows,
        team: player.team, playerAge: player.age || '',
        regFieldingByPos: groupFieldingByPosition(regFielding),
        postFieldingByPos: groupFieldingByPosition(postFielding),
      };
      activeCareerTab = 'primary';

      html += renderAflGameLogSection(aflGameLogRows, statType, aflRow, careerCtx.regFieldingByPos, careerCtx.postFieldingByPos, isPitcher);

      if (statcastTotals) {
        const statcastPerGame = buildStatcastPerGameRows(playerPitches, opponentMap, statType);
        html += renderStatcastSection(player.team, statcastTotals, statcastPerGame, statType, 'statcast-gamelog', playerId);
      }

      html += `<div class="section-title">Career Path <span class="section-note">(live from MLB, ${currentSeason} AFL row highlighted)</span></div>`;
      html += `
        <div class="tab-row">
          <button class="stat-tab active" id="tab-btn-primary" onclick="switchCareerTab('primary')">${isPitcher ? 'Pitching' : 'Hitting'}</button>
          <button class="stat-tab" id="tab-btn-fielding" onclick="switchCareerTab('fielding')">Fielding</button>
        </div>
      `;
      html += `<div id="career-path-container"><p class="loading">Loading career path...</p></div>`;

      html += renderTransactionTable(playerTransactions);
      html += renderStatGlossary();

      content.innerHTML = html;
      wireTransactionExpand();
      if (isPitcher && statcastTotals) initSeasonStatcast(playerPitches, { hand: ((player.throws || '')[0] || 'R').toUpperCase(), opponentMap });

      loadCareerPath(aflRow, statType, aflGameLogRows);
      loadLiveTransactions(playerTransactions);
    } catch (err) {
      content.innerHTML = `<p class="error">Couldn't load player: ${err.message}</p>`;
    }
  }

  async function init() {
    await loadSeasons();
    renderControls();
    loadPlayerPage();
  }

  init();
</script>

</body>
</html>
