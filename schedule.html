<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arizona Fall League Schedule</title>
<style>
  :root {
    --bg: #FDFCFB;
    --bg-card: #FFFFFF;
    --border: #e8e6e2;
    --text: #111418;
    --text-muted: #5a6472;
    --accent: #b8860b;
    --final: #1a8a4a;
    --cancelled: #c0392b;
    --scheduled: #2f6fb0;
    --header-bg: #0d1b3a;
    --header-card-bg: #16305c;
    --header-border: #2c4a7c;
    --header-text: #ffffff;
    --tab-active: #f26522;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    line-height: 1.5;
  }
  header {
    padding: 1.5rem 1.5rem 0;
  }
  .header-inner {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 2.5rem;
    max-width: 900px;
    margin: 0 auto;
    background: var(--header-bg);
    border-radius: 16px;
    padding: 2.25rem 1.5rem;
  }
  h1 {
    font-size: 2.2rem;
    font-weight: 600;
    margin: 0;
    letter-spacing: -0.01em;
    text-align: center;
    color: var(--header-text);
  }
  .league-logo {
    height: 100px;
    width: auto;
    flex-shrink: 0;
  }
  .header-inner > a {
    display: inline-flex;
    flex-shrink: 0;
    line-height: 0;
  }
  .title-line {
    display: block;
    line-height: 1.3;
  }
  .title-central {
    display: inline-block;
    border-bottom: 2px solid var(--header-text);
    padding-bottom: 0.2rem;
    width: fit-content;
  }
  footer {
    max-width: 900px;
    margin: 0 auto;
    padding: 1.5rem 1.5rem 3rem;
    text-align: center;
  }
  .subtitle {
    color: var(--text-muted);
    font-size: 0.75rem;
    margin: 0;
  }
  .season-control {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100px;
    gap: 0.4rem;
    flex-shrink: 0;
  }
  .season-label {
    color: var(--header-text);
    font-size: 1.15rem;
    font-weight: 600;
  }
  .season-select {
    background: var(--header-card-bg);
    border: 1px solid var(--header-border);
    color: var(--header-text);
    padding: 0.5rem 1rem;
    border-radius: 6px;
    cursor: pointer;
    font-size: 0.9rem;
    font-weight: 600;
    font-family: inherit;
  }
  .nav-tabs {
    display: flex;
    justify-content: center;
    gap: 2rem;
    max-width: 900px;
    margin: 1.25rem auto 0;
    padding: 0 1.5rem;
    border-bottom: 1px solid var(--border);
  }
  .nav-tab {
    display: inline-block;
    padding-bottom: 0.7rem;
    margin-bottom: -1px;
    color: var(--text-muted);
    font-weight: 600;
    font-size: 0.95rem;
    text-decoration: none;
    border-bottom: 3px solid transparent;
  }
  .nav-tab:hover {
    color: var(--text);
  }
  .nav-tab.active {
    color: var(--text);
    font-weight: 700;
    border-bottom-color: var(--tab-active);
  }
  .filters-bar {
    display: flex;
    align-items: flex-end;
    justify-content: center;
    gap: 2.5rem;
    max-width: 900px;
    margin: 0 auto;
    padding: 1.25rem 1.5rem 1rem;
    flex-wrap: wrap;
  }
  .filter-group {
    display: flex;
    flex-direction: column;
    gap: 0.3rem;
  }
  .filter-group label {
    font-size: 0.78rem;
    color: var(--text-muted);
    font-weight: 600;
  }
  .filter-group select,
  .filter-group input[type="date"] {
    background: var(--bg-card);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 0.45rem 0.8rem;
    border-radius: 6px;
    cursor: pointer;
    font-size: 0.88rem;
    font-family: inherit;
  }
  .clear-filters-btn {
    background: none;
    border: 1px solid var(--border);
    color: var(--text-muted);
    padding: 0.45rem 0.9rem;
    border-radius: 6px;
    cursor: pointer;
    font-size: 0.85rem;
    font-family: inherit;
  }
  .clear-filters-btn:hover {
    color: var(--text);
    border-color: var(--text-muted);
  }
  main {
    max-width: 900px;
    margin: 0 auto;
    padding: 2rem 1.5rem 3rem;
  }
  .day-group {
    margin-bottom: 1.75rem;
  }
  .day-label-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin: 0 0 0.6rem;
    padding-bottom: 0.4rem;
    padding-left: 1.3rem;
    padding-right: 0.2rem;
    border-bottom: 1px solid var(--border);
  }
  .day-label {
    font-size: 0.8rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--text-muted);
  }
  .chrono-toggle {
    display: flex;
    align-items: center;
    gap: 0.4rem;
    color: var(--text-muted);
    font-size: 0.8rem;
    font-weight: 600;
    cursor: pointer;
    text-transform: none;
    letter-spacing: normal;
  }
  .chrono-toggle input {
    width: 14px;
    height: 14px;
    cursor: pointer;
  }
  .season-divider {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    color: var(--tab-active);
    font-size: 0.78rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    margin: 1.5rem 0 1.75rem;
  }
  .season-divider::before,
  .season-divider::after {
    content: '';
    flex: 1;
    border-top: 1px solid var(--tab-active);
  }
  .game-row {
    display: grid;
    grid-template-columns: 120px 1fr auto;
    align-items: center;
    gap: 1rem;
    padding: 0.7rem 0.9rem;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 8px;
    margin-bottom: 0.5rem;
    box-shadow: 0 1px 2px rgba(0,0,0,0.04);
  }
  .game-time {
    color: var(--text-muted);
    font-size: 0.8rem;
    line-height: 1.4;
    padding-left: 0.4rem;
  }
  .time-wrap {
    display: inline-block;
  }
  .time-line {
    display: block;
    white-space: nowrap;
  }
  .time-divider {
    display: block;
    border-top: 1px solid var(--border);
    width: 100%;
    margin: 0.2rem 0;
  }
  .matchup {
    font-size: 0.98rem;
  }
  .venue {
    color: var(--text-muted);
    font-size: 0.82rem;
    margin-top: 0.15rem;
  }
  .decisions {
    color: var(--text-muted);
    font-size: 0.78rem;
    margin-top: 0.3rem;
  }
  .decision-label {
    color: var(--accent);
    font-weight: 600;
  }
  .decision-label-win {
    color: var(--final);
    font-weight: 600;
  }
  .decision-label-loss {
    color: var(--cancelled);
    font-weight: 600;
  }
  .decision-label-save {
    color: var(--header-bg);
    font-weight: 600;
  }
  .status {
    font-size: 0.78rem;
    padding: 0.25rem 0.6rem;
    border-radius: 5px;
    white-space: nowrap;
    text-align: center;
  }
  .status.final { background: rgba(26,138,74,0.12); color: var(--final); }
  .status.scheduled { background: rgba(47,111,176,0.12); color: var(--scheduled); }
  .status.cancelled, .status.postponed { background: rgba(192,57,43,0.12); color: var(--cancelled); }
  .score {
    color: var(--text-muted);
    font-weight: 400;
    vertical-align: middle;
  }
  .score.win {
    color: var(--final);
    font-weight: 600;
  }
  .score.loss {
    color: var(--cancelled);
    font-weight: 400;
  }
  .loading, .error {
    color: var(--text-muted);
    padding: 2rem 0;
  }
  .team-link {
    color: var(--text);
    cursor: pointer;
    text-decoration: none;
    border-bottom: 1px dashed transparent;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    vertical-align: middle;
  }
  .team-logo {
    width: 18px;
    height: 18px;
    object-fit: contain;
    flex-shrink: 0;
  }
  .team-link:hover {
    color: var(--tab-active);
    border-bottom-color: var(--tab-active);
  }
  .team-link.winner {
    font-weight: 700;
  }
  .filter-banner {
    max-width: 900px;
    margin: 1.5rem auto 0;
    padding: 0 1.5rem;
  }
  .team-banner-card {
    display: flex;
    align-items: center;
    gap: 1.5rem;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1.25rem 1.5rem;
    box-shadow: 0 1px 2px rgba(0,0,0,0.04);
    flex-wrap: wrap;
  }
  .team-banner-identity {
    display: flex;
    align-items: center;
    gap: 1.25rem;
    flex-shrink: 0;
  }
  .team-banner-logo {
    width: 64px;
    height: 64px;
    object-fit: contain;
    flex-shrink: 0;
  }
  .team-banner-name {
    font-size: 1.5rem;
    font-weight: 700;
    color: var(--text);
    line-height: 1.15;
  }
  .team-banner-record {
    font-size: 1.2rem;
    margin-top: 0.2rem;
    color: var(--text);
  }
  .team-banner-roster-link {
    display: inline-block;
    margin-top: 0.4rem;
    color: var(--tab-active);
    font-size: 0.85rem;
    font-weight: 600;
    text-decoration: none;
    border-bottom: 1px dashed var(--tab-active);
  }
  .team-banner-dash {
    color: var(--text-muted);
  }
  .team-banner-info {
    display: flex;
    flex: 1;
    gap: 1.5rem;
    min-width: 260px;
  }
  .team-banner-col {
    flex: 1;
    border-left: 1px solid var(--border);
    padding-left: 1.5rem;
  }
  .team-banner-col-label {
    color: var(--text-muted);
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    font-weight: 600;
  }
  .team-banner-col-date {
    color: var(--text);
    font-size: 0.9rem;
    margin-top: 0.3rem;
  }
  .team-banner-col-detail {
    color: var(--text-muted);
    font-size: 0.82rem;
    margin-top: 0.2rem;
  }
  .team-banner-col-note {
    color: var(--text-muted);
    font-size: 0.78rem;
    margin-top: 0.1rem;
    font-style: italic;
  }
  .team-banner-result-win { color: var(--final); font-weight: 700; }
  .team-banner-result-loss { color: var(--cancelled); font-weight: 700; }
  .clear-filter {
    color: var(--accent);
    cursor: pointer;
    text-decoration: underline;
    background: none;
    border: none;
    font-size: 0.9rem;
    padding: 0;
  }
  @media (max-width: 560px) {
    .game-row { grid-template-columns: 55px 1fr; }
    .status { grid-column: 1 / -1; justify-self: start; margin-top: 0.3rem; }
  }
  .box-toggle-btn {
    background: none;
    border: none;
    cursor: pointer;
    font: inherit;
    padding: 0.3rem 0 0;
    margin-top: 0.3rem;
    color: var(--tab-active);
    font-size: 0.78rem;
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 0.35rem;
  }
  .box-score {
    margin-top: 0.5rem;
    padding-top: 0.5rem;
    border-top: 1px dashed var(--border);
  }
  .bs-team-title {
    font-size: 0.7rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    color: var(--text-muted);
    margin: 0.75rem 0 0.35rem;
  }
  .bs-table {
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
    margin-bottom: 0.4rem;
  }
  .bs-header, .bs-row {
    display: grid;
    grid-template-columns: 26px 2fr repeat(13, 0.62fr);
    gap: 4px;
    padding: 0.35rem 0.55rem;
    font-size: 0.76rem;
    align-items: center;
  }
  .bs-team-tabs {
    display: flex;
    gap: 0.4rem;
    margin: 0.2rem 0 0.6rem;
  }
  .bs-team-tab {
    background: none;
    border: 1px solid var(--border);
    color: var(--text-muted);
    padding: 0.3rem 0.75rem;
    border-radius: 6px;
    cursor: pointer;
    font-size: 0.78rem;
    font-weight: 600;
    font-family: inherit;
  }
  .bs-team-tab.active {
    background: var(--tab-active);
    border-color: var(--tab-active);
    color: #ffffff;
  }
  .bs-header-p, .bs-row-p {
    display: grid;
    grid-template-columns: 26px 2fr repeat(10, 0.62fr);
    gap: 4px;
    padding: 0.35rem 0.55rem;
    font-size: 0.76rem;
    align-items: center;
  }
  .bs-header-p {
    white-space: nowrap;
  }
  .bs-header, .bs-header-p {
    background: #f2f1ee;
    font-weight: 700;
    color: var(--text-muted);
    text-transform: uppercase;
    font-size: 0.66rem;
  }
  .bs-row, .bs-row-p {
    border-top: 1px solid var(--border);
    color: var(--text);
  }
  .bs-note {
    font-size: 0.7rem;
    color: var(--text-muted);
    font-style: italic;
    margin: 0.1rem 0 0.5rem;
  }
  .player-link {
    color: var(--text);
    text-decoration: none;
    font-weight: 600;
  }
  .player-link:hover {
    color: var(--tab-active);
    text-decoration: underline;
  }
  .postseason-tag {
    background: #2c4a7c;
    color: #ffb38a;
    font-size: 0.62rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.02em;
    padding: 2px 8px;
    border-radius: 999px;
    display: inline-block;
    vertical-align: middle;
  }
  @media (max-width: 560px) {
    .bs-header, .bs-row { font-size: 0.66rem; grid-template-columns: 20px 1.4fr repeat(13, 1fr); overflow-x: auto; }
    .bs-header-p, .bs-row-p { font-size: 0.66rem; grid-template-columns: 20px 1.4fr repeat(10, 1fr); overflow-x: auto; }
  }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <a href="index.html"><img class="league-logo" src="logos/afl-logo.svg" alt="" onerror="this.style.display='none'"></a>
    <h1>
      <span class="title-line">Arizona Fall League</span>
      <span class="title-line"><span class="title-central">Central</span></span>
    </h1>
    <div class="season-control">
      <span class="season-label">Season:</span>
      <select id="season-select" class="season-select"></select>
    </div>
  </div>
</header>

<nav class="nav-tabs">
  <a class="nav-tab" href="index.html">Home</a>
  <a class="nav-tab active" href="schedule.html">Schedule</a>
  <a class="nav-tab" href="standings.html">Standings</a>
  <a class="nav-tab" href="roster.html">Rosters</a>
</nav>

<div class="filters-bar">
  <div class="filter-group">
    <label for="team-filter-select">Team</label>
    <select id="team-filter-select">
      <option value="">All teams</option>
    </select>
  </div>
  <div class="filter-group">
    <label for="date-filter-input">Date</label>
    <input type="date" id="date-filter-input">
  </div>
  <button id="clear-filters-btn" class="clear-filters-btn" style="display:none;">Reset</button>
</div>

<div class="filter-banner" id="filter-banner" style="display:none;"></div>

<main id="content">
  <p class="loading">Loading schedule...</p>
</main>

<footer>
  <p class="subtitle">Schedule, updated automatically from the MLB Stats API</p>
</footer>

<script>
  let SEASONS = [];
  const params = new URLSearchParams(window.location.search);
  let currentSeason = parseInt(params.get('season'), 10) || new Date().getFullYear();
  let currentTeam = params.get('team') || null;
  let currentDate = params.get('date') || null;
  let chronoOrderChecked = false;
  let allGames = [];
  let decisionsByGame = {};
  let pitcherStatsById = {};
  let pitchingGameLogsByKey = {};
  let pitchingGameLogsByGame = {};
  let hittingGameLogsByKey = {};
  let hittingGameLogsByPlayer = {};
  let pitchingGameLogsByPlayer = {};
  let lineupsByGame = {};
  let pitcherAppearancesByGame = {};

  function getArizonaTodayISO() {
    const parts = new Intl.DateTimeFormat('en-CA', {
      timeZone: 'America/Phoenix', year: 'numeric', month: '2-digit', day: '2-digit',
    }).formatToParts(new Date());
    const y = parts.find(p => p.type === 'year').value;
    const m = parts.find(p => p.type === 'month').value;
    const d = parts.find(p => p.type === 'day').value;
    return `${y}-${m}-${d}`;
  }

  async function loadSeasons() {
    try {
      const res = await fetch('data/seasons.json');
      if (res.ok) {
        SEASONS = await res.json();
      }
    } catch (e) {
      // fall through to fallback below
    }
    if (!SEASONS || SEASONS.length === 0) {
      SEASONS = [currentSeason];
    }
    if (!SEASONS.includes(currentSeason)) {
      currentSeason = SEASONS[SEASONS.length - 1];
    }
  }

  function renderControls() {
    const el = document.getElementById('season-select');
    el.innerHTML = '';
    [...SEASONS].sort((a, b) => b - a).forEach(season => {
      const opt = document.createElement('option');
      opt.value = season;
      opt.textContent = season;
      if (season === currentSeason) opt.selected = true;
      el.appendChild(opt);
    });
    el.onchange = () => {
      currentSeason = parseInt(el.value, 10);
      if (currentDate) {
        const [, month, day] = currentDate.split('-');
        currentDate = `${currentSeason}-${month}-${day}`;
      }
      updateUrl();
      loadSchedule();
    };
  }

  function updateUrl() {
    const p = new URLSearchParams();
    p.set('season', currentSeason);
    if (currentTeam) p.set('team', currentTeam);
    if (currentDate) p.set('date', currentDate);
    history.replaceState(null, '', '?' + p.toString());
  }

  function syncFilterControls() {
    const teamSelect = document.getElementById('team-filter-select');
    const dateInput = document.getElementById('date-filter-input');
    const clearBtn = document.getElementById('clear-filters-btn');
    if (teamSelect) teamSelect.value = currentTeam || '';
    if (dateInput) dateInput.value = currentDate || '';
    if (clearBtn) clearBtn.style.display = (currentTeam || currentDate) ? 'inline-block' : 'none';
  }

  function setTeamFilter(teamName) {
    currentTeam = teamName || null;
    updateUrl();
    syncFilterControls();
    renderBanner();
    renderGames();
  }

  function clearTeamFilter() {
    currentTeam = null;
    updateUrl();
    syncFilterControls();
    renderBanner();
    renderGames();
  }

  function setDateFilter(dateStr) {
    currentDate = dateStr || null;

    if (currentDate) {
      const targetYear = parseInt(currentDate.slice(0, 4), 10);
      if (targetYear !== currentSeason && SEASONS.includes(targetYear)) {
        currentSeason = targetYear;
        renderControls();
        updateUrl();
        syncFilterControls();
        loadSchedule();
        return;
      }
    }

    updateUrl();
    syncFilterControls();
    renderGames();
  }

  function clearAllFilters() {
    currentTeam = null;
    currentDate = null;
    updateUrl();
    syncFilterControls();
    renderBanner();
    renderGames();
  }

  const NON_TEAM_NAMES = ['TBD', 'To Be Determined', 'American League Fall Stars', 'National League Fall Stars'];

  function populateTeamFilterOptions() {
    const el = document.getElementById('team-filter-select');
    if (!el) return;
    const teams = new Set();
    allGames.forEach(g => {
      if (g.away_team && !NON_TEAM_NAMES.includes(g.away_team)) teams.add(g.away_team);
      if (g.home_team && !NON_TEAM_NAMES.includes(g.home_team)) teams.add(g.home_team);
    });
    el.innerHTML = '<option value="">All teams</option>';
    [...teams].sort().forEach(team => {
      const opt = document.createElement('option');
      opt.value = team;
      opt.textContent = team;
      el.appendChild(opt);
    });
    syncFilterControls();
  }

  function setupFilterControls() {
    const teamSelect = document.getElementById('team-filter-select');
    const dateInput = document.getElementById('date-filter-input');
    const clearBtn = document.getElementById('clear-filters-btn');
    if (teamSelect) {
      teamSelect.onchange = () => setTeamFilter(teamSelect.value || null);
    }
    if (dateInput) {
      dateInput.onchange = () => setDateFilter(dateInput.value || null);
    }
    if (clearBtn) {
      clearBtn.onclick = clearAllFilters;
    }
  }

  function getTeamRecord(teamName) {
    const played = allGames.filter(g => {
      const isThisTeam = g.away_team === teamName || g.home_team === teamName;
      const isRegularSeason = g.game_type === 'Regular Season';
      const s = (g.status || '').toLowerCase();
      const wasPlayed = s.includes('final') || s.includes('completed');
      return isThisTeam && isRegularSeason && wasPlayed;
    });
    if (played.length === 0) return { wins: '0', losses: '0', ties: '0' };

    played.sort((a, b) => (a.date > b.date ? 1 : -1));
    const last = played[played.length - 1];
    const isAway = last.away_team === teamName;
    const wins = isAway ? last.away_wins : last.home_wins;
    const losses = isAway ? last.away_losses : last.home_losses;
    const ties = isAway ? last.away_ties : last.home_ties;
    if (wins === undefined || losses === undefined || wins === '' || losses === '') {
      return { wins: '0', losses: '0', ties: '0' };
    }

    return { wins, losses, ties };
  }

  function getNextGame(teamName) {
    const upcoming = allGames.filter(g => {
      const isThisTeam = (g.away_team === teamName || g.home_team === teamName) && g.game_type !== 'Fall Stars Game';
      const s = (g.status || '').toLowerCase();
      const isUpcoming = s.includes('scheduled') || s.includes('pre-game') || s.includes('warmup');
      return isThisTeam && isUpcoming;
    });
    return upcoming.length ? upcoming[0] : null;
  }

  function getLastGame(teamName) {
    const played = allGames.filter(g => {
      const isThisTeam = (g.away_team === teamName || g.home_team === teamName) && g.game_type !== 'Fall Stars Game';
      const s = (g.status || '').toLowerCase();
      const wasPlayed = s.includes('final') || s.includes('completed');
      return isThisTeam && wasPlayed;
    });
    return played.length ? played[played.length - 1] : null;
  }

  function opponentLine(g, teamName) {
    const isAway = g.away_team === teamName;
    const opponent = isAway ? g.home_team : g.away_team;
    return isAway ? `@ ${opponent}` : `vs. ${opponent}`;
  }

  function renderBanner() {
    const banner = document.getElementById('filter-banner');
    if (!currentTeam) {
      banner.style.display = 'none';
      banner.innerHTML = '';
      return;
    }
    banner.style.display = 'block';

    const record = getTeamRecord(currentTeam);
    let recordHtml = `${record.wins}<span class="team-banner-dash"> - </span>${record.losses}`;
    if (record.ties && record.ties !== '0') {
      recordHtml += `<span class="team-banner-dash"> - </span>${record.ties}`;
    }

    const logoSrc = TEAM_LOGOS[currentTeam];
    const logoImg = logoSrc
      ? `<img class="team-banner-logo" src="${logoSrc}" alt="" onerror="this.style.display='none'">`
      : '';

    const next = getNextGame(currentTeam);
    const last = getLastGame(currentTeam);

    let nextCol = '';
    if (next) {
      nextCol = `
        <div class="team-banner-col">
          <div class="team-banner-col-label">Next game</div>
          <div class="team-banner-col-date">${formatDateLabel(next.date)}</div>
          <div class="team-banner-col-date">${next.time_az || ''}</div>
          <div class="team-banner-col-detail">${opponentLine(next, currentTeam)}</div>
          <div class="team-banner-col-detail">${next.venue || ''}</div>
        </div>
      `;
    }

    let lastCol = '';
    if (last) {
      const hasScore = last.away_score !== '' && last.away_score !== undefined && last.home_score !== '' && last.home_score !== undefined;
      const isAway = last.away_team === currentTeam;
      const teamScore = isAway ? last.away_score : last.home_score;
      const oppScore = isAway ? last.home_score : last.away_score;
      let resultHtml = '';
      if (hasScore) {
        const won = Number(teamScore) > Number(oppScore);
        const cls = won ? 'team-banner-result-win' : 'team-banner-result-loss';
        const letter = won ? 'W' : 'L';
        resultHtml = `<span class="${cls}">${letter}</span> ${teamScore}-${oppScore}`;
      }
      const gameTypeNote = (last.game_type && last.game_type !== 'Regular Season')
        ? `<div class="team-banner-col-note">${last.game_type}</div>` : '';
      lastCol = `
        <div class="team-banner-col">
          <div class="team-banner-col-label">Last game</div>
          <div class="team-banner-col-date">${formatDateLabel(last.date)}</div>
          ${resultHtml ? `<div class="team-banner-col-date">${resultHtml}</div>` : ''}
          <div class="team-banner-col-detail">${opponentLine(last, currentTeam)}</div>
          ${gameTypeNote}
        </div>
      `;
    }

    const infoHtml = (nextCol || lastCol) ? `<div class="team-banner-info">${nextCol}${lastCol}</div>` : '';

    banner.innerHTML = `
      <div class="team-banner-card">
        <div class="team-banner-identity">
          ${logoImg}
          <div>
            <div class="team-banner-name">${currentTeam}</div>
            <div class="team-banner-record">${recordHtml}</div>
            <a class="team-banner-roster-link" href="roster.html?season=${currentSeason}&team=${encodeURIComponent(currentTeam)}">Roster</a>
          </div>
        </div>
        ${infoHtml}
      </div>
    `;
  }

  function parseCSV(text) {
    const lines = text.trim().split(/\r?\n/);
    const headers = splitCSVLine(lines[0]);
    return lines.slice(1).map(line => {
      const values = splitCSVLine(line);
      const row = {};
      headers.forEach((h, i) => { row[h] = values[i] !== undefined ? values[i] : ''; });
      return row;
    });
  }

  function splitCSVLine(line) {
    const result = [];
    let cur = '';
    let inQuotes = false;
    for (let i = 0; i < line.length; i++) {
      const ch = line[i];
      if (ch === '"') {
        inQuotes = !inQuotes;
      } else if (ch === ',' && !inQuotes) {
        result.push(cur);
        cur = '';
      } else {
        cur += ch;
      }
    }
    result.push(cur);
    return result;
  }

  function statusClass(status) {
    const s = (status || '').toLowerCase();
    if (s.includes('final') || s.includes('completed')) return 'final';
    if (s.includes('cancel')) return 'cancelled';
    if (s.includes('postpon')) return 'postponed';
    return 'scheduled';
  }

  const TEAM_LOGOS = {
    'Glendale Desert Dogs': 'logos/glendale.svg',
    'Mesa Solar Sox': 'logos/mesa.svg',
    'Peoria Javelinas': 'logos/peoria.svg',
    'Salt River Rafters': 'logos/salt-river.svg',
    'Scottsdale Scorpions': 'logos/scottsdale.svg',
    'Surprise Saguaros': 'logos/surprise.svg',
  };

  function teamLogoImg(name) {
    const src = TEAM_LOGOS[name];
    if (!src) return '';
    return `<img class="team-logo" src="${src}" alt="" onerror="this.style.display='none'">`;
  }

  function teamLink(name, isWinner) {
    const safe = (name || 'TBD').replace(/'/g, "\\'");
    const winnerClass = isWinner ? ' winner' : '';
    return `<a class="team-link${winnerClass}" href="#" onclick="setTeamFilter('${safe}'); return false;">${teamLogoImg(name)}${name || 'TBD'}</a>`;
  }

  function scoreSpan(teamScore, opponentScore) {
    if (teamScore === '' || teamScore === undefined) return '';
    const isWin = Number(teamScore) > Number(opponentScore);
    const isLoss = Number(teamScore) < Number(opponentScore);
    const cls = isWin ? ' win' : isLoss ? ' loss' : '';
    return ` <span class="score${cls}">${teamScore}</span>`;
  }

  function pitcherRecordAndEraSuffix(pitcherId) {
    const p = pitcherStatsById[pitcherId];
    if (!p) return '';
    const parts = [];
    if (p.wins !== '' && p.losses !== '') parts.push(`${p.wins}-${p.losses}`);
    if (p.era !== '') parts.push(`${p.era} ERA`);
    return parts.length ? ` (${parts.join(', ')})` : '';
  }

  // Cumulative record + ERA for a pitcher through a specific game. Prefers
  // pitching_gamelogs.csv (MLB's own cumulative numbers, correct for every
  // appearance) and only falls back to decisions.csv's running record
  // (which skips no-decision appearances) when the new data isn't loaded
  // for this season yet.
  function pitcherCumulativeSuffix(gamePk, pitcherId, fallbackWins, fallbackLosses, fallbackEra) {
    const row = pitchingGameLogsByKey[`${gamePk}_${pitcherId}`];
    const wins = row && row.wins !== '' ? row.wins : fallbackWins;
    const losses = row && row.losses !== '' ? row.losses : fallbackLosses;
    const era = row && row.era !== '' ? row.era : fallbackEra;
    const parts = [];
    if (wins !== undefined && losses !== undefined && wins !== '' && losses !== '') parts.push(`${wins}-${losses}`);
    if (era !== undefined && era !== '') parts.push(`${era} ERA`);
    return parts.length ? ` (${parts.join(', ')})` : '';
  }

  // For a playoff game, "cumulative" record/ERA means playoff-only, chained
  // across First Round/Semifinal/Championship -- not MLB's own per-round
  // reset fields, and not the regular-season record either.
  function decisionPitcherSuffix(g, pitcherId, fallbackWins, fallbackLosses, fallbackEra) {
    if (isPlayoffGame(g)) {
      const cum = playoffPitchingCumulative(pitcherId, g.game_pk);
      const parts = [];
      if (cum.games > 0) parts.push(`${cum.wins}-${cum.losses}`);
      parts.push(`${fmtRatio(cum.era)} ERA`);
      return ` (${parts.join(', ')})`;
    }
    return pitcherCumulativeSuffix(g.game_pk, pitcherId, fallbackWins, fallbackLosses, fallbackEra);
  }

  function decisionLine(g) {
    const s = (g.status || '').toLowerCase();
    const wasPlayed = s.includes('final') || s.includes('completed');
    if (!wasPlayed) return '';

    const d = decisionsByGame[g.game_pk];
    if (!d || !d.winning_pitcher_name) return '';

    const playoff = isPlayoffGame(g);
    const tag = playoff ? '<span class="postseason-tag">Postseason</span> ' : '';

    const wRecord = decisionPitcherSuffix(g, d.winning_pitcher_id, d.winning_pitcher_wins, d.winning_pitcher_losses, d.winning_pitcher_era);
    let line = `${tag}<span class="decision-label-win">W</span> ${d.winning_pitcher_name}${wRecord}`;

    if (d.losing_pitcher_name) {
      const lRecord = decisionPitcherSuffix(g, d.losing_pitcher_id, d.losing_pitcher_wins, d.losing_pitcher_losses, d.losing_pitcher_era);
      line += ` &nbsp; <span class="decision-label-loss">L</span> ${d.losing_pitcher_name}${lRecord}`;
    }
    if (d.save_pitcher_name) {
      let saves;
      if (playoff) {
        const cum = playoffPitchingCumulative(d.save_pitcher_id, g.game_pk);
        saves = cum.saves;
      } else {
        const saveRow = pitchingGameLogsByKey[`${g.game_pk}_${d.save_pitcher_id}`];
        saves = saveRow && saveRow.saves !== '' ? saveRow.saves : d.save_pitcher_saves;
      }
      const saveSuffix = (saves !== '' && saves !== undefined) ? ` (${saves} SV)` : '';
      line += ` &nbsp; <span class="decision-label-save">SV</span> ${d.save_pitcher_name}${saveSuffix}`;
    }
    return `<div class="decisions">${line}</div>`;
  }

  // ---- Box score (collapsible, in place on the schedule page) ----

  function fmtDash(v) {
    return (v === undefined || v === '' || v === null) ? '-' : v;
  }

  function ipToOuts(ip) {
    if (!ip) return 0;
    const [whole, frac] = String(ip).split('.');
    const wholeOuts = whole ? parseInt(whole, 10) * 3 : 0;
    const fracOuts = frac ? parseInt(frac, 10) : 0;
    return wholeOuts + fracOuts;
  }

  function gameEraDisplay(er, ip) {
    const outs = ipToOuts(ip);
    if (!outs) return '-.--';
    const earnedRuns = Number(er) || 0;
    return ((earnedRuns * 27) / outs).toFixed(2);
  }

  // ---- Regular season vs. postseason split ----
  //
  // hitting_gamelogs.csv / pitching_gamelogs.csv rows carry MLB's raw
  // gameType code ("R" = regular season; "D"/"L"/"W" = the AFL's First
  // Round / Semifinal / Championship). schedule.csv's own game_type field
  // is the human-readable label from fetch_afl_schedule.py's
  // GAME_TYPE_LABELS -- these three mark a playoff game there.
  const POSTSEASON_GAME_TYPES = new Set(['D', 'L', 'W']);
  function isPostseasonRow(r) { return POSTSEASON_GAME_TYPES.has(r.game_type); }
  const POSTSEASON_TYPE_LABELS = new Set(['First Round', 'Semifinal', 'Championship']);
  function isPlayoffGame(g) { return POSTSEASON_TYPE_LABELS.has(g.game_type); }

  function fmtRate(n) {
    if (n === null || n === undefined || isNaN(n)) return '';
    return n.toFixed(3).replace(/^0\./, '.');
  }
  function fmtRatio(n) {
    if (n === null || n === undefined || isNaN(n)) return '-.--';
    return n.toFixed(2);
  }

  // Same summation approach as player.html's sumHittingGames/sumPitchingGames
  // -- MLB's own cumulative rate fields (avg/obp/slg/ops, era/whip/W-L) reset
  // independently at the start of each postseason round, so a genuine
  // chained-across-rounds postseason cumulative has to be recomputed from
  // each game's raw counting stats rather than read off the row directly.
  function sumHittingGames(games) {
    const totals = { games: games.length, at_bats: 0, hits: 0, walks: 0, hit_by_pitch: 0, sac_flies: 0, total_bases: 0 };
    games.forEach(g => {
      totals.at_bats += Number(g.at_bats) || 0;
      totals.hits += Number(g.hits) || 0;
      totals.walks += Number(g.walks) || 0;
      totals.hit_by_pitch += Number(g.hit_by_pitch) || 0;
      totals.sac_flies += Number(g.sac_flies) || 0;
      totals.total_bases += Number(g.total_bases) || 0;
    });
    const ab = totals.at_bats;
    const pa_denominator = ab + totals.walks + totals.hit_by_pitch + totals.sac_flies;
    totals.avg = ab > 0 ? (totals.hits / ab) : null;
    totals.obp = pa_denominator > 0 ? ((totals.hits + totals.walks + totals.hit_by_pitch) / pa_denominator) : null;
    totals.slg = ab > 0 ? (totals.total_bases / ab) : null;
    totals.ops = (totals.obp !== null && totals.slg !== null) ? (totals.obp + totals.slg) : null;
    return totals;
  }

  function sumPitchingGames(games) {
    const totals = { games: games.length, wins: 0, losses: 0, saves: 0, hits: 0, earnedRuns: 0, baseOnBalls: 0, outs: 0 };
    games.forEach(g => {
      totals.wins += Number(g.wins) || 0;
      totals.losses += Number(g.losses) || 0;
      totals.saves += Number(g.saves) || 0;
      totals.hits += Number(g.hits) || 0;
      totals.earnedRuns += Number(g.earnedRuns) || 0;
      totals.baseOnBalls += Number(g.baseOnBalls) || 0;
      totals.outs += ipToOuts(g.inningsPitched);
    });
    totals.era = totals.outs > 0 ? (totals.earnedRuns * 27 / totals.outs) : null;
    totals.whip = totals.outs > 0 ? ((totals.hits + totals.baseOnBalls) * 3 / totals.outs) : null;
    return totals;
  }

  // Every postseason game (across all rounds, in date order) for a player up
  // through and including gamePk -- the prefix we chain the cumulative over.
  function postseasonGamesThrough(games, gamePk) {
    const sorted = games.filter(isPostseasonRow).slice()
      .sort((a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : 0));
    const idx = sorted.findIndex(r => String(r.game_pk) === String(gamePk));
    return idx === -1 ? sorted : sorted.slice(0, idx + 1);
  }

  function playoffHittingCumulative(playerId, gamePk) {
    return sumHittingGames(postseasonGamesThrough(hittingGameLogsByPlayer[playerId] || [], gamePk));
  }
  function playoffPitchingCumulative(pitcherId, gamePk) {
    return sumPitchingGames(postseasonGamesThrough(pitchingGameLogsByPlayer[pitcherId] || [], gamePk));
  }

  function hasBoxScoreData(gamePk) {
    return !!((lineupsByGame[gamePk] && lineupsByGame[gamePk].length) ||
      (pitcherAppearancesByGame[gamePk] && pitcherAppearancesByGame[gamePk].length));
  }

  function boxScoreSection(g) {
    const s = (g.status || '').toLowerCase();
    const wasPlayed = s.includes('final') || s.includes('completed');
    if (!wasPlayed || !hasBoxScoreData(g.game_pk)) return '';
    const gamePk = g.game_pk;
    return `
      <button class="box-toggle-btn" onclick="toggleBoxScore('${gamePk}'); return false;">
        <span id="box-caret-${gamePk}">&#9654;</span> Box Score
      </button>
      <div class="box-score" id="box-${gamePk}" style="display:none;"></div>
    `;
  }

  function toggleBoxScore(gamePk) {
    const container = document.getElementById(`box-${gamePk}`);
    const caret = document.getElementById(`box-caret-${gamePk}`);
    if (!container) return;

    const isOpen = container.style.display !== 'none';
    if (isOpen) {
      container.style.display = 'none';
      if (caret) caret.innerHTML = '&#9654;';
      return;
    }

    if (!container.dataset.built) {
      const g = allGames.find(x => String(x.game_pk) === String(gamePk));
      container.innerHTML = g ? buildBoxScoreHtml(g) : '';
      container.dataset.built = '1';
    }
    container.style.display = 'block';
    if (caret) caret.innerHTML = '&#9660;';
  }

  function buildBoxScoreHtml(g) {
    const gamePk = g.game_pk;
    const isPlayoff = isPlayoffGame(g);
    const awayHtml = battingSectionHtml(gamePk, 'away', g.away_team, isPlayoff) + pitchingSectionHtml(gamePk, 'away', g.away_team, isPlayoff);
    const homeHtml = battingSectionHtml(gamePk, 'home', g.home_team, isPlayoff) + pitchingSectionHtml(gamePk, 'home', g.home_team, isPlayoff);
    return `
      <div class="bs-team-tabs">
        <button class="bs-team-tab active" data-side="away" onclick="switchBoxTeam('${gamePk}', 'away'); return false;">${g.away_team || 'Away'}</button>
        <button class="bs-team-tab" data-side="home" onclick="switchBoxTeam('${gamePk}', 'home'); return false;">${g.home_team || 'Home'}</button>
      </div>
      <div class="bs-team-panel" data-side="away">${awayHtml}</div>
      <div class="bs-team-panel" data-side="home" style="display:none;">${homeHtml}</div>
    `;
  }

  function switchBoxTeam(gamePk, side) {
    const container = document.getElementById(`box-${gamePk}`);
    if (!container) return;
    container.querySelectorAll('.bs-team-tab').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.side === side);
    });
    container.querySelectorAll('.bs-team-panel').forEach(panel => {
      panel.style.display = panel.dataset.side === side ? 'block' : 'none';
    });
  }

  function battingSectionHtml(gamePk, side, teamName, isPlayoff) {
    const lineup = (lineupsByGame[gamePk] || []).filter(r => r.team_side === side);
    if (!lineup.length) return '';

    const bySlot = {};
    lineup.forEach(r => { (bySlot[r.order_slot] = bySlot[r.order_slot] || []).push(r); });
    const slots = Object.keys(bySlot).sort((a, b) => Number(a) - Number(b));

    let rows = '';
    slots.forEach(slot => {
      const entries = bySlot[slot].slice().sort((a, b) => a.sub_sequence.localeCompare(b.sub_sequence));
      entries.forEach((entry, idx) => { rows += battingRowHtml(gamePk, slot, entry, idx > 0, isPlayoff); });
    });

    const tag = isPlayoff ? ' <span class="postseason-tag">Postseason</span>' : '';
    return `
      <div class="bs-team-title">Batting &mdash; ${teamName || ''}${tag}</div>
      <div class="bs-table">
        <div class="bs-header">
          <div>#</div><div>Player</div><div>AVG</div><div>OPS</div><div>AB</div><div>R</div><div>H</div><div>RBI</div><div>2B</div><div>3B</div><div>HR</div><div>BB</div><div>IBB</div><div>K</div><div>SB</div>
        </div>
        ${rows}
      </div>
      ${isPlayoff ? '<div class="bs-note">AVG and OPS shown are playoff-only, chained across rounds through this game.</div>' : ''}
    `;
  }

  function battingRowHtml(gamePk, slot, entry, isSub, isPlayoff) {
    const stat = hittingGameLogsByKey[`${gamePk}_${entry.player_id}`] || {};
    const nameHtml = `<a class="player-link" href="player.html?id=${entry.player_id}&season=${currentSeason}">${entry.player_name}</a>`;
    const subPrefix = isSub ? '<span style="color: var(--text-muted);">&#8618; </span>' : '';
    const posLabel = entry.position_abbreviation
      ? ` <span style="color: var(--text-muted); font-size: 0.7rem;">${entry.position_abbreviation}</span>`
      : '';
    let avgDisplay = fmtDash(stat.avg);
    let opsDisplay = fmtDash(stat.ops);
    if (isPlayoff) {
      const cum = playoffHittingCumulative(entry.player_id, gamePk);
      avgDisplay = fmtDash(fmtRate(cum.avg));
      opsDisplay = fmtDash(fmtRate(cum.ops));
    }
    return `
      <div class="bs-row">
        <div>${isSub ? '' : slot}</div>
        <div>${subPrefix}${nameHtml}${posLabel}</div>
        <div>${avgDisplay}</div>
        <div>${opsDisplay}</div>
        <div>${fmtDash(stat.at_bats)}</div>
        <div>${fmtDash(stat.runs)}</div>
        <div>${fmtDash(stat.hits)}</div>
        <div>${fmtDash(stat.rbi)}</div>
        <div>${fmtDash(stat.doubles)}</div>
        <div>${fmtDash(stat.triples)}</div>
        <div>${fmtDash(stat.home_runs)}</div>
        <div>${fmtDash(stat.walks)}</div>
        <div>${fmtDash(stat.intentional_walks)}</div>
        <div>${fmtDash(stat.strikeouts)}</div>
        <div>${fmtDash(stat.stolen_bases)}</div>
      </div>
    `;
  }

  function pitchingSectionHtml(gamePk, side, teamName, isPlayoff) {
    const appearances = (pitcherAppearancesByGame[gamePk] || [])
      .filter(r => r.team_side === side)
      .slice()
      .sort((a, b) => Number(a.appearance_order) - Number(b.appearance_order));
    if (!appearances.length) return '';

    const rows = appearances.map(app => pitchingRowHtml(gamePk, app, isPlayoff)).join('');

    const tag = isPlayoff ? ' <span class="postseason-tag">Postseason</span>' : '';
    const note = isPlayoff
      ? 'ERA and WHIP shown are playoff-only, chained across rounds through this game; Gm ERA is this game only.'
      : 'ERA and WHIP shown are cumulative through this game; Gm ERA is this game only.';
    return `
      <div class="bs-team-title">Pitching &mdash; ${teamName || ''}${tag}</div>
      <div class="bs-table">
        <div class="bs-header-p">
          <div>#</div><div>Pitcher</div><div>ERA</div><div>Gm ERA</div><div>IP</div><div>H</div><div>R</div><div>ER</div><div>BB</div><div>K</div><div>Pit</div><div>WHIP</div>
        </div>
        ${rows}
      </div>
      <div class="bs-note">${note}</div>
    `;
  }

  function pitchingRowHtml(gamePk, app, isPlayoff) {
    const stat = pitchingGameLogsByKey[`${gamePk}_${app.pitcher_id}`] || {};
    const nameHtml = `<a class="player-link" href="player.html?id=${app.pitcher_id}&season=${currentSeason}">${app.pitcher_name}</a>`;
    const gmEra = gameEraDisplay(stat.earnedRuns, stat.inningsPitched);
    let eraDisplay = fmtDash(stat.era);
    let whipDisplay = fmtDash(stat.whip);
    if (isPlayoff) {
      const cum = playoffPitchingCumulative(app.pitcher_id, gamePk);
      eraDisplay = fmtRatio(cum.era);
      whipDisplay = fmtRatio(cum.whip);
    }
    return `
      <div class="bs-row-p">
        <div>${app.appearance_order}</div>
        <div>${nameHtml}</div>
        <div>${eraDisplay}</div>
        <div>${gmEra}</div>
        <div>${fmtDash(stat.inningsPitched)}</div>
        <div>${fmtDash(stat.hits)}</div>
        <div>${fmtDash(stat.runs)}</div>
        <div>${fmtDash(stat.earnedRuns)}</div>
        <div>${fmtDash(stat.baseOnBalls)}</div>
        <div>${fmtDash(stat.strikeOuts)}</div>
        <div>${fmtDash(stat.numberOfPitches)}</div>
        <div>${whipDisplay}</div>
      </div>
    `;
  }

  function probableLine(g) {
    const s = (g.status || '').toLowerCase();
    const notYetPlayed = s.includes('scheduled') || s.includes('pre-game') || s.includes('warmup');
    if (!notYetPlayed) return '';
    if (!g.away_probable_pitcher && !g.home_probable_pitcher) return '';

    const away = g.away_probable_pitcher
      ? `${g.away_probable_pitcher}${pitcherRecordAndEraSuffix(g.away_probable_pitcher_id)}`
      : 'TBD';
    const home = g.home_probable_pitcher
      ? `${g.home_probable_pitcher}${pitcherRecordAndEraSuffix(g.home_probable_pitcher_id)}`
      : 'TBD';
    return `<div class="decisions"><span class="decision-label">Probable</span> ${away} vs. ${home}</div>`;
  }

  function formatDateLabel(rawDate) {
    if (!rawDate) return rawDate;
    const suffixMatch = rawDate.match(/^(\d{4}-\d{2}-\d{2})(.*)$/);
    if (!suffixMatch) return rawDate;
    const [, isoDate, suffix] = suffixMatch;
    const [year, month, day] = isoDate.split('-');
    return `${month}/${day}/${year}${suffix}`;
  }

  function formatBothTimes(dateStr, timeStr) {
    if (!timeStr) return '';
    const dateMatch = (dateStr || '').match(/^(\d{4})-(\d{2})-(\d{2})/);
    const timeMatch = timeStr.match(/^(\d{1,2}):(\d{2})\s*(AM|PM)$/i);
    if (!dateMatch || !timeMatch) return timeStr;

    const [, y, m, d] = dateMatch;
    let [, hh, mm, ampm] = timeMatch;
    hh = parseInt(hh, 10);
    if (ampm.toUpperCase() === 'PM' && hh !== 12) hh += 12;
    if (ampm.toUpperCase() === 'AM' && hh === 12) hh = 0;

    const utcMoment = new Date(Date.UTC(
      parseInt(y, 10), parseInt(m, 10) - 1, parseInt(d, 10), hh + 7, parseInt(mm, 10)
    ));

    const etTime = new Intl.DateTimeFormat('en-US', {
      timeZone: 'America/New_York',
      hour: 'numeric',
      minute: '2-digit',
      hour12: true,
      timeZoneName: 'short',
    }).format(utcMoment);

    return `<span class="time-wrap"><span class="time-line">${etTime}</span><span class="time-divider"></span><span class="time-line">${timeStr} MST</span></span>`;
  }

  function renderGames() {
    const content = document.getElementById('content');
    let games = allGames;

    if (currentTeam) {
      games = games.filter(g =>
        g.away_team === currentTeam || g.home_team === currentTeam || g.game_type === 'Fall Stars Game'
      );
    }
    if (currentDate) {
      games = games.filter(g => (g.date || '').startsWith(currentDate));
    }

    const todayISO = getArizonaTodayISO();
    let orderedGames = games;
    if (!chronoOrderChecked) {
      const upcoming = games.filter(g => (g.date || '').slice(0, 10) >= todayISO);
      const played = games.filter(g => (g.date || '').slice(0, 10) < todayISO);
      orderedGames = upcoming.concat(played);
    }

    const groupOrder = [];
    const groups = {};
    orderedGames.forEach(g => {
      const key = g.date || 'Unknown date';
      if (!groups[key]) { groups[key] = []; groupOrder.push(key); }
      groups[key].push(g);
    });

    content.innerHTML = '';
    let previousWasUpcoming = null;

    groupOrder.forEach((dateLabel, idx) => {
      if (!chronoOrderChecked) {
        const isUpcomingGroup = dateLabel.slice(0, 10) >= todayISO;
        if (previousWasUpcoming === true && isUpcomingGroup === false) {
          const divider = document.createElement('div');
          divider.className = 'season-divider';
          divider.textContent = 'Games Completed';
          content.appendChild(divider);
        }
        previousWasUpcoming = isUpcomingGroup;
      }

      const section = document.createElement('div');
      section.className = 'day-group';

      const labelRow = document.createElement('div');
      labelRow.className = 'day-label-row';

      const label = document.createElement('div');
      label.className = 'day-label';
      label.textContent = formatDateLabel(dateLabel);
      labelRow.appendChild(label);

      if (idx === 0) {
        const toggleLabel = document.createElement('label');
        toggleLabel.className = 'chrono-toggle';
        const cb = document.createElement('input');
        cb.type = 'checkbox';
        cb.checked = chronoOrderChecked;
        cb.onchange = () => {
          chronoOrderChecked = cb.checked;
          renderGames();
        };
        toggleLabel.appendChild(cb);
        toggleLabel.appendChild(document.createTextNode(' Start of season'));
        labelRow.appendChild(toggleLabel);
      }

      section.appendChild(labelRow);

      groups[dateLabel].forEach(g => {
        const row = document.createElement('div');
        row.className = 'game-row';
        const hasScore = g.away_score !== '' && g.away_score !== undefined && g.home_score !== '' && g.home_score !== undefined;
        const awayWon = hasScore && Number(g.away_score) > Number(g.home_score);
        const homeWon = hasScore && Number(g.home_score) > Number(g.away_score);
        row.innerHTML = `
          <div class="game-time">${formatBothTimes(g.date, g.time_az)}</div>
          <div>
            <div class="matchup">${teamLink(g.away_team, awayWon)}${scoreSpan(g.away_score, g.home_score)} @ ${teamLink(g.home_team, homeWon)}${scoreSpan(g.home_score, g.away_score)}</div>
            <div class="venue">${g.venue || ''}</div>
            ${decisionLine(g)}
            ${probableLine(g)}
            ${boxScoreSection(g)}
          </div>
          <div class="status ${statusClass(g.status)}">${g.status || ''}</div>
        `;
        section.appendChild(row);
      });

      content.appendChild(section);
    });

    if (groupOrder.length === 0) {
      const parts = [];
      if (currentTeam) parts.push(currentTeam);
      if (currentDate) parts.push(`on ${currentDate}`);
      content.innerHTML = parts.length
        ? `<p class="error">No games found for ${parts.join(' ')}.</p>`
        : '<p class="error">No games found for this season.</p>';
    }
  }

  async function loadSchedule() {
    const content = document.getElementById('content');
    content.innerHTML = '<p class="loading">Loading schedule...</p>';

    try {
      const res = await fetch(`data/${currentSeason}/schedule.csv`);
      if (!res.ok) throw new Error('Schedule not found for this season yet.');
      const text = await res.text();
      allGames = parseCSV(text);
      populateTeamFilterOptions();

      decisionsByGame = {};
      try {
        const decRes = await fetch(`data/${currentSeason}/decisions.csv`);
        if (decRes.ok) {
          const decText = await decRes.text();
          parseCSV(decText).forEach(d => { decisionsByGame[d.game_pk] = d; });
        }
      } catch (e) {
        // decisions.csv is optional -- schedule still renders without it
      }

      pitcherStatsById = {};
      try {
        const statsRes = await fetch(`data/${currentSeason}/pitcher_stats.csv`);
        if (statsRes.ok) {
          const statsText = await statsRes.text();
          parseCSV(statsText).forEach(p => { pitcherStatsById[p.pitcher_id] = p; });
        }
      } catch (e) {
        // pitcher_stats.csv is optional -- schedule still renders without it
      }

      pitchingGameLogsByKey = {};
      pitchingGameLogsByGame = {};
      try {
        const res = await fetch(`data/${currentSeason}/pitching_gamelogs.csv`);
        if (res.ok) {
          const text = await res.text();
          parseCSV(text).forEach(r => {
            pitchingGameLogsByKey[`${r.game_pk}_${r.pitcher_id}`] = r;
            (pitchingGameLogsByGame[r.game_pk] = pitchingGameLogsByGame[r.game_pk] || []).push(r);
            (pitchingGameLogsByPlayer[r.pitcher_id] = pitchingGameLogsByPlayer[r.pitcher_id] || []).push(r);
          });
        }
      } catch (e) {
        // pitching_gamelogs.csv is optional -- older seasons may not have it yet
      }

      hittingGameLogsByKey = {};
      hittingGameLogsByPlayer = {};
      try {
        const res = await fetch(`data/${currentSeason}/hitting_gamelogs.csv`);
        if (res.ok) {
          const text = await res.text();
          parseCSV(text).forEach(r => {
            hittingGameLogsByKey[`${r.game_pk}_${r.player_id}`] = r;
            (hittingGameLogsByPlayer[r.player_id] = hittingGameLogsByPlayer[r.player_id] || []).push(r);
          });
        }
      } catch (e) {
        // hitting_gamelogs.csv is optional
      }

      lineupsByGame = {};
      try {
        const res = await fetch(`data/${currentSeason}/batting_lineups.csv`);
        if (res.ok) {
          const text = await res.text();
          parseCSV(text).forEach(r => {
            (lineupsByGame[r.game_pk] = lineupsByGame[r.game_pk] || []).push(r);
          });
        }
      } catch (e) {
        // batting_lineups.csv is optional -- older seasons may not have it yet
      }

      pitcherAppearancesByGame = {};
      try {
        const res = await fetch(`data/${currentSeason}/pitcher_appearances.csv`);
        if (res.ok) {
          const text = await res.text();
          parseCSV(text).forEach(r => {
            (pitcherAppearancesByGame[r.game_pk] = pitcherAppearancesByGame[r.game_pk] || []).push(r);
          });
        }
      } catch (e) {
        // pitcher_appearances.csv is optional -- older seasons may not have it yet
      }

      renderBanner();
      renderGames();
    } catch (err) {
      content.innerHTML = `<p class="error">Couldn't load the schedule: ${err.message}</p>`;
    }
  }

  async function init() {
    await loadSeasons();
    renderControls();
    setupFilterControls();
    loadSchedule();
  }

  init();
</script>

</body>
</html>
