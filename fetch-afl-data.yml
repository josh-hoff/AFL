name: Fetch AFL data

on:
  schedule:
    # Once a month, Jan-Jun (1st of the month at 12:00 UTC)
    - cron: '0 12 1 1-6 *'
    # Every day, Jul-Dec, at 12:00 UTC
    - cron: '0 12 * 7-12 *'
  workflow_dispatch: {}

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch current season schedule
        run: python fetch_afl_schedule.py

      - name: Fetch current season pitch data
        run: python fetch_afl_pitches.py

      - name: Fetch current season pitcher stats
        run: python fetch_afl_pitcher_stats.py

      - name: Commit and push updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && echo "No data changes to commit." || git commit -m "Automated AFL data update"
          git push
